function weekNo(s){const d=new Date(s.trim());if(isNaN(d))return '(日期无效)';const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return 'ISO 周数：'+Math.ceil(((t-y0)/86400000+1)/7)}

function age(s){const d=new Date(s.trim());if(isNaN(d))return '(日期无效)';const n=new Date();let y=n.getFullYear()-d.getFullYear();const m=n.getMonth()-d.getMonth();if(m<0||(m===0&&n.getDate()<d.getDate()))y--;const days=Math.floor((n-d)/86400000);return `年龄：${y} 岁\n累计天数：${days}`}
function countdown(s){const d=new Date(s.trim());if(isNaN(d))return '(日期无效)';let ms=d-new Date();const sign=ms<0?'已过 ':-'';ms=Math.abs(ms);const dd=Math.floor(ms/86400000);const hh=Math.floor(ms%86400000/3600000);return `${sign}${dd} 天 ${hh} 小时`}
function workdays(s){const m=s.trim().match(/^(\d{4})-(\d{2})$/);if(!m)return '格式：2026-11';const y=+m[1],mo=+m[2];const last=new Date(y,mo,0).getDate();let n=0;for(let d=1;d<=last;d++){const w=new Date(y,mo-1,d).getDay();if(w!==0&&w!==6)n++}return `${m[1]}-${m[2]} 工作日：${n} 天（不含法定节假日调休）`}
function duration(s){let n=Number(s.trim());if(isNaN(n))return '(请输入秒数)';const h=Math.floor(n/3600),m=Math.floor(n%3600/60),sec=n%60;return `${h} 小时 ${m} 分 ${sec} 秒`}
function monthdays(s){const m=s.trim().match(/^(\d{4})-(\d{1,2})$/);if(!m)return '格式：2026-11';const y=+m[1],mo=+m[2];const n=new Date(y,mo,0).getDate();return `${m[1]}-${String(mo).padStart(2,'0')} 共 ${n} 天`}
function tz(s){const m=s.trim().match(/^(.+?)\s*,\s*([+-]?\d+(?:\.\d+)?)\s*,\s*([+-]?\d+(?:\.\d+)?)$/);if(!m)return '格式：2026-01-01 10:00, +8, -5';const d=new Date(m[1]);if(isNaN(d))return '(时间无效)';const diff=(Number(m[3])-Number(m[2]))*3600000;const t=new Date(d.getTime()+diff);return `源：${m[1]} (UTC${m[2]})\n目标：${t.toISOString().replace('T',' ').slice(0,16)} (UTC${m[3]})`}

function tTrim(s){return s.split(/\r?\n/).map(x=>x.trim()).join('\n')}
function tNoEmpty(s){return s.split(/\r?\n/).filter(x=>x.trim()).join('\n')}
function tDedupe(s){const seen=new Set();return s.split(/\r?\n/).filter(x=>{if(seen.has(x))return false;seen.add(x);return true}).join('\n')}
function tSort(s){return s.split(/\r?\n/).sort((a,b)=>a.localeCompare(b,'zh')).join('\n')}
function tLineNo(s){return s.split(/\r?\n/).map((x,i)=>`${i+1}. ${x}`).join('\n')}
function tAffix(s){const lines=s.split(/\r?\n/);const [pre,suf]=(lines.shift()||'|').split('|');return lines.map(x=>pre+x+(suf||'')).join('\n')}
function tUpper(s){return s.toUpperCase()}
function tLower(s){return s.toLowerCase()}
function tTab(s){const lines=s.split(/\r?\n/);const n=Number((lines.shift()||'4').trim())||4;return lines.map(x=>x.replace(/\t/g,' '.repeat(n))).join('\n')}
function tFull2Half(s){return s.replace(/[\uFF01-\uFF5E]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/\u3000/g,' ')}
function tSqueeze(s){return s.split(/\r?\n/).map(x=>x.replace(/[ \t]+/g,' ').trim()).join('\n')}
function tJoin(s){const lines=s.split(/\r?\n/);const sep=lines.shift()||',';return lines.filter(x=>x.trim()).join(sep)}

function cHex2Rgb(s){const h=s.trim().replace('#','');if(!/^[0-9a-fA-F]{6}$/.test(h))return '(请输入 #RRGGBB)';return `rgb(${parseInt(h.slice(0,2),16)}, ${parseInt(h.slice(2,4),16)}, ${parseInt(h.slice(4,6),16)})`}
function cRgb2Hex(s){const m=s.match(/(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);if(!m)return '格式：12,34,56';return '#'+[m[1],m[2],m[3]].map(x=>Math.max(0,Math.min(255,+x)).toString(16).padStart(2,'0')).join('')}
function rgbOf(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function cHex2Hsl(s){const [r,g,b]=rgbOf(s.trim()).map(x=>x/255);const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,sat=0,l=(mx+mn)/2;if(mx!==mn){const d=mx-mn;sat=l>0.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4);h*=60}return `hsl(${Math.round(h)}, ${Math.round(sat*100)}%, ${Math.round(l*100)}%)`}
function cHsl2Hex(s){const m=s.match(/(\d+)\s*,\s*(\d+)%?\s*,\s*(\d+)%?/);if(!m)return '格式：210, 40%, 50%';let h=+m[1]/360,sat=+m[2]/100,l=+m[3]/100;const f=n=>{const k=(n+h*12)%12;const a=sat*Math.min(l,1-l);return Math.round((l-a*Math.max(-1,Math.min(k-3,9-k,1)))*255).toString(16).padStart(2,'0')};return '#'+f(0)+f(8)+f(4)}
function shift(h,p){let [r,g,b]=rgbOf(h);const f=v=>Math.max(0,Math.min(255,Math.round(v+255*p))).toString(16).padStart(2,'0');return '#'+f(r)+f(g)+f(b)}
function cLighten(s){const [h,p]=s.split(/[\s,]+/);return shift(h.trim(), (Number(p)||10)/100)}
function cDarken(s){const [h,p]=s.split(/[\s,]+/);return shift(h.trim(), -(Number(p)||10)/100)}
function cRgba(s){const [h,a]=s.split(/[\s,]+/);const [r,g,b]=rgbOf(h.trim());return `rgba(${r}, ${g}, ${b}, ${Number(a)||0.5})`}
function lum(h){const c=rgbOf(h).map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)});return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2]}
function cContrast(s){const p=s.split(/[\s,]+/);if(p.length<2)return '格式：#000000, #ffffff';const [a,b]=p.map(x=>lum(x.trim())).sort((x,y)=>y-x);return `对比度 ${((a+0.05)/(b+0.05)).toFixed(2)} : 1`}
function cLum(s){return `相对亮度 ${lum(s.trim()).toFixed(4)}`}
function cPalette(s){const h=s.trim();const steps=[-0.3,-0.15,0,0.15,0.3];return steps.map(p=>`${(p*100).toFixed(0).padStart(4)}%  ${shift(h,p)}`).join('\n')}
function cGradient(s){const p=s.split(/[\s,]+/);if(p.length<2)return '格式：#ff0000, #0000ff';return `background: linear-gradient(90deg, ${p[0]} 0%, ${p[1]} 100%);`}
function cShadow(s){return `box-shadow: 0 8px 24px rgba(0,0,0,0.12);\n/* 输入示例：0 8 24 #000 0.12 */`}

function mPercent(s){const [a,b]=s.split(/[\s,]+/).map(Number);if(!isFinite(a)||!isFinite(b)||!b)return '格式：25, 200';return `${a} 是 ${b} 的 ${(a/b*100).toFixed(2)}%`}
function mPercentOf(s){const [p,b]=s.split(/[\s,]+/).map(Number);if(!isFinite(p)||!isFinite(b))return '格式：15, 200';return `${b} 的 ${p}% = ${(b*p/100).toFixed(2)}`}
function mDiscount(s){const [price,off]=s.split(/[\s,]+/).map(Number);if(!isFinite(price)||!isFinite(off))return '格式：199, 8.5（原价, 折扣）';const pay=price*off/10;return `原价 ${price} · ${off} 折 → 到手 ${pay.toFixed(2)}（省 ${(price-pay).toFixed(2)}）`}
function mTip(s){const [amt,pct]=s.split(/[\s,]+/).map(Number);if(!isFinite(amt)||!isFinite(pct))return '格式：200, 10';const tip=amt*pct/100;return `小费 ${tip.toFixed(2)} · 合计 ${(amt+tip).toFixed(2)}`}
function mBmi(s){const [h,w]=s.split(/[\s,]+/).map(Number);if(!isFinite(h)||!isFinite(w)||h<=0)return '格式：1.75, 70（米, 公斤）';const b=w/(h*h);const tag=b<18.5?'偏瘦':b<24?'正常':b<28?'超重':'肥胖';return `BMI ${b.toFixed(1)}（${tag}）`}
function gcd2(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a}
function mGcd(s){const a=s.split(/[\s,]+/).map(Number);if(a.length<2||a.some(x=>!isFinite(x)))return '格式：12, 18';return '最大公约数 '+a.reduce((x,y)=>gcd2(x,y))}
function mLcm(s){const a=s.split(/[\s,]+/).map(Number);if(a.length<2||a.some(x=>!isFinite(x)))return '格式：4, 6';return '最小公倍数 '+a.reduce((x,y)=>Math.abs(x*y)/gcd2(x,y))}
function mPrime(s){const n=parseInt(s.trim());if(!(n>1))return '(请输入 >1 的整数)';if(n%2===0&&n!==2)return `${n} 不是质数`;for(let i=3;i*i<=n;i+=2)if(n%i===0)return `${n} 不是质数（可被 ${i} 整除）`;return `${n} 是质数`}
function mFact(s){const n=parseInt(s.trim());if(!(n>=0)||n>170)return '(0~170 的整数)';let r=1;for(let i=2;i<=n;i++)r*=i;return `${n}! = ${r}`}
function mStats(s){const a=s.split(/[\s,]+/).map(Number).filter(x=>isFinite(x));if(!a.length)return '(请输入数字列表)';const sum=a.reduce((x,y)=>x+y,0);const sorted=[...a].sort((x,y)=>x-y);const med=sorted.length%2?sorted[(sorted.length-1)/2]:(sorted[sorted.length/2-1]+sorted[sorted.length/2])/2;return `个数 ${a.length}\n和 ${sum}\n均值 ${(sum/a.length).toFixed(4)}\n中位数 ${med}\n最小 ${sorted[0]} / 最大 ${sorted[sorted.length-1]}`}
function mSum(s){const a=s.split(/[\s,]+/).map(Number).filter(x=>isFinite(x));if(!a.length)return '(请输入数字列表)';return `求和 ${a.reduce((x,y)=>x+y,0)}\n求积 ${a.reduce((x,y)=>x*y,1)}`}
function mRatio(s){const parts=s.split(/[\s,]+/).map(Number);const total=parts.pop();if(!isFinite(total)||parts.some(x=>!isFinite(x))||!parts.length)return '格式：1, 2, 3, 600（比例项..., 总数）';const sum=parts.reduce((x,y)=>x+y,0);return parts.map((x,i)=>`第 ${i+1} 份：${(total*x/sum).toFixed(2)}`).join('\n')}

// ===== 图片处理（尺寸 / 体积 / 打印 / 切图）=====
function ratioStr(w,h){const g=(a,b)=>b?g(b,a%b):a;const d=g(w,h);return `${w/d}:${h/d}`}
function imgPixels(s){const m=s.trim().match(/^(\d+)\s*[,x×]\s*(\d+)$/);if(!m)return '格式：1920,1080';const w=+m[1],h=+m[2];return `尺寸 ${w}×${h}\n总像素 ${(w*h).toLocaleString()}\n约 ${(w*h/1e6).toFixed(2)} 百万像素\n最简比例 ${ratioStr(w,h)}\n@300dpi 打印 ${(w/300*2.54).toFixed(1)}×${(h/300*2.54).toFixed(1)} cm`}
function imgRatio(s){const m=s.trim().match(/^(\d+)\s*[,x×:]\s*(\d+)$/);if(!m)return '格式：1920,1080';const w=+m[1],h=+m[2];const r=w/h;return `原始 ${w}:${h}\n最简比 ${ratioStr(w,h)}\n宽高比 ${r.toFixed(3)}\n近似 ${r>1.7&&r<1.8?'16:9':r>1.3&&r<1.4?'4:3':r>2.3&&r<2.4?'21:9':r>0.99&&r<1.01?'1:1':r>0.74&&r<0.76?'3:4':'非常见比例'}`}
function imgResize(s){const p=s.trim().split(/[\s,]+/).map(Number);if(p.length<3||p.some(x=>!isFinite(x)||x<=0))return '格式：1920,1080,1280（宽,高,目标宽）';const [w,h,tw]=p;const th=Math.round(h*tw/w);return `原图 ${w}×${h}\n目标 ${tw}×${th}\n缩放 ${(tw/w*100).toFixed(1)}%\n目标像素 ${(tw*th/1e6).toFixed(2)} MP`}
function imgDpi(s){const p=s.trim().split(/[\s,]+/).map(Number);if(p.length<3)return '格式：3000,2000,300（宽px,高px,DPI）';const [w,h,d]=p;if(!(d>0))return '(DPI 需大于 0)';return `像素 ${w}×${h} @ ${d}dpi\n打印 ${(w/d).toFixed(2)}×${(h/d).toFixed(2)} 英寸\n打印 ${(w/d*2.54).toFixed(1)}×${(h/d*2.54).toFixed(1)} cm`}
function px2mm(s){const p=s.trim().split(/[\s,]+/).map(Number);if(p.length<2)return '格式：1000,300（像素,DPI）';const [px,d]=p;if(!(d>0))return '(DPI 需大于 0)';return `${px}px @ ${d}dpi = ${(px/d*25.4).toFixed(2)} mm（${(px/d*2.54).toFixed(2)} cm）`}
function mm2px(s){const p=s.trim().split(/[\s,]+/).map(Number);if(p.length<2)return '格式：100,300（毫米,DPI）';const [mm,d]=p;if(!(d>0))return '(DPI 需大于 0)';return `${mm}mm @ ${d}dpi = ${Math.round(mm/25.4*d)} px`}
function b64Size(s){const n=Number(s.trim());if(!isFinite(n)||n<0)return '格式：204800（原始字节数）';if(n===0)return '原始 0 B｜Base64 0 字符｜膨胀 0%';return `原始 ${n.toLocaleString()} B（${(n/1024).toFixed(1)} KB）\nBase64 字符 ${Math.ceil(n/3)*4}\nBase64 体积 ${(Math.ceil(n/3)*4/1024).toFixed(1)} KB\n膨胀 ${((Math.ceil(n/3)*4/n-1)*100).toFixed(1)}%`}
function cropRatio(s){const p=s.trim().split(/[\s,]+/);if(p.length<3)return '格式：1920,1080,4:3（宽,高,目标比例）';const w=+p[0],h=+p[1];const m=String(p[2]).match(/^(\d+(?:\.\d+)?):(\d+(?:\.\d+)?)$/);if(!m)return '比例格式：4:3';const tr=+m[1]/+m[2];let cw=w,ch=Math.round(w/tr);if(ch>h){ch=h;cw=Math.round(h*tr)}return `原图 ${w}×${h}\n目标 ${p[2]}\n裁后 ${cw}×${ch}\n裁掉 ${w-cw}px 宽 / ${h-ch}px 高`}
function wmPos(s){const p=s.trim().split(/[\s,]+/);if(p.length<5)return '格式：1920,1080,200,60,br（画宽,画高,水印宽,水印高,位置 tl/tr/bl/br/c）';const [w,h,ww,wh]=p.map(Number);const pos=String(p[4]).toLowerCase();const m=20;const x=pos.includes('l')?m:pos.includes('r')?w-ww-m:Math.round((w-ww)/2);const y=pos.includes('t')?m:pos.includes('b')?h-wh-m:Math.round((h-wh)/2);return `画布 ${w}×${h}\n水印 ${ww}×${wh}\n位置 ${pos}\n坐标 x=${x}, y=${y}\n右下角版权位 x=${w-ww-m}, y=${h-wh-m}`}
function imgBits(s){const p=s.trim().split(/[\s,]+/).map(Number);if(p.length<3)return '格式：1920,1080,24（宽,高,位深）';const [w,h,b]=p;const bytes=w*h*b/8;return `${w}×${h} @ ${b}bit\n未压缩 ${(bytes/1024/1024).toFixed(2)} MB\n${b===32?'含 Alpha 通道（4 通道）':`${b/8} 通道`}\nJPEG 约 ${(bytes/1024/1024*0.08).toFixed(2)} MB（按 10:1）`}
function fmtPick(s){const k=s.trim().toLowerCase();const map={photo:'JPEG / WebP / AVIF｜照片优先 AVIF，兼容回退 JPEG',screenshot:'PNG / WebP 无损｜文字边缘不糊',logo:'SVG / PNG｜需要缩放用 SVG',transparent:'PNG / WebP｜保留透明通道',icon:'SVG / PNG｜小图用 PNG-8',text:'PNG｜纯色文字压缩率高'};return map[k]||'可选：'+Object.keys(map).join(' / ')}
function tile9(s){const p=s.trim().split(/[\s,]+/).map(Number);if(p.length<2)return '格式：1080,1080（宽,高）';const [w,h]=p;const cw=Math.floor(w/3),ch=Math.floor(h/3);const rows=[];for(let r=0;r<3;r++)for(let c=0;c<3;c++)rows.push(`第 ${r*3+c+1} 块 x=${c*cw} y=${r*ch} ${cw}×${ch}`);return `整图 ${w}×${h}\n单块 ${cw}×${ch}\n`+rows.join('\n')}

// ===== 安全隐私（脱敏 / 口令强度 / 隐私扫描）=====
function pwdClasses(s){let n=0;if(/[a-z]/.test(s))n++;if(/[A-Z]/.test(s))n++;if(/\d/.test(s))n++;if(/[^a-zA-Z0-9]/.test(s))n++;return n}
function pwdPool(s){let p=0;if(/[a-z]/.test(s))p+=26;if(/[A-Z]/.test(s))p+=26;if(/\d/.test(s))p+=10;if(/[^a-zA-Z0-9]/.test(s))p+=32;return p||1}
function pwdStrength(s){const t=s.trim();if(!t)return '请输入待检测的密码';const L=t.length,C=pwdClasses(t),P=pwdPool(t);const bits=Math.round(L*Math.log2(P));const weak=/^(?:\d+|[a-z]+|[A-Z]+)$/.test(t);const common=['123456','password','qwerty','111111','abc123','admin','letmein'].includes(t.toLowerCase());const score=common||weak?1:L<8?2:bits<50?2:bits<70?3:bits<90?4:5;return `长度 ${L}｜字符类 ${C}/4｜字符池 ${P}\n熵 ${bits} bits\n评级 ${['','极弱','弱','中','强','很强'][score]}\n${common?'⚠ 命中常见弱口令':weak?'⚠ 单一字符类型':'建议 ≥12 位并混合四类字符'}`}
function pwdGen(s){const n=Math.min(Math.max(parseInt(s.trim())||16,4),128);const cs='abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%^&*-_=+';let r='';const buf=new Uint32Array(n);(crypto.getRandomValues?crypto.getRandomValues(buf):buf.forEach((_,i)=>buf[i]=Math.random()*4294967296));for(let i=0;i<n;i++)r+=cs[buf[i]%cs.length];return `长度 ${n}\n${r}\n含小写/大写/数字/符号，已去除易混字符 0O1lI`}
function passphrase(s){const n=Math.min(Math.max(parseInt(s.trim())||4,3),8);const W=['amber','breeze','cobalt','delta','ember','fjord','glide','harbor','indigo','jasper','kite','lunar','maple','nectar','onyx','pearl','quartz','river','solar','tundra','umber','violet','willow','xenon','yonder','zephyr','anchor','bloom','cedar','drift','echo','frost'];const pick=[];const buf=new Uint32Array(n);(crypto.getRandomValues?crypto.getRandomValues(buf):buf.forEach((_,i)=>buf[i]=Math.random()*4294967296));for(let i=0;i<n;i++)pick.push(W[buf[i]%W.length]);const p=pick.join('-');return `词数 ${n}\n${p}\n熵约 ${Math.round(n*Math.log2(W.length))} bits（易记型）`}
function maskPhone(s){const t=s.trim().replace(/\s|-/g,'');if(!/^\d{11}$/.test(t))return '格式：13812345678（11 位手机号）';return `${t.slice(0,3)}****${t.slice(7)}`}
function maskId(s){const t=s.trim().toUpperCase();if(!/^\d{17}[\dX]$/.test(t))return '格式：110101199001011234（18 位身份证）';return `${t.slice(0,6)}********${t.slice(14)}`}
function maskEmail(s){const t=s.trim();const m=t.match(/^([^@]+)@(.+)$/);if(!m)return '格式：name@example.com';const u=m[1];const head=u.length<=2?u[0]+'*':u[0]+'*'.repeat(Math.min(u.length-2,4))+u[u.length-1];return `${head}@${m[2]}`}
function maskCard(s){const t=s.trim().replace(/\s|-/g,'');if(!/^\d{12,19}$/.test(t))return '格式：6222021234567890123（12~19 位卡号）';return `${t.slice(0,4)} **** **** ${t.slice(-4)}\n长度 ${t.length}｜Luhn ${luhnOk(t)?'通过':'未通过'}`}
function luhnOk(t){let n=0,alt=false;for(let i=t.length-1;i>=0;i--){let d=+t[i];if(alt){d*=2;if(d>9)d-=9}n+=d;alt=!alt}return n%10===0}
function maskName(s){const t=s.trim();if(!t)return '请输入姓名';if(t.length===1)return t;if(t.length===2)return t[0]+'*';return t[0]+'*'.repeat(t.length-1)}
function urlStrip(s){const t=s.trim();if(!/^https?:\/\//.test(t))return '格式：https://a.com/path?token=abc&id=1';const SENS=/^(token|key|apikey|access_token|secret|password|pwd|sig|signature|session|sid|auth|code)$/i;const u=new URL(t);let n=0;const keep=[];u.searchParams.forEach((v,k)=>{if(SENS.test(k)){keep.push(`${k}=***`);n++}else keep.push(`${k}=${v}`)});return `${u.origin}${u.pathname}${keep.length?'?'+keep.join('&'):''}\n已遮盖 ${n} 个敏感参数`}

function agentMd2Html(s){

function agentZod(s){

function agentStructDiff(s){

  let a,b;try{a=JSON.parse(s.slice(0,i));b=JSON.parse(s.slice(i+5))}catch(e){return 'JSON 解析失败：'+e.message}

    if(typeof x!==typeof y||Array.isArray(x)!==Array.isArray(y)||(x===null)!==(y===null)){out.push('~ '+p+'：类型变化');return}
    if(x&&typeof x==='object'){
      const ka=Object.keys(x),kb=Object.keys(y);
      for(const k of ka)if(!(k in y))out.push('- '+p+'.'+k+'（删除）');
      for(const k of kb)if(!(k in x))out.push('+ '+p+'.'+k+'（新增）');
      for(const k of ka)if(k in y)walk(x[k],y[k],p+'.'+k);

async function agentHmac(s){

    const sig=await crypto.subtle.sign('HMAC',k,enc.encode(msg));

    const salted=await crypto.subtle.digest('SHA-256',enc.encode(key+':'+msg));
    const shex=[...new Uint8Array(salted)].map(b=>b.toString(16).padStart(2,'0')).join('');
    return 'HMAC-SHA256: '+hex+'\n加盐 SHA-256(key:msg): '+shex+'\n密钥长度 '+key.length+'｜消息长度 '+msg.length
  }catch(e){return '计算失败：'+e.message}
}

  if(p&&p.iat)out.push('iat: '+new Date(p.iat*1000).toISOString());
  out.push('signature: '+(parts[2]?'已提供（长度 '+parts[2].length+'）':'缺失'));

}
function agentJ2Yaml(s){
  let o;try{o=JSON.parse(s)}catch(e){return '解析失败：'+e.message}
  const q=v=>{
    if(v===null)return 'null';
    if(typeof v==='number'||typeof v==='boolean')return String(v);
    if(typeof v==='string')return /^[A-Za-z0-9_\-./\u4e00-\u9fa5]+$/.test(v)&&!/^(true|false|null|yes|no)$/i.test(v)?v:JSON.stringify(v);
    return JSON.stringify(v);

  const walk=(v,ind)=>{
    const p='  '.repeat(ind);
    if(Array.isArray(v)){if(!v.length)return '[]';return v.map(x=>typeof x==='object'&&x!==null?p+'- '+walk(x,ind+1).trim():p+'- '+q(x)).join('\n')}

  };

}
function agentRing(s){

function agentTable2Json(s){

const ID_W=[7,9,10,5,8,4,2,1,6,3,7,9,10,5,8,4,2];
const ID_C=['1','0','X','9','8','7','6','5','4','3','2'];
const PROV={11:'北京',12:'天津',13:'河北',14:'山西',15:'内蒙古',21:'辽宁',22:'吉林',23:'黑龙江',31:'上海',32:'江苏',33:'浙江',34:'安徽',35:'福建',36:'江西',37:'山东',41:'河南',42:'湖北',43:'湖南',44:'广东',45:'广西',46:'海南',50:'重庆',51:'四川',52:'贵州',53:'云南',54:'西藏',61:'陕西',62:'甘肃',63:'青海',64:'宁夏',65:'新疆',71:'台湾',81:'香港',82:'澳门'};
function idcardCheck(s){
  const t=s.trim().toUpperCase();
  if(!/^\d{17}[\dX]$/.test(t))return '格式：18 位身份证号（末位可为 X）\n当前长度 '+t.length;
  let sum=0;for(let i=0;i<17;i++)sum+=+t[i]*ID_W[i];
  const expect=ID_C[sum%11];
  const birth=t.slice(6,14);
  const y=+birth.slice(0,4),m=+birth.slice(4,6),d=+birth.slice(6,8);
  const dt=new Date(Date.UTC(y,m-1,d));
  const dateOk=dt.getUTCFullYear()===y&&dt.getUTCMonth()===m-1&&dt.getUTCDate()===d;
  const age=dateOk?Math.floor((Date.now()-dt.getTime())/31557600000):null;
  const prov=PROV[+t.slice(0,2)]||'未知地区';
  return '校验位 '+(t[17]===expect?'✓ 通过':'✗ 不匹配（应为 '+expect+'）')+
    '\n出生日期 '+(dateOk?birth.slice(0,4)+'-'+birth.slice(4,6)+'-'+birth.slice(6,8)+'（约 '+age+' 岁）':'✗ 无效 '+birth)+
    '\n性别 '+((+t[16])%2?'男':'女')+
    '\n归属地 '+prov+
    '\n长度 '+t.length+'｜模式 ✓'
}
function luhnSum(t){let n=0,alt=false;for(let i=t.length-1;i>=0;i--){let d=+t[i];if(alt){d*=2;if(d>9)d-=9}n+=d;alt=!alt}return n}
function cardOrg(t){
  if(/^4/.test(t))return 'Visa';
  if(/^(5[1-5]|2[2-7])/.test(t))return 'MasterCard';
  if(/^3[47]/.test(t))return 'American Express';
  if(/^35/.test(t))return 'JCB';
  if(/^(6011|65)/.test(t))return 'Discover';
  if(/^62/.test(t))return '银联 UnionPay';
  return '未识别（按 Luhn 判定）';
}
function bankcardCheck(s){
  const t=s.trim().replace(/[\s-]/g,'');
  if(!/^\d{12,19}$/.test(t))return '格式：12~19 位卡号（可含空格/短横）';
  const ok=luhnSum(t)%10===0;
  return (ok?'✓ Luhn 通过':'✗ Luhn 未通过')+
    '\n卡组织 '+cardOrg(t)+
    '\n长度 '+t.length+'｜首 6 位 '+t.slice(0,6)+'｜末 4 位 '+t.slice(-4)+
    '\n提示：仅做格式校验，不查询发卡行、不联网'
}
const USCC_C='0123456789ABCDEFGHJKLMNPQRTUWXY';
const USCC_W=[1,3,9,27,19,26,16,17,20,29,25,13,8,24,10,30,28];
function usccCheck(s){
  const t=s.trim().toUpperCase();
  if(!/^[0-9A-HJ-NPQRTUWXY]{18}$/.test(t))return '格式：18 位统一社会信用代码（不含 I O S V Z）';
  let sum=0,bad='';
  for(let i=0;i<17;i++){const k=USCC_C.indexOf(t[i]);if(k<0){bad='第 '+(i+1)+' 位非法';break}sum+=k*USCC_W[i]}
  if(bad)return '✗ '+bad;
  const c=31-(sum%31);
  const expect=USCC_C[c===31?0:c];
  return (t[17]===expect?'✓ 校验位通过':'✗ 校验位不匹配（应为 '+expect+'）')+
    '\n登记管理部门 '+t.slice(0,1)+'｜机构类别 '+t.slice(1,2)+
    '\n行政区划 '+t.slice(2,8)+'｜主体标识码 '+t.slice(8,17)
}
function imeiCheck(s){
  const t=s.trim().replace(/[\s-]/g,'');
  if(!/^\d{15}$/.test(t))return '格式：15 位 IMEI（可含空格/短横）';
  const ok=luhnSum(t)%10===0;
  return (ok?'✓ Luhn 通过':'✗ Luhn 未通过')+
    '\nTAC（前 8 位）'+t.slice(0,8)+
    '\n序列号 '+t.slice(8,14)+'｜校验位 '+t[14]+
    '\n提示：仅做格式校验，不查询机型数据库'
}
function contactsCheck(s){
  const lines=s.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  if(!lines.length)return '每行一个手机号或邮箱';
  const phone=[],mail=[],bad=[];
  for(const x of lines){
    if(/^1[3-9]\d{9}$/.test(x))phone.push(x);
    else if(/^[\w.+-]+@[\w-]+(\.[\w-]+)+$/.test(x))mail.push(x);
    else bad.push(x);
  }
  const show=(arr)=>arr.slice(0,10).join(', ')+(arr.length>10?' …共 '+arr.length+' 条':'');
  return '共 '+lines.length+' 行｜手机号 '+phone.length+'｜邮箱 '+mail.length+'｜无效 '+bad.length+
    (phone.length?'\n手机号：'+show(phone):'')+
    (mail.length?'\n邮箱：'+show(mail):'')+
    (bad.length?'\n无效：'+show(bad):'')+
    '\n提示：全部本地处理，不上传、不校验真实性'
}

// ===== 工资与税费计算（个税 / 年终奖 / 加班费 / 请假 / 到手反推）=====
const TAX_M=[[3000,0.03,0],[12000,0.10,210],[25000,0.20,1410],[35000,0.25,2660],[55000,0.30,4410],[80000,0.35,7160],[1e12,0.45,15160]];
const TAX_Y=[[36000,0.03,0],[144000,0.10,2520],[300000,0.20,16920],[420000,0.25,31920],[660000,0.30,52920],[960000,0.35,85920],[1e12,0.45,181920]];
function taxBy(t,tbl){if(t<=0)return 0;for(const [cap,r,q] of tbl){if(t<=cap)return Math.max(0,t*r-q)}return 0}
function nums4(s){return s.split(/[\s,，]+/).map(Number)}
function salaryNet(s){
  const p=nums4(s);if(p.length<1||p.some(x=>!isFinite(x)))return '格式：月薪,五险一金,专项附加扣除，如 10000,2000,1000';
  const [gross,ins=0,special=0]=p;
  const taxable=Math.max(0,gross-ins-5000-special);
  const tax=taxBy(taxable,TAX_M);
  return '税前 '+gross.toFixed(2)+'\n五险一金 '+ins.toFixed(2)+'\n应纳税所得额 '+taxable.toFixed(2)+
    '\n个税（月度估算）'+tax.toFixed(2)+'\n到手 '+(gross-ins-tax).toFixed(2)+
    '\n提示：按月度税率表估算，未计累计预扣、地区差异与专项附加细则'
}
function bonusTax(s){
  const p=nums4(s);if(p.length<2||p.some(x=>!isFinite(x)))return '格式：年终奖,月薪,五险一金,专项附加，如 36000,10000,2000,1000';
  const [bonus,salary,ins=0,special=0]=p;
  const monthly=bonus/12;
  // 单独计税：bonus 全额 × 对应月度档税率 − 速算扣除数（月度表）
  let rate=0.03,quick=0;
  for(const [cap,r,q] of TAX_M){if(monthly<=cap){rate=r;quick=q;break}}
  const separate=Math.max(0,bonus*rate-quick);
  const baseTaxable=Math.max(0,salary*12-ins*12-60000-special*12);
  const salaryOnly=taxBy(baseTaxable,TAX_Y);
  const combined=taxBy(baseTaxable+bonus,TAX_Y);
  const mergedExtra=combined-salaryOnly;
  return '年终奖 '+bonus.toFixed(2)+'（月均 '+monthly.toFixed(2)+'）\n'+
    '单独计税 '+separate.toFixed(2)+'\n并入综合所得增量 '+mergedExtra.toFixed(2)+
    '\n建议 '+(separate<=mergedExtra?'单独计税（省 '+(mergedExtra-separate).toFixed(2)+'）':'并入综合所得（省 '+(separate-mergedExtra).toFixed(2)+'）')+
    '\n提示：估算值，未计一次性奖金特殊档与地方口径'
}
function overtimePay(s){
  const p=nums4(s);if(p.length<2||p.some(x=>!isFinite(x)))return '格式：月薪,工作日加班小时,休息日加班小时,法定加班小时';
  const [salary,wd=0,rest=0,legal=0]=p;
  const hourly=salary/21.75/8;
  const a=hourly*wd*1.5,b=hourly*rest*2,c=hourly*legal*3;
  return '小时工资 '+hourly.toFixed(2)+'\n工作日加班 '+a.toFixed(2)+'（1.5×）'+
    '\n休息日加班 '+b.toFixed(2)+'（2×）'+'\n法定节假日 '+c.toFixed(2)+'（3×）'+
    '\n合计 '+(a+b+c).toFixed(2)+'\n提示：按 21.75 天/月、8 小时/天估算，休息日可优先安排调休'
}
function leaveDeduct(s){
  const p=nums4(s);if(p.length<2||p.some(x=>!isFinite(x)))return '格式：月薪,事假天数,病假天数,病假工资系数（默认 0.6）';
  const [salary,personal=0,sick=0,ratio=0.6]=p;
  const daily=salary/21.75;
  const a=daily*personal,b=daily*sick*ratio;
  return '日工资 '+daily.toFixed(2)+'\n事假扣款 '+a.toFixed(2)+'（全扣）'+
    '\n病假扣款 '+b.toFixed(2)+'（按 '+(ratio*100).toFixed(0)+'% 发，扣 '+(100-ratio*100).toFixed(0)+'%）'+
    '\n合计扣款 '+(a+b).toFixed(2)+'\n提示：病假系数与最低工资下限按当地规定，结果仅供参考'
}
function grossFromNet(s){
  const p=nums4(s);if(p.length<1||p.some(x=>!isFinite(x)))return '格式：目标到手,五险一金,专项附加扣除，如 8000,2000,1000';
  const [target,ins=0,special=0]=p;
  let lo=target,hi=target*3+50000;
  for(let i=0;i<80;i++){
    const mid=(lo+hi)/2;
    const taxable=Math.max(0,mid-ins-5000-special);
    const net=mid-ins-taxBy(taxable,TAX_M);
    if(net<target)lo=mid;else hi=mid;
  }
  const gross=(lo+hi)/2;
  const tax=taxBy(Math.max(0,gross-ins-5000-special),TAX_M);
  return '目标到手 '+target.toFixed(2)+'\n反推税前 '+gross.toFixed(2)+
    '\n其中个税 '+tax.toFixed(2)+'｜五险一金 '+ins.toFixed(2)+
    '\n提示：按月度税率表反解，实际以单位申报为准'
}

// ===== 文本整理与格式（标点 / 空格 / 轻加密 / 去标记 / INI）=====
function isCJK(c){return /[\u4e00-\u9fa5]/.test(c||'')}
function enPunctToCn(s){
  const M={',':'，','.':'。','!':'！','?':'？',':':'：',';':'；','(':'（',')':'）'};
  let o='';
  for(let i=0;i<s.length;i++){
    const c=s[i];
    if(M[c]&&(isCJK(s[i-1])||isCJK(s[i+1])))o+=M[c];else o+=c;
  }
  return o
}
function cnPunctToEn(s){
  const M={'，':',','。':'.','！':'!','？':'?','：':':','；':';','（':'(',')':')','“':'"','”':'"','‘':"'",'’':"'"};
  return [...s].map(c=>M[c]||c).join('')
}
function cjkSpace(s){
  let t=s.replace(/[ \t]+/g,' ');
  t=t.replace(/([\u4e00-\u9fa5])([A-Za-z0-9])/g,'$1 $2');
  t=t.replace(/([A-Za-z0-9])([\u4e00-\u9fa5])/g,'$1 $2');
  return t.replace(/ +/g,' ').replace(/ *\n */g,'\n').trim()
}
function rot47(s){return [...s].map(c=>{const n=c.charCodeAt(0);return n>=33&&n<=126?String.fromCharCode(33+((n-33+47)%94)):c}).join('')}
function atbash(s){return s.replace(/[a-zA-Z]/g,c=>{const b=c<='Z'?65:97;return String.fromCharCode(b+25-(c.charCodeAt(0)-b))})}
function cipherMix(s){
  if(!s.trim())return '输入文本，输出 ROT47 / Atbash / 反转 三种结果';
  return 'ROT47：'+rot47(s)+'\nAtbash：'+atbash(s)+'\n反转：'+[...s].reverse().join('')
}
function stripMarks(s){
  if(!s.trim())return '粘贴含 HTML / Markdown 标记的文本';
  let t=s.replace(/<script[\s\S]*?<\/script>/gi,'').replace(/<style[\s\S]*?<\/style>/gi,'');
  t=t.replace(/<[^>]+>/g,' ');
  t=t.replace(/!\[([^\]]*)\]\([^)]*\)/g,'$1').replace(/\[([^\]]+)\]\([^)]*\)/g,'$1');
  t=t.replace(/^#{1,6}\s+/gm,'').replace(/(\*\*|__)(.*?)\1/g,'$2').replace(/(\*|_)(.*?)\1/g,'$2');
  t=t.replace(/`{1,3}([^`]*)`{1,3}/g,'$1').replace(/^\s*[-*+]\s+/gm,'').replace(/^\s*>\s?/gm,'');
  t=t.replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"');
  return t.replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim()
}
function iniJson(s){
  const t=s.trim();
  if(!t)return '粘贴 INI（[节] + key=value）或 JSON 对象';
  if(t.startsWith('{')){
    let o;try{o=JSON.parse(t)}catch(e){return 'JSON 解析失败：'+e.message}
    if(Array.isArray(o))return '需要 JSON 对象（顶层不能是数组）';
    const out=[];
    for(const k of Object.keys(o)){
      const v=o[k];
      if(v&&typeof v==='object'&&!Array.isArray(v)){
        out.push('['+k+']');
        for(const kk of Object.keys(v))out.push(kk+'='+v[kk]);
        out.push('');
      }else out.push(k+'='+v);
    }
    return out.join('\n').trim()
  }
  const root={};let cur=root;let n=0;
  for(const raw of t.split(/\r?\n/)){
    const line=raw.trim();
    if(!line||line.startsWith(';')||line.startsWith('#'))continue;
    const sec=line.match(/^\[(.+)\]$/);
    if(sec){cur=root[sec[1]]=root[sec[1]]||{};n++;continue}
    const i=line.indexOf('=');
    if(i<0)return '第 '+(n+1)+' 段无法解析：'+line;
    cur[line.slice(0,i).trim()]=line.slice(i+1).trim();n++;
  }
  return JSON.stringify(root,null,2)
}
