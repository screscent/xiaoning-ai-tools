<body>
<header><div class="crumb"><a href="../legacy/index.html">← 分类导航</a> ｜ <a href="https://screscent.github.io/xiaoning-ai-tools/">统一门户</a></div>
<h1>JSON 代码生成合集</h1>
<div class="sub">12 个工具 · JSON 一键转代码 / DDL / Schema / 路径提取 · 纯前端本地处理</div></header>
<div class="bar"><div class="bar-in"><input id="q" placeholder="搜索工具（如 TypeScript / SQL / Schema）"><span class="chip" id="cnt"></span></div></div>
<nav class="tabs" id="tabs"></nav>
<main>
  <section id="home" class="cardgrid"></section>
  <section id="tool" class="panel" hidden>
    <h2 id="tname">—</h2><div class="hint" id="thint"></div>
    <div class="cols">
      <div><textarea id="inp" spellcheck="false"></textarea>
        <div class="row"><button id="sample">填入示例</button><button class="primary" id="run">生成</button><button id="copy">复制输出</button></div>
        <div class="err" id="err"></div></div>
      <div><pre id="out"></pre></div>
    </div>
  </section>
  <div id="empty" class="hint" hidden>没有匹配的工具，换个关键词</div>
</main>
<details><summary>使用说明</summary><div>① 选工具或直接访问 #/key 直达；② 全部本地处理，不上传数据；③ 输出可一键复制。</div></details>
<footer><div class="cols"><div>人类作者：月牙寂（龚浩华）｜联系：15980989344｜邮箱：29185807@qq.com｜微信公众号：月牙寂</div><div>Agent 作者：月绡凝（小凝）</div></div></footer>
<script>
const TOOLS = [
 {key:'ts',name:'TypeScript 接口',desc:'JSON → interface，含嵌套',tpl:'{"id":1,"name":"x","tags":["a"]}'},
 {key:'go',name:'Go 结构体',desc:'JSON → struct，带 json tag',tpl:'{"id":1,"name":"x"}'},
 {key:'java',name:'Java POJO',desc:'JSON → class',tpl:'{"id":1,"name":"x"}'},
 {key:'python',name:'Python dataclass',desc:'JSON → @dataclass',tpl:'{"id":1,"name":"x"}'},
 {key:'php',name:'PHP 类',desc:'JSON → class',tpl:'{"id":1,"name":"x"}'},
 {key:'rust',name:'Rust 结构体',desc:'JSON → struct + serde',tpl:'{"id":1,"name":"x"}'},
 {key:'kotlin',name:'Kotlin data class',desc:'JSON → data class',tpl:'{"id":1,"name":"x"}'},
 {key:'swift',name:'Swift Codable',desc:'JSON → struct: Codable',tpl:'{"id":1,"name":"x"}'},
 {key:'csharp',name:'C# 类',desc:'JSON → class',tpl:'{"id":1,"name":"x"}'},
 {key:'sql',name:'SQL DDL',desc:'JSON → CREATE TABLE',tpl:'{"id":1,"name":"x","ok":true}'},
 {key:'schema',name:'JSON Schema',desc:'JSON → Schema draft-07',tpl:'{"id":1,"name":"x"}'},
 {key:'path',name:'JSON Path 提取',desc:'路径 a.b[0].c',tpl:'{"a":{"b":[{"c":"hit"}]}}'}
];
const $=s=>document.querySelector(s);
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function typeOf(v){return Array.isArray(v)?'array':(v===null?'null':typeof v)}
function tsType(v,k){const t=typeOf(v);if(t==='array'){const first=v.length?v[0]:null;return (first&&typeof first==='object')?pascal(k)+'Item[]':goPrim(first)+'[]'}if(t==='object')return pascal(k);return ({string:'string',number:'number',boolean:'boolean',null:'null'})[t]||'unknown'}
function goPrim(v){const t=typeOf(v);return ({string:'string',number:'float64',boolean:'bool',null:'interface{}',array:'[]interface{}',object:'map[string]interface{}'})[t]||'interface{}'}
function pascal(k){return String(k||'Item').replace(/(^|[_\-\s])(\w)/g,(m,a,b)=>b.toUpperCase()).replace(/[^A-Za-z0-9]/g,'')||'Item'}

function genTs(o,k='Root'){let out=`interface ${pascal(k)} {\n`;for(const [key,v] of Object.entries(o)){out+=`  ${key}: ${tsType(v,key)};\n`}out+='}';const nested=[];for(const [key,v] of Object.entries(o)){if(typeOf(v)==='object')nested.push([v,key]);if(Array.isArray(v)&&v[0]&&typeof v[0]==='object')nested.push([v[0],key+'Item'])}return out+nested.map(([v,n])=>'\n\n'+genTs(v,n)).join('')}
function genGo(o,k='Root'){const n=pascal(k);let out=`type ${n} struct {\n`;for(const [key,v] of Object.entries(o)){out+=`\t${pascal(key)} ${goPrim(v)} \`json:"${key}"\`\n`}return out+'}'}
function genJava(o,k='Root'){let out=`public class ${pascal(k)} {\n`;for(const [key,v] of Object.entries(o)){const t={string:'String',number:'Double',boolean:'Boolean'}[typeof v]||'Object';out+=`    public ${t} ${key};\n`}return out+'}'}
function genPy(o,k='Root'){let out=`from dataclasses import dataclass\n\n@dataclass\nclass ${pascal(k)}:\n`;for(const [key,v] of Object.entries(o)){const t={string:'str',number:'float',boolean:'bool'}[typeof v]||'object';out+=`    ${key}: ${t}\n`}return out}
function genPhp(o,k='Root'){let out=`<?php\nclass ${pascal(k)} {\n`;for(const key of Object.keys(o)){out+=`    public $${key};\n`}return out+'}'}
function genRust(o,k='Root'){let out=`use serde::{Deserialize, Serialize};\n\n#[derive(Debug, Serialize, Deserialize)]\nstruct ${pascal(k)} {\n`;for(const [key,v] of Object.entries(o)){const t={string:'String',number:'f64',boolean:'bool'}[typeof v]||'serde_json::Value';out+=`    ${key}: ${t},\n`}return out+'}'}
function genKotlin(o,k='Root'){let out=`data class ${pascal(k)}(\n`;const parts=Object.entries(o).map(([key,v])=>{const t={string:'String',number:'Double',boolean:'Boolean'}[typeof v]||'Any';return `    val ${key}: ${t}? = null`});return out+parts.join(',\n')+'\n)'}
function genSwift(o,k='Root'){let out=`struct ${pascal(k)}: Codable {\n`;for(const [key,v] of Object.entries(o)){const t={string:'String',number:'Double',boolean:'Bool'}[typeof v]||'String';out+=`    let ${key}: ${t}?\n`}return out+'}'}
function genCs(o,k='Root'){let out=`public class ${pascal(k)} {\n`;for(const [key,v] of Object.entries(o)){const t={string:'string',number:'double',boolean:'bool'}[typeof v]||'object';out+=`    public ${t}? ${pascal(key)} { get; set; }\n`}return out+'}'}
function sqlType(v){if(Array.isArray(v))return 'TEXT';if(v===null)return 'TEXT';if(typeof v==='number')return Number.isInteger(v)?'INTEGER':'REAL';if(typeof v==='boolean')return 'BOOLEAN';return 'TEXT'}
function genSql(o,k='Root'){let out=`CREATE TABLE ${k.toLowerCase()} (\n`;out+=Object.entries(o).map(([key,v])=>`  ${key} ${sqlType(v)}`).join(',\n');return out+'\n);'}
function schemaOf(v){if(Array.isArray(v))return {type:'array',items:v.length?schemaOf(v[0]):{}};if(v===null)return {type:'null'};if(typeof v==='object'){const props={};const req=[];for(const [k2,v2] of Object.entries(v)){props[k2]=schemaOf(v2);req.push(k2)}return {type:'object',properties:props,required:req}}return {type:typeof v==='number'?(Number.isInteger(v)?'integer':'number'):typeof v}}
function genSchema(o){return JSON.stringify({$schema:'http://json-schema.org/draft-07/schema#',...schemaOf(o)},null,2)}
function getPath(o,p){const parts=p.replace(/\[(\d+)\]/g,'.$1').split('.').filter(Boolean);let cur=o;for(const k of parts){if(cur==null)return undefined;cur=cur[k]}return cur}
const GEN={ts:genTs,go:genGo,java:genJava,python:genPy,php:genPhp,rust:genRust,kotlin:genKotlin,swift:genSwift,csharp:genCs,sql:genSql,schema:genSchema,
 path:(o)=>{const p=(new URLSearchParams(location.search)).get('p')||'';const v=getPath(o,p);return v===undefined?'(路径不存在)':JSON.stringify(v,null,2)}}

function route(){
  const key=(location.hash||'').replace(/^#\//,'');
  const t=TOOLS.find(x=>x.key===key);
  document.querySelectorAll('nav.tabs a').forEach(a=>a.classList.toggle('on',a.dataset.k===key));
  if(!t){$('#home').hidden=false;$('#tool').hidden=true;return}
  $('#home').hidden=true;$('#tool').hidden=false;
  $('#tname').textContent=t.name; $('#thint').textContent=t.desc+' · 目标：'+t.name;
  if(!$('#inp').value.trim()){$('#inp').value=t.tpl}
  $('#err').textContent=''; $('#out').textContent='';
}
function run(){
  const key=(location.hash||'').replace(/^#\//,'');const t=TOOLS.find(x=>x.key===key);if(!t)return;
  let obj;try{obj=JSON.parse($('#inp').value)}catch(e){$('#err').textContent='JSON 解析失败：'+e.message;return}
  $('#err').textContent='';
  try{$('#out').textContent=GEN[key](obj)}catch(e){$('#err').textContent='生成失败：'+e.message}
}
function buildHome(){
  $('#tabs').innerHTML=TOOLS.map(t=>`<a href="#/${t.key}" data-k="${t.key}">${t.name}</a>`).join('');
  $('#home').innerHTML=TOOLS.map(t=>`<article class="card" data-search="${(t.name+t.desc).toLowerCase()}"><h3><a href="#/${t.key}">${t.name}</a></h3><p>${t.desc}</p><div class="row"><span class="chip">${t.key}</span><a href="#/${t.key}">打开 →</a></div></article>`).join('');
  $('#cnt').textContent=TOOLS.length+' 个工具';
}
buildHome();
$('#q').addEventListener('input',()=>{const v=$('#q').value.trim().toLowerCase();let n=0;document.querySelectorAll('#home .card').forEach(c=>{const hit=!v||c.dataset.search.includes(v);c.hidden=!hit;if(hit)n++});$('#empty').hidden=n>0;$('#cnt').textContent=n+' / '+TOOLS.length});
$('#run').addEventListener('click',run);
$('#sample').addEventListener('click',()=>{const key=(location.hash||'').replace(/^#\//,'');const t=TOOLS.find(x=>x.key===key);if(t)$('#inp').value=t.tpl});
$('#copy').addEventListener('click',()=>navigator.clipboard&&navigator.clipboard.writeText($('#out').textContent||''));
window.addEventListener('hashchange',route);
route();
if((location.hash||'').replace(/^#\//,''))run();
</script>
