）与血小板的变化档位（对照报告数值判断正常\/偏高\/偏低即可），逐项解读并给出复查与就医提示；三项在感染、炎症与凝血风险评估中常需联合解读。',\n  inputs: [{\n    key: 'wbc',\n    type: 'choice',\n    label: '白细胞（WBC）',\n    def: '正常',\n    rangeText: '正常（3.5–9.5 ×10⁹\/L 为常用成人区间）',\n    options: [{\n      value: '正常',\n      status: 'normal'\n    }, {\n      value: '偏高',\n      status: 'high'\n    }, {\n      value: '偏低',\n      status: 'low'\n    }]\n  }, {\n    key: 'crp',\n    type: 'choice',\n    label: 'C 反应蛋白（CRP）',\n    def: '正常',\n    rangeText: '正常（一般 \u003c 10 mg\/L 为无炎症活动）',\n    options: [{\n      value: '正常',\n      status: 'normal'\n    }, {\n      value: '轻度升高',\n      status: 'high'\n    }, {\n      value: '明显升高',\n      status: 'high'\n    }]\n  }, {\n    key: 'plt',\n    type: 'choice',\n    label: '血小板（PLT）',\n    def: '正常',\n    rangeText: '正常（125–350 ×10⁹\/L 为常用成人区间）',\n    options: [{\n      value: '正常',\n      status: 'normal'\n    }, {\n      value: '偏高',\n      status: 'high'\n    }, {\n      value: '偏低',\n      status: 'low'\n    }]\n  }]\n};\n\/* 变量 VITAMIN 位置: \/src\/lib\/health.js:191:0 *\/\nconst VITAMIN = {\n  key: 'vitamin',\n  tabLabel: '维生素微量',\n  title: '工具F 维生素微量元素',\n  intro: '按体检报告选择维生素 D（25-OH-VD）、铁蛋白与血钙的变化档位，逐项解读并给出饮食与日照、复查建议；三项与骨骼健康、贫血与营养储备关系密切。',\n  inputs: [{\n    key: 'vd',\n    type: 'choice',\n    label: '维生素 D（25-OH-VD）',\n    def: '正常',\n    rangeText: '正常（一般 ≥ 30 ng\/ml 为充足）',\n    options: [{\n      value: '正常',\n      status: 'normal'\n    }, {\n      value: '不足',\n      status: 'low'\n    }, {\n      value: '缺乏',\n      status: 'low'\n    }]\n  }, {\n    key: 'ferritin',\n    type: 'choice',\n    label: '铁蛋白（Ferritin）',\n    def: '正常',\n    rangeText: '正常（常用成人区间约 30–300 ng\/ml）',\n    options: [{\n      value: '正常',\n      status: 'normal'\n    }, {\n      value: '偏低',\n      status: 'low'\n    }, {\n      value: '偏高',\n      status: 'high'\n    }]\n  }, {\n    key: 'ca',\n    type: 'choice',\n    label: '血钙（Ca）',\n    def: '正常',\n    rangeText: '正常（常用成人区间约 2.1–2.6 mmol\/L）',\n    options: [{\n      value: '正常',\n      status: 'normal'\n    }, {\n      value: '偏低',\n      status: 'low'\n    }, {\n      value: '偏高',\n      status: 'high'\n    }]\n  }]\n};\n\n\/* ============ 异常项 → 对应建议文案 ============ *\/\n\n\/* 变量 URINE_NOTES 位置: \/src\/lib\/health.js:229:0 *\/\nconst URINE_NOTES = {\n  allOk: '尿蛋白、潜血、白细胞三项定性指标均为阴性，是尿常规中最常见的正常结果，目前未见异常线索。',\n  routine: '常规体检时尿建议每年复查一次；留尿前避免剧烈运动，取样取清晨、清洁中段尿（先擦洗外阴、弃去前段尿），女性避开月经期前后 3 天，以免干扰结果。',\n  proteinTrace: '尿蛋白微量（±）：可见于剧烈运动后、发热、久站（体位性蛋白尿）或饮水不足，多为临界表现；建议静息 2–3 天后，改用清晨清洁中段尿复查尿常规，若反复出现“±”或转阳性进一步检查。',\n  protein1Plus: '尿蛋白 1+：可能提示泌尿系统感染、发热或急性疾病影响，也可能是肾小球\/肾小管轻度受累信号；建议静息状态下复查尿常规，并补做 24 小时尿蛋白定量，持续阳性请肾内科评估。',\n  proteinHigh: '尿蛋白 2+\/3+：尿中蛋白丢失较明显，常见于各类肾炎、肾病综合征、糖尿病肾病等，也可能叠加发热、感染因素；建议尽快肾内科就诊，完善 24 小时尿蛋白定量、肾功能、尿微量白蛋白\/肌酐比值与血压检查。',\n  bloodPositive: '潜血（红细胞）阳性：可见于月经污染、剧烈运动、尿路结石、泌尿系统感染或肾脏病变；排除干扰期后 1–2 周复查尿常规，若同时存在腰痛、肉眼血尿、尿频尿急请泌尿外科\/肾内科就诊。',\n  wbcPositive: '白细胞阳性：常提示泌尿道感染（常伴尿频、尿急、尿痛）；建议多饮水、不憋尿，必要时查清洁中段尿培养与尿亚硝酸盐检查；症状明显或伴发热请尽快就诊抗感染治疗。',\n  proteinBloodCombo: '尿蛋白与潜血同时阳性：一次化验不足以定性，可能与肾炎、感染或运动干扰相关，建议尽快复查“尿常规 + 尿红细胞位相 \/ 24 小时尿蛋白定量”，必要时肾内科系统评估。',\n  clinicSoonKidney: '就医提示：尿蛋白达 2+ 及以上提示蛋白丢失较明显，属于建议尽快就医的情形，请于数日内到肾内科就诊，勿等待下次常规体检。',\n  clinicGeneral: '就医提示：以上均为常见线索归纳；若伴持续泡沫尿、眼睑\/下肢水肿、血压升高、发热或明显尿路刺激症状，请直接到肾内科或泌尿外科进一步评估，单纯轻度异常可先按周期复查。'\n};\n\n\/* ============ 异常项 → 对应建议文案（选择型工具：凝血炎症） ============ *\/\n\n\/* 变量 COAG_NOTES 位置: \/src\/lib\/health.js:244:0 *\/\nconst COAG_NOTES = {\n  allOk: '白细胞、C 反应蛋白、血小板三个档位均处于正常范围，本次未见明显的感染或炎症活跃线索。',\n  routine: '对比复查建议：白细胞与血小板档位建议连同血常规一起复查（通常在同一张报告单），CRP 建议同一次抽血复查，便于前后对比；输液后、剧烈运动、熬夜可能影响炎症指标，尽量在静息状态下检测。',\n  wbcHigh: '白细胞档位偏高：常见于细菌感染、发热、剧烈运动或应激状态；若伴随发热、咽痛、咳嗽等症状，请结合 CRP 与医生意见判断是否需要抗感染治疗，治疗后 1–2 周复查血常规评价应答。',\n  wbcLow: '白细胞档位偏低：常见于病毒感染（如感冒）恢复期、感冒药\/抗病毒药物影响或免疫力波动；注意休息与保暖，避免去人多密闭场所，2 周后复查，持续偏低请血液科评估。',\n  crpMild: 'C 反应蛋白轻度升高：提示体内存在轻度炎症或组织损伤（感染早期、牙龈炎、脂肪肝、剧烈运动后均可）；建议清淡饮食、规律作息，1–2 周后同血常规一起复查观察趋势。',\n  crpMarked: 'C 反应蛋白明显升高：多提示中度以上炎症或感染活动（少数与自身免疫病、心血管事件相关）；若同时发热、乏力、明显疼痛，请尽快内科就诊查明感染或炎症来源，勿自行用药。',\n  pltHigh: '血小板档位偏高：常见于感染或炎症恢复期的反应性升高、缺铁等；原发因素控制后多可回落，建议本次问题好转后复查血常规对比，持续偏高请血液科评估。',\n  pltLow: '血小板档位偏低：注意观察皮肤瘀点、牙龈或鼻腔出血，避免磕碰与影响凝血的药物（如阿司匹林请遵医嘱）；炎症好转、停用相关药物后复查，若进行性下降请尽快血液科就诊。',\n  comboWbcCrpUp: '白细胞与 CRP 同步偏高：符合较典型的感染\/炎症活动组合图景，多数与细菌感染相关；请结合体温与症状及时就诊，遵医嘱抗感染治疗后复查两者变化。',\n  comboWbcLowCrpUp: '白细胞偏低但 CRP 升高：可见于病毒感染、特殊病原感染或炎症早期，也可见于药物影响；建议复查并请医生综合解读，避免自行使用抗生素。',\n  comboPltLowCrpUp: '血小板偏低伴 CRP 升高：炎症状态下血小板也可能减少（如感染较重），也可能提示免疫性血小板减少；建议复查血常规观察动态，血小板明显下降请尽快血液科就诊。',\n  clinicSoon: '就医提示：CRP 明显升高属于建议尽快就医的情形，请于 1–3 天内到内科\/感染科就诊并完善进一步检查，不要等到下一个体检周期。',\n  clinicGeneral: '就医提示：以上为常见线索归纳；一旦出现高热不退（体温 \u003e38.5℃ 持续 2–3 天）、明显出血点增多、乏力显著加重或局部红肿热痛，请直接就诊，不必等待常规复查周期。'\n};\n\n\/* ============ 异常项 → 对应建议文案（选择型工具：维生素微量） ============ *\/\n\n\/* 变量 VITAMIN_NOTES 位置: \/src\/lib\/health.js:262:0 *\/\nconst VITAMIN_NOTES = {\n  allOk: '维生素 D、铁蛋白、血钙三个档位均正常，骨骼健康与营养储备方面的常见指标未见异常信号，继续保持即可。',\n  routine: '复查对比建议：25-OH-VD 与铁蛋白建议在同一家机构复查（不同检测方法数值差异较大），血钙建议连同白蛋白一起看（纠正钙更准确）；空腹抽血更稳定，可在年度体检中一并安排。',\n  vdInsufficient: '维生素 D 不足：与户外日照少、严格防晒、久坐室内或体重偏高相关，冬春季更常见；建议每周 3–4 次在上午或傍晚晒太阳 15–30 分钟（露出面部与手臂），每周吃 2–3 次海鱼、蛋黄或强化乳制品，3 个月后复查 25-OH-VD。',\n  vdDeficient: '维生素 D 缺乏：属于明确建议补充的阶段，仅靠日照纠正较慢；请在医生\/药师指导下补充维生素 D（普通成人常以 1000–2000 IU\/日为起始），配合饮食与日照，3 个月后复查 25-OH-VD 与血钙，勿自行超大剂量补充。',\n  ferritinLow: '铁蛋白偏低：提示体内铁储备不足，常见于月经量偏多、饮食铁摄入不足或慢性失血（如痔疮、消化道问题），可有乏力、面色苍白；建议增加红肉、动物血\/肝脏（每周 1–2 次），搭配富含维生素 C 的蔬果促进吸收，1–3 个月后复查铁蛋白与血常规。',\n  ferritinHigh: '铁蛋白偏高：常见于炎症\/感染期间（急性期反应）、脂肪肝与代谢综合征，少数与铁过载或肝脏疾病相关；若同时本次白细胞\/CRP 有异常，建议待炎症纠正后复查铁蛋白，持续明显偏高请消化科\/血液科评估。',\n  caLow: '血钙偏低：可见于维生素 D 缺乏、甲状旁腺相关异常或白蛋白降低；若伴手脚麻木、抽筋或心律不适，请尽快内分泌科就诊；一般情况建议先纠正维生素 D、保证奶类与豆制品摄入，复查时同时看血钙与白蛋白。',\n  caHigh: '血钙偏高：可见于甲状旁腺功能亢进、维生素 D\/钙剂过量补充或某些肿瘤相关高钙；请先暂停钙剂与维生素 D 补充剂，增加饮水，并尽快内分泌科就诊复查。',\n  comboCaVdLow: '维生素 D 不足\/缺乏伴血钙偏低：两者常相互关联；优先在医生指导下补充维生素 D 并加强日照奶类饮食，暂不盲目自行大剂量补钙片，复查时同步评估 25-OH-VD 与离子钙。',\n  clinicCaHigh: '就医提示：血钙偏高属于建议尽快就医评估的情形，请于 1–3 天内到内分泌科就诊，排查甲状旁腺与维生素 D 过量等问题，并暂停自行补充的钙剂\/维生素 D 制剂。',\n  clinicGeneral: '就医提示：以上为营养储备方向的常见线索归纳；若伴明显乏力、骨痛、抽筋、心悸或贫血面容，请到内分泌科\/血液科面诊，勿长期自行大剂量补充维生素 D、铁剂或钙剂。'\n};\n\n\/* ============ 异常项 → 对应建议文案（数值型工具） ============ *\/\n\n\/* 变量 CBC_NOTES 位置: \/src\/lib\/health.js:278:0 *\/\nconst CBC_NOTES = {\n  wbcHigh: '白细胞偏高：常见于感染发热、剧烈运动或情绪应激后的暂时波动；若伴有发热、咽痛等症状请及时就诊，安静休息 1 周后复查血常规对比。',\n  wbcLow: '白细胞偏低：常见于病毒感染恢复期、近期服用感冒药\/抗病毒药物或免疫力波动；注意休息与保暖，2 周后复查，持续偏低请血液科评估。',\n  rbcHbLow: '红细胞\/血红蛋白偏低：提示贫血倾向，可增加红肉、动物血、动物肝脏、深色蔬菜等富铁食物并搭配维生素 C；女性经期后更需留意，1 个月内复查。',\n  rbcHbHigh: '红细胞\/血红蛋白偏高：多见于饮水不足、脱水、吸烟或高原环境；建议增加饮水量、戒烟，复查血常规。',\n  pltLow: '血小板偏低：注意观察皮肤瘀点、牙龈或鼻腔出血，避免剧烈碰撞与影响凝血的药物；2–4 周复查，若明显降低请尽快血液科就诊。',\n  pltHigh: '血小板偏高：可能与感染恢复、缺铁等反应性因素有关；多饮水、均衡饮食，1–2 个月后复查，持续 \u003e450×10⁹\/L 建议血液科评估。',\n  allOk: '四项核心指标均在成人参考区间内，血常规暂时没有明显异常信号。',\n  routine: '建议将血常规纳入每年常规体检，保持规律作息、均衡饮食与适量运动。'\n};\n\/* 变量 LIVER_NOTES 位置: \/src\/lib\/health.js:289:0 *\/\nconst LIVER_NOTES = {\n  transamHigh: '转氨酶（ALT\/AST）偏高：常见于熬夜、饮酒、剧烈运动、脂肪肝或近期用药；建议立即暂停饮酒与保健品，清淡饮食、保证睡眠，2–4 周后复查肝功能。',\n  uaHigh: '尿酸偏高：减少高嘌呤饮食（海鲜、动物内脏、浓肉汤、酒精尤其啤酒），每日饮水约 2000ml，控制体重；1–3 个月后复查，若出现关节红肿热痛请尽快风湿科就诊。',\n  uaLow: '尿酸偏低：多见于饮食清淡或个体代谢差异，一般无临床意义，保持均衡饮食即可，无需特殊处理。',\n  crHigh: '肌酐偏高：可能与脱水、高蛋白饮食、剧烈运动有关，也可能提示肾功能波动；避免憋尿、慎用止痛药等伤肾药物，增加饮水并尽快复查肾功能。',\n  crLow: '肌酐偏低：常见于体型瘦小、肌肉量少或长期素食者，通常无临床意义，适当保证优质蛋白（蛋、奶、瘦肉）摄入即可。',\n  allOk: '肝肾功能核心指标未见明显异常，肝脏解毒与肾脏排泄功能目前状态平稳。',\n  routine: '继续保持限酒、规律作息、充足饮水（每日 1500–2000ml），避免熬夜，每年复查一次肝肾功能。'\n};\n\/* 变量 LIPID_NOTES 位置: \/src\/lib\/health.js:299:0 *\/\nconst LIPID_NOTES = {\n  tcLdlHigh: '总胆固醇\/LDL-C 偏高：与动脉粥样硬化风险相关，优先减少肥肉、油炸食品、奶油糕点与含“植脂末”的饮品，每周吃 2 次深海鱼，主食粗细搭配。',\n  tgHigh: '甘油三酯偏高：与酒精、精制糖和体重关系最密切；严格限酒、少喝含糖饮料、控制主食总量，每周至少 150 分钟快走\/慢跑\/游泳，3 个月后复查。',\n  hdlLow: 'HDL-C 偏低：坚持规律有氧运动（快走、慢跑、游泳），戒烟，适量摄入坚果、橄榄油\/茶油等不饱和脂肪，控制体重。',\n  fpgImpaired: '空腹血糖处于“偏高边缘”（6.1–6.9 属空腹血糖受损）：控制精制糖与含糖饮料，主食总量适当减量并增加全谷物，3 个月后复查空腹血糖或做糖耐量试验（OGTT）。',\n  fpgHighDm: '空腹血糖 ≥7.0 mmol\/L，已达糖尿病诊断线索水平：请尽快内分泌科就诊，复查血糖、糖化血红蛋白并遵医嘱。',\n  fpgLow: '空腹血糖偏低：可能与检测前长时间空腹或低血糖倾向有关；规律进餐，随身备糖果以防心慌出汗，并复查血糖告知医生。',\n  tcLow: '总胆固醇偏低：可能与长期低脂饮食、营养不良或甲状腺功能偏高有关；均衡摄入优质脂肪（鱼肉、坚果、植物油），必要时复查甲功。',\n  tgLowSimilar: '甘油三酯偏低：常与低脂饮食有关，一般无临床意义，保证适量优质脂肪摄入即可。',\n  ldlLow: 'LDL-C 偏低多与饮食结构有关，通常为好事，无需处理；但极端偏低时可咨询医生。',\n  hdlHighNote: 'HDL-C 偏高通常是保护性表现（“好胆固醇”多），无需处理。',\n  allOk: '五项血脂血糖指标均在常见参考范围内，代谢状态总体理想。',\n  routine: '每周保持 150 分钟中等强度运动，饮食少油少糖、多蔬果全谷，每年复查血脂血糖。'\n};\n\n\/* ============ 建议生成（2~3 条） ============ *\/\n\nfunction buildCbcAdvice(states) {\n  console.log(\"\\u51FD\\u6570 buildCbcAdvice \\u4F4D\\u7F6E: \/src\/lib\/health.js:316:0\");\n  \/* 变量 abnormal 位置: \/src\/lib\/health.js:317:2 *\/\n  const abnormal = [];\n  if (states.wbc === 'high') abnormal.push(CBC_NOTES.wbcHigh);\n  if (states.wbc === 'low') abnormal.push(CBC_NOTES.wbcLow);\n  if (states.hb === 'low' || states.rbc === 'low') abnormal.push(CBC_NOTES.rbcHbLow);\n  if (states.hb === 'high' || states.rbc === 'high') abnormal.push(CBC_NOTES.rbcHbHigh);\n  if (states.plt === 'low') abnormal.push(CBC_NOTES.pltLow);\n  if (states.plt === 'high') abnormal.push(CBC_NOTES.pltHigh);\n  if (abnormal.length === 0) {\n    return [CBC_NOTES.allOk, CBC_NOTES.routine];\n  }\n  \/* 变量 list 位置: \/src\/lib\/health.js:328:2 *\/\n  const list = abnormal.slice(0, 3);\n  if (list.length \u003c= 2) list.push(CBC_NOTES.routine);\n  return list;\n}\nfunction buildLiverAdvice(states) {\n  console.log(\"\\u51FD\\u6570 buildLiverAdvice \\u4F4D\\u7F6E: \/src\/lib\/health.js:333:0\");\n  \/* 变量 list 位置: \/src\/lib\/health.js:334:2 *\/\n  const list = [];\n  if (states.alt === 'high' || states.ast === 'high') list.push(LIVER_NOTES.transamHigh);\n  if (states.ua === 'high') list.push(LIVER_NOTES.uaHigh);\n  if (states.cr === 'high') list.push(LIVER_NOTES.crHigh);\n  if (list.length === 0) {\n    if (states.ua === 'low') list.push(LIVER_NOTES.uaLow);\n    if (states.cr === 'low') list.push(LIVER_NOTES.crLow);\n  }\n  if (list.length === 0) list.push(LIVER_NOTES.allOk);\n  list.push(LIVER_NOTES.routine);\n  return list.slice(0, 3);\n}\nfunction buildLipidAdvice(states, nums) {\n  console.log(\"\\u51FD\\u6570 buildLipidAdvice \\u4F4D\\u7F6E: \/src\/lib\/health.js:347:0\");\n  \/* 变             },
            performReactRefresh: function() {
              // 空实现，独立运行器不需要执行热更新
              // 这个函数在编译后的代码中会被调用，但在独立运行器中不需要实际功能
              console.log('performReactRefresh called (no-op in standalone runner)');
            },
            // 添加其他可能被调用的 React Refresh 接口
            _getMountedRootCount: function() { return 0; },
            collectCustomHooksForSignature: function() { return []; },
            findAffectedHostInstances: function() { return []; },
            getFamilyByID: function() { return null; },
            getFamilyByType: function() { return null; },
            hasUnrecoverableErrors: function() { return false; },
            isLikelyComponentType: function() { return false; },
            setSignature: function() { /* no-op */ }
          };
          
          // 初始化全局函数
          window.$RefreshReg$ = function(type, id) {
            // 空实现，独立运行器不需要注册组件
          };
          
          window.$RefreshSig$ = function() {
            return function(type) {
              return type;
            };
          };
          
          console.log('React Refresh runtime initialized for standalone runner');
        }
      }

      // 全局错误捕获
      window.addEventListener('error', (event) => {
        console.error('Global error:', event.error);
      });

      window.addEventListener('unhandledrejection', (event) => {
        console.error('Unhandled promise rejection:', event.reason);
      });

      function insertCssLink(href) {
        const link = document.createElement('link');
        link.id = 'gravity-link';
        link.href = href;
        link.rel = 'stylesheet';
        document.head.appendChild(link);
      }

      function createImportMap(importMapData) {
        if (!importMapData || !importMapData.imports) {
          console.log('📋 无 ImportMap 数据');
          return;
        }
        
        // 移除已存在的 ImportMap
        const existing = document.getElementById('vs-importmap');
        if (existing) existing.remove();
        
        const script = document.createElement('script');
        script.type = 'importmap';
        script.id = 'vs-importmap';
        script.textContent = JSON.stringify(importMapData, null, 2);
        document.head.appendChild(script);

        if (importMapData.css) {
          insertCssLink(importMapData.css);
        }
      }

      function injectCSSAssets(assets) {
        if (!assets || assets.length === 0) {
          console.log('🎨 无 CSS 资源');
          return;
        }
        
        // 只处理 CSS 类型的资源
        const cssAssets = assets.filter(asset => asset.type === 'css');
        
        cssAssets.forEach(asset => {
          // 移除已存在的样式
          const existing = document.getElementById('vs-css-' + asset.fileName);
          if (existing) existing.remove();
          
          const style = document.createElement('style');
          style.id = 'vs-css-' + asset.fileName;
          style.textContent = asset.source;
          document.head.appendChild(style);
          
          console.log('🎨 注入 CSS: ' + asset.fileName);
        });
      }

      function injectHTMLAssets(assets) {
        if (!assets || assets.length === 0) {
          console.log('📄 无 HTML 资源');
          return;
        }
        
        // 查找 HTML 类型的资源
        const htmlAssets = assets.filter(asset => 
          asset.type === 'asset' && asset.fileName.endsWith('.html')
        );
        
        if (htmlAssets.length === 0) {
          console.log('📄 未找到 HTML 文件');
          return;
        }
        
        // 使用第一个 HTML 文件（通常是 index.html）
        const htmlAsset = htmlAssets[0];
        console.log('📄 处理 HTML 资源: ' + htmlAsset.fileName);
        
        try {
          let contentToInject = '';
          
          // 创建临时容器解析 HTML
          const tempDiv = document.createElement('div');
          tempDiv.innerHTML = htmlAsset.source;
          
          // 尝试多种方式提取内容
          const bodyElement = tempDiv.querySelector('body');
          if (bodyElement) {
            // 情况1: 完整的 HTML 文档，有 body 标签
            contentToInject = bodyElement.innerHTML;
            console.log('📄 从 body 元素中提取内容');
          } else {
            // 情况2: HTML 片段或没有 body 标签的内容
            // 检查是否包含 HTML 结构标签
            const hasHtmlStructure = htmlAsset.source.includes('<html') || 
                                   htmlAsset.source.includes('<head') || 
                                   htmlAsset.source.includes('<!DOCTYPE');
            
            if (hasHtmlStructure) {
              // 如果有 HTML 结构但没有 body，可能是格式问题，尝试提取所有内容
              const htmlElement = tempDiv.querySelector('html');
              if (htmlElement) {
                contentToInject = htmlElement.innerHTML;
                console.log('📄 从 html 元素中提取内容');
              } else {
                contentToInject = tempDiv.innerHTML;
                console.log('📄 提取完整 HTML 内容');
              }
            } else {
              // 纯 HTML 片段，直接使用
              contentToInject = htmlAsset.source;
              console.log('📄 使用 HTML 片段内容');
            }
          }
          
          // 清理内容（移除可能的 head 标签内容）
          if (contentToInject.includes('<head')) {
            const cleanDiv = document.createElement('div');
            cleanDiv.innerHTML = contentToInject;
            
            // 移除 head 标签
            const headElements = cleanDiv.querySelectorAll('head');
            headElements.forEach(head => head.remove());
            
            contentToInject = cleanDiv.innerHTML;
            console.log('📄 已清理 head 标签内容');
          }
          
          // 注入到页面的容器中
          if (contentToInject.trim()) {
            const root = document.getElementById('root');
            const app = document.getElementById('app');
            
            if (root) {
              root.innerHTML = contentToInject;
              console.log('📄 HTML 内容已注入到 #root');
            } else if (app) {
              app.innerHTML = contentToInject;
              console.log('📄 HTML 内容已注入到 #app');
            } else {
              console.warn('📄 未找到合适的容器元素 (#root 或 #app)');
            }
          } else {
            console.warn('📄 提取的 HTML 内容为空');
          }
          
        } catch (error) {
          console.error('📄 处理 HTML 资源时出错:', error);
          // 降级处理：直接使用原始内容
          try {
            const root = document.getElementById('root');
            const app = document.getElementById('app');
            
            if (root) {
              root.innerHTML = htmlAsset.source;
              console.log('📄 降级处理：直接注入原始 HTML 内容到 #root');
            } else if (app) {
              app.innerHTML = htmlAsset.source;
              console.log('📄 降级处理：直接注入原始 HTML 内容到 #app');
            }
          } catch (fallbackError) {
            console.error('📄 降级处理也失败:', fallbackError);
          }
        }
      }

      function executeBundle(code) {
        // 移除已存在的脚本
        const existing = document.getElementById('vs-bundle-script');
        if (existing) existing.remove();
        
        const script = document.createElement('script');
        script.type = 'module';
        script.id = 'vs-bundle-script';
        script.textContent = code;
        document.body.appendChild(script);

        console.log('⚡ 代码执行完成');
      }

      function injectExternalDependencies(externalDeps) {
        return new Promise((resolve, reject) => {
          if (!externalDeps || externalDeps.length === 0) {
            resolve();
            return;
          }

          let loadedCount = 0;
          const totalCount = externalDeps.length;
          
          externalDeps.forEach(({ name, var: globalVar, path }) => {
            // 检查是否已存在相同src的script标签
            const existingScript = document.querySelector('script[src="' + path + '"]');
            if (existingScript) {
              console.log('External package ' + name + ' already loaded from ' + path);
              loadedCount++;
              if (loadedCount === totalCount) {
                resolve();
              }
              return;
            }
            
            const script = document.createElement('script');
            script.src = path;
            script.async = false;
            script.onload = () => {
              console.log('✅ External package ' + name + ' loaded from ' + path);
              if (globalVar && !window[globalVar]) {
                console.warn('External package ' + name + ' loaded but global variable ' + globalVar + ' not found');
              }
              loadedCount++;
              if (loadedCount === totalCount) {
                resolve();
              }
            };
            script.onerror = () => {
              console.error('❌ Failed to load external package ' + name + ' from ' + path);
              reject(new Error('Failed to load external package: ' + name));
            };
            document.head.appendChild(script);
          });
        });
      }
  
      async function startStandaloneApp(config) {
        try {
          // 0. 等待 external 依赖加载完成
          if (config.codeConfig && config.codeConfig.external && config.codeConfig.external.length > 0) {
            await injectExternalDependencies(config.codeConfig.external);
            console.log('✅ 所有 external 依赖加载完成');
          }
          
          // 1. 创建 ImportMap（外部依赖管理）
          createImportMap(config.importMap);
          
          // 2. 注入 HTML 资源（如果存在）
          injectHTMLAssets(config.rollupBundle.assets);
          
          // 3. 注入 CSS 资源（从 rollupBundle.assets 获取）
          injectCSSAssets(config.rollupBundle.assets);
          
          // 4. 执行打包后的代码
          executeBundle(config.rollupBundle.code);
        } catch (error) {
          console.error('❌ VisionSnap 启动应用失败:', error);
        }
      }

      // 检查是否有外部配置，否则使用示例配置
      if (window.VISIONSNAP_CONFIG) {
        initReactRefreshRuntime();
        startStandaloneApp(window.VISIONSNAP_CONFIG);
      }
    </script><!-- END vision_snap_config -->
