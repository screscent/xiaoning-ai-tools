<!DOCTYPE html>
<html lang="zh-CN">
<head>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeaveFox - 零门槛做应用，让创意看得见</title>
  <meta name="description" content="让创意不再止于草稿，用一杯咖啡的时间将想法变成现实" />
  <link rel="icon" type="image/png" href="./assets/img-c7267dc0a4.png" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="WeaveFox - 零门槛做应用，让创意看得见" />
  <meta property="og:description" content="让创意不再止于草稿，用一杯咖啡的时间将想法变成现实" />
  <meta property="og:site_name" content="WeaveFox" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="WeaveFox - 零门槛做应用，让创意看得见" />
  <meta name="twitter:description" content="让创意不再止于草稿，用一杯咖啡的时间将想法变成现实" />

  <style>
  :root {
    --radius: 0.75rem;
    --background: oklch(0.99 0.004 260);
    --foreground: oklch(0.141 0.005 285.823);
    --primary: oklch(0.65 0.2 260);
    --secondary: oklch(0.78 0.09 260);
    --muted-foreground: oklch(0.55 0.005 285.938);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --background: oklch(0.14 0.02 260);
      --foreground: oklch(0.985 0 0);
      --primary: oklch(0.7 0.22 260);
      --secondary: oklch(0.82 0.1 260);
      --muted-foreground: oklch(0.85 0.01 285.938);
    }
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'MiSans VF', 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-weight: 400;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
    background: var(--background);
    color: var(--foreground);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .background-gradient {
    position: fixed;
    inset: 0;
    background: linear-gradient(to bottom right, var(--primary) 0%, transparent 45%, transparent 55%, var(--secondary) 100%);
    opacity: 0.15;
    pointer-events: none;
  }

  .container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    padding: 40px;
    animation: float-in 0.6s ease-out;
  }

  @keyframes float-in {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .logo {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    box-shadow: 0 8px 32px oklch(0.65 0.2 260 / 0.2);
  }

  .error-code {
    font-size: 120px;
    font-weight: 700;
    line-height: 1;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    opacity: 0.9;
  }

  .title {
    font-size: 24px;
    font-weight: 600;
    color: var(--foreground);
    text-align: center;
  }

  .desc {
    font-size: 15px;
    color: var(--muted-foreground);
    text-align: center;
    max-width: 280px;
    line-height: 1.6;
  }

  .slogan {
    margin-top: 16px;
    font-size: 14px;
    font-style: italic;
    background: linear-gradient(90deg, var(--primary), var(--secondary), var(--primary));
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradient 6s ease infinite;
  }

  @keyframes gradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .dots {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    animation: bounce 1.4s ease-in-out infinite;
  }

  .dot:nth-child(1) {
    background: var(--primary);
    animation-delay: -0.3s;
  }

  .dot:nth-child(2) {
    background: var(--secondary);
    animation-delay: -0.15s;
  }

  .dot:nth-child(3) {
    background: var(--primary);
    animation-delay: 0s;
  }

  @keyframes bounce {
    0%, 80%, 100% {
      transform: scale(0.8);
      opacity: 0.6;
    }
    40% {
      transform: scale(1);
      opacity: 1;
    }
  }
</style>
</head>
<body>
  <div class="background-gradient"></div>
  <div class="container">
    <img class="logo" src="./assets/img-3471aaea92.png" alt="WeaveFox" />
    <div class="error-code">404</div>
    <div class="title">应用未发布</div>
    <div class="desc">该应用可能已被删除或地址有误</div>
    <div class="slogan">The Weaver of Ideas</div>
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
</body>
</html>
