eature\/login', '# 首次推送并建立跟踪关系', 'git push -u origin feature\/login'],\n  explain: 'switch -c 会基于当前 HEAD 新建分支并立即切过去，-c 即 create。第一次推送用 -u（--set-upstream）把本地分支和远端绑定，之后直接 git push 即可。',\n  pitfalls: ['基于错误的分支建分支：先 git switch main \u0026\u0026 git pull，再建新分支，避免把别的分支提交带进来。', '分支名用 feature\/xxx、fix\/xxx 这类前缀，别用中文或空格。', '首次推送漏掉 -u，下次 push 会提示 no upstream branch，需 git push -u origin 分支名 补上。']\n}, {\n  id: 'switch',\n  key: '切换',\n  title: '切换分支 \/ 来回横跳',\n  aliases: ['切换', '检出', 'switch', 'checkout', '切回', '回到', 'stash'],\n  commands: ['git switch main', '# 切回上一个分支（两个分支间反复跳）', 'git switch -', '# 工作区不干净时先暂存', 'git stash \u0026\u0026 git switch main'],\n  explain: 'switch 只负责切分支，比老版 checkout 语义更清晰（checkout 还能还原文件，容易误删改动）。切换前工作区应保持干净，否则改动会被一起带过去或被拒绝切换。',\n  pitfalls: ['改了一半就切分支：先 git stash 或 git commit，回来再 git stash pop。', 'git checkout -- 文件名 会丢弃该文件改动，且无法恢复。', '切换后代码没变？确认是否切换失败（存在冲突改动时会被拒绝）。']\n}, {\n  id: 'merge',\n  key: '合并',\n  title: '把功能分支合并回主干',\n  aliases: ['合并', 'merge', '合入', '同步主干', '拉取更新', 'no-ff'],\n  commands: ['git switch main', 'git pull --ff-only', 'git merge --no-ff feature\/login', '# 有冲突时解决后继续', 'git merge --continue   # 等价于 git commit'],\n  explain: '--no-ff 强制生成合并提交，保留“这条功能分支曾经存在”的历史，团队回溯更清楚。快进合并（默认）不产生合并点，历史更线性。',\n  pitfalls: ['合并前不 pull，主干已过期会把别人的改动一起搅进来。', '团队要求线性历史时，别用 --no-ff，改用 rebase 或 squash。', '合并完忘记 git push，远端看不到这次合并。']\n}, {\n  id: 'delete',\n  key: '删除',\n  title: '删除本地 \/ 远端分支',\n  aliases: ['删除', '删掉', 'delete', 'remove', 'branch -d', 'branch -D', '清理分支'],\n  commands: ['git branch -d feature\/login              # 已合并，安全删除', 'git branch -D feature\/login              # 未合并，强制删除', 'git push origin --delete feature\/login   # 删除远端分支', 'git fetch -p                             # 清理已消失的远端引用'],\n  explain: '-d 只在分支已合并时才允许删除，是一道保护；-D 跳过检查，会丢掉未合并的提交。远端分支必须单独删，本地与远端互不联动。',\n  pitfalls: ['误用 -D 删掉的提交不会立刻消失，可用 git reflog 找回（默认保留 90 天）。', '删远端分支前确认没人基于它开发，尤其别动 main \/ master \/ release\/*。', '只删远端后，本地 origin\/feature 引用要 git fetch -p 才会清理。']\n}, {\n  id: 'remote',\n  key: '远程跟踪',\n  title: '查看与建立远程跟踪关系',\n  aliases: ['远程', '跟踪', 'remote', 'fetch', 'upstream', 'track', 'origin', '拉取', '同步'],\n  commands: ['git fetch -p                                 # 拉取并清理已删除的远端分支', 'git branch -vv                               # 看每个分支跟踪谁、领先\/落后几个提交', 'git switch --track origin\/feature\/login      # 建本地分支并跟踪远端', 'git branch --unset-upstream                  # 解除跟踪'],\n  explain: '远程跟踪分支（origin\/xxx）是只读的本地快照，只有 fetch \/ pull 才会更新。branch -vv 能直接看到 ahead \/ behind 数量。',\n  pitfalls: ['git fetch 不会改工作区代码，别指望它更新你的文件，还要 merge 或 pull。', '本地分支和同名远端分支不会自动同步，ahead 1 behind 3 说明两边都改过。', '新克隆的仓库本地只有主分支，其它分支要先 fetch 再 switch。']\n}];\nconst conflictEntries = [{\n  id: 'merge-conflict',\n  key: '合并冲突',\n  title: '合并冲突（merge conflict）',\n  aliases: ['合并冲突', 'merge conflict', 'both modified', '合并', '冲突', 'merge'],\n  summary: '两个人改了同一段代码，Git 判断不了该保留哪一份，把决定权交给你：改完标记已解决，再完成合并。',\n  steps: [{\n    text: '先确认冲突文件：状态里显示 both modified 的就是冲突文件',\n    code: ['git status']\n  }, {\n    text: '只看冲突文件清单（U 表示 unmerged 未解决）',\n    code: ['git diff --name-only --diff-filter=U']\n  }, {\n    text: '打开文件，删掉 \u003c\u003c\u003c\u003c\u003c\u003c\u003c  =======  \u003e\u003e\u003e\u003e\u003e\u003e\u003e 三行标记，保留（通常是融合）正确内容',\n    code: ['\u003c\u003c\u003c\u003c\u003c\u003c\u003c HEAD', '当前分支的版本', '=======', '被合并进来的分支版本', '\u003e\u003e\u003e\u003e\u003e\u003e\u003e feature\/login']\n  }, {\n    text: '标记为已解决',\n    code: ['git add src\/app.js']\n  }, {\n    text: '完成合并，生成合并提交',\n    code: ['git commit            # 或 git merge --continue']\n  }, {\n    text: '实在搞不定就整段回退，回到合并前的干净状态',\n    code: ['git merge --abort']\n  }],\n  tips: ['编辑时顺手删干净标记行，残留的 \u003c\u003c\u003c\u003c\u003c\u003c\u003c 会让代码直接报语法错误。', '不确定谁对时，先 git log --merge -p 文件名 看清两边各自的改动。', '只想整体采用某一侧：git checkout --ours 文件 或 --theirs 文件，再 git add。']\n}, {\n  id: 'rebase-conflict',\n  key: 'rebase 冲突',\n  title: 'rebase 冲突（逐个提交重放）',\n  aliases: ['rebase 冲突', 'rebase', '变基冲突', '变基', 'continue', 'abort', 'stash'],\n  summary: 'rebase 会把你的提交逐个重放到新基底上，同一个冲突可能在多个提交里反复出现，所以“解决 → add → continue”要重复走。',\n  steps: [{\n    text: '先看停在哪一步、哪个文件冲突（会提示 interactive rebase in progress）',\n    code: ['git status']\n  }, {\n    text: '解决冲突后标记为已解决 —— 注意不要 git commit',\n    code: ['git add src\/app.js']\n  }, {\n    text: '继续重放下一个提交',\n    code: ['git rebase --continue']\n  }, {\n    text: '这个提交的改动不要了，跳过它',\n    code: ['git rebase --skip']\n  }, {\n    text: '彻底放弃，回到 rebase 之前的状态',\n    code: ['git rebase --abort']\n  }, {\n    text: '动手前先把未提交改动收好，否则 rebase 会直接拒绝执行',\n    code: ['git stash', '# 变基完成之后', 'git stash pop']\n  }],\n  tips: ['rebase 冲突中 --ours 是上游新基底，--theirs 才是你自己的提交，方向和 merge 相反，这是最大的坑。', 'rebase 过程中千万别 git commit，会打乱流程，用 git rebase --continue。', '对共享分支 rebase 后推送必须用 git push --force-with-lease，绝不用 --force 覆盖同事提交。']\n}, {\n  id: 'markers',\n  key: '冲突标记',\n  title: '读懂冲突标记 \u003c\u003c\u003c\u003c\u003c\u003c\u003c ======= \u003e\u003e\u003e\u003e\u003e\u003e\u003e',\n  aliases: ['冲突标记', '\u003c\u003c\u003c\u003c\u003c\u003c\u003c', '=======', '\u003e\u003e\u003e\u003e\u003e\u003e\u003e', '标记', 'marker', '分隔线'],\n  summary: 'Git 在冲突处插入三行标记，把两个版本并排放进同一个文件，标记本身不是代码，必须删掉。',\n  steps: [{\n    text: '\u003c\u003c\u003c\u003c\u003c\u003c\u003c HEAD 到 ======= 之间：当前所在分支（ours）的内容',\n    code: ['\u003c\u003c\u003c\u003c\u003c\u003c\u003c HEAD', 'console.log(\"本地版本\")']\n  }, {\n    text: '======= 是分隔线：两侧内容的分界',\n    code: ['=======']\n  }, {\n    text: '======= 到 \u003e\u003e\u003e\u003e\u003e\u003e\u003e 之间：被合进来的分支（theirs）的内容',\n    code: ['console.log(\"远端版本\")', '\u003e\u003e\u003e\u003e\u003e\u003e\u003e feature\/login']\n  }, {\n    text: '全局搜索残留标记，确认清理干净',\n    code: [\"grep -rn '\u003c\u003c\u003c\u003c\u003c\u003c\u003c' src\/\"]\n  }, {\n    text: '提交前让 Git 检查空白与冲突残留',\n    code: ['git diff --check', '# 再跑一次构建或测试']\n  }],\n  tips: ['标记里的 HEAD 在 rebase 时并不等于“我的分支”，别凭名字判断哪边是自己。', '手工编辑或交给 IDE 的合并工具都可以，但结果里不能留下任何标记行。', '锁文件、二进制文件冲突建议重新生成，而不是手工改。']\n}];\nconst rebaseEntries = [{\n  id: 'rebase-vs-merge',\n  key: 'rebase vs merge',\n  title: 'rebase 还是 merge？',\n  aliases: ['rebase vs merge', 'rebase', 'merge', '变基', '线性', '区别', '对比'],\n  commands: ['# 线性历史：把自己的提交挪到最新基底后面', 'git fetch origin', 'git rebase origin\/main', '# 保留分支结构：生成一个合并提交', 'git switch main', 'git merge --no-ff feature\/login'],\n  risk: 'rebase 会重写提交 SHA。对已推送到共享分支的历史做 rebase，会让同事的分支全部对不上，只能 force push 覆盖，风险高。merge 不改写历史，但提交图会变成网状。',\n  when: '个人分支同步主干用 rebase，保持线性易读；合并进主干用 merge（或 squash），保留“这是一次完整功能”的语义。',\n  pitfalls: ['只 rebase 自己的、没被别人拉取过的分支。', 'rebase 后推送用 git push --force-with-lease，而不是普通 push。', '禁用了 force push 的分支（main、release\/*）永远不要 rebase。']\n}, {\n  id: 'squash',\n  key: 'squash',\n  title: '压缩提交（squash \/ fixup）',\n  aliases: ['squash', '压缩提交', '合并提交', 'fixup', '合并成一个', 'rebase -i'],\n  commands: ['# 整理最近 3 个提交', 'git rebase -i HEAD~3', '# 编辑器里把后续行首 pick 改成 s（squash）或 f（fixup）', '# 把小改动并进上一个提交', 'git commit --amend --no-edit', '# 合入主干时一次性压成一个提交', 'git merge --squash feature\/login', 'git commit'],\n  risk: '压缩会重写这些提交的历史；squash 合并后主干上看不到分支内的细粒度提交，排查问题时粒度变粗。merge --squash 不会自动提交，也不记录合并关系。',\n  when: '功能分支上堆了很多 wip、fix typo 提交，合入前压成一个干净提交；小修补想并进上一个提交时用 --amend。',\n  pitfalls: ['在 rebase -i 里删掉某行等于丢弃那个提交，手滑也会中招（可用 reflog 找回）。', '--amend 改写提交内容，已 push 的提交 amend 后需要 force push。', '压缩后用 git log 确认只剩你想保留的那条提交信息。']\n}, {\n  id: 'cherry-pick',\n  key: 'cherry-pick',\n  title: '只挑某个提交搬到当前分支',\n  aliases: ['cherry-pick', '挑提交', '挑选', '移植', '拣选', '热修复'],\n  commands: ['git log --oneline --graph --all      # 先找到提交哈希', 'git switch release\/1.2', 'git cherry-pick a1b2c3d', '# 连续挑多个提交', 'git cherry-pick a1b2c3d^..d4e5f6a', '# 冲突时解决后', 'git add . \u0026\u0026 git cherry-pick --continue', 'git cherry-pick --abort'],\n  risk: 'cherry-pick 生成内容相同但 SHA 不同的新提交，同一改动以后正常合并时可能重复或再次冲突；它不能代替常规合并。',\n  when: '把 main 上的热修复搬到 release 分支，或只想借用别人分支里的某一个小改动。',\n  pitfalls: ['范围写法 A^..B 包含起点 A，A..B 则不包含，容易多挑或少挑。', 'cherry-pick 后源分支也要保留修复，否则下次合并会“修一次、丢一次”。', '冲突处理与 merge 相同：改文件 → git add → --continue。']\n}, {\n  id: 'rollback',\n  key: '回滚',\n  title: '回滚：revert 还是 reset？',\n  aliases: ['回滚', '撤销', 'revert', 'reset', '恢复', '取消提交', 'hard', 'soft'],\n  commands: ['# 安全：生成一个反向提交，历史不变，已推送也能用', 'git revert a1b2c3d', '# 本地未推送：改动退回暂存区', 'git reset --soft HEAD~1', '# 默认：改动退回工作区', 'git reset --mixed HEAD~1', '# 危险：连同改动一起丢弃', 'git reset --hard HEAD~1', '# 被 reset \/ rebase 弄丢的提交', 'git reflog'],\n  risk: '--hard 会永久丢掉未提交的改动和提交内容；对已推送历史做 reset 必须 force push，会破坏同事的本地仓库。',\n  when: '公共分支、已推送的提交用 revert；本地未推送的整理用 reset；想找回被丢掉的提交，先用 git reflog 找到 SHA 再 reset 过去。',\n  pitfalls: ['reset --hard 前先 git status \/ git stash，确认没有要保留的改动。', '撤销一个合并提交要带 -m：git revert -m 1 \u003cmerge-sha\u003e。', '找不到提交时先看 git reflog，再决定 reset 到哪个 SHA。']\n}];\nconst cherryEntries = [{\n  id: 'pick-one',\n  key: '挑单个提交',\n  title: '把某个提交挑到当前分支（cherry-pick）',\n  aliases: ['挑单个提交', '挑提交', '拣选', 'cherry-pick', '移植', '单个提交', 'pick'],\n  commands: ['git log --oneline --all --grep=\"修复文案\"   # 先找到提交', 'git switch release\/1.2', 'git cherry-pick a1b2c3d', '# 冲突时解决后继续', 'git add src\/api.js \u0026\u0026 git cherry-pick --continue', 'git cherry-pick --abort                     # 放弃这次拣选', '# 只想先落到工作区，暂时不提交', 'git cherry-pick -n a1b2c3d'],\n  risk: 'cherry-pick 生成的是内容相同但 SHA 不同的新提交：同一改动以后再正常合并，可能重复提交或再次冲突；它是「复制」而非「引用」，源分支后续的修改不会跟过来。',\n  alternatives: ['整个分支的改动都要：直接 git merge 或 git rebase 分支，不要一个个挑。', '只想要某文件的最新状态：git checkout 分支 -- 路径\/文件。', '同一修复要进多个分支：先在主干修好，再 cherry-pick 到发布分支，保证一致。'],\n  tips: ['范围写法 A^..B 包含起点 A，A..B 不包含，容易多挑或少挑。', '加 -x 会在提交信息里记录来源 SHA，方便以后追溯。', 'cherry-pick 后源分支也要保留修复，否则下次合并会“修一次、丢一次”。']\n}, {\n  id: 'revert-one',\n  key: '回滚一次提交',\n  title: '回滚某次提交（不改历史）',\n  aliases: ['回滚一次提交', '回滚', '撤销提交', 'revert', 'reset', '反向提交', '撤销'],\n  commands: ['git revert a1b2c3d                  # 生成反向提交，历史不变', 'git revert --no-commit a1b2c3d      # 先不提交，便于手工调整', '# 本地未推送、只想整理历史', 'git reset --soft HEAD~1', 'git reset --hard HEAD~1             # 危险：连同改动一起丢弃', '# 回滚完成后再推送', 'git push origin main'],\n  risk: 'reset 会移动分支指针并重写历史，已推送的提交 reset 之后必须 force push，会打乱同事的本地仓库；reset --hard 还会永久丢掉未提交的改动。revert 不改历史，是最安全的一条路。',\n  alternatives: ['公共分支、已推送：用 git revert，历史可追溯、可再撤销。', '只回滚某次提交里的单个文件：git checkout a1b2c3d^ -- 文件 后重新提交。', '彻底丢弃本地未推送的一串提交：git reset --hard origin\/main（先确认没有要留的改动）。'],\n  tips: ['revert 冲突的处理和 merge 一样：改文件 → git add → git revert --continue。', '连续回滚多个提交时，从最新的一条往旧的方向依次执行。', 'reset --hard 之前先 git stash，或新建一个备份分支。']\n}, {\n  id: 'undo-merge',\n  key: '撤销合并',\n  title: '撤销一次已经完成的合并',\n  aliases: ['撤销合并', '撤销 merge', 'revert merge', '合并提交', '-m 1', 'undo merge'],\n  commands: ['git log --oneline --graph -5        # 找到那个合并提交', 'git revert -m 1 \u003cmerge-sha\u003e         # 以第一父提交（主干）为基准', '# 本地未推送，想直接撤销合并', 'git reset --hard HEAD~1', 'git push origin main'],\n  risk: 'revert 掉合并提交后，Git 会认为该分支的改动已经合过；以后再把这个分支合并回来，旧改动不会被重新引入，必须 revert 那个 revert 才能“复活”。-m 父编号选错会连主干的改动一起删掉。',\n  alternatives: ['刚合并且还没推送：git reset --hard HEAD~1 直接撤销合并。', '要把被撤销分支的改动重新引入：先 revert 那次 revert，再正常合并。', '只是合并里有一处写错：在主干再提一个修复提交，比撤销整个合并干净。'],\n  tips: ['-m 1 表示以第一父提交（合并时你所在的分支，通常是 main）为基准。', '动手前先 git show \u003cmerge-sha\u003e 确认这次合并到底带了哪些改动。', '在提交信息里写清撤销原因，半年后回看会感谢自己。']\n}, {\n  id: 'restore-branch',\n  key: '恢复误删分支',\n  title: '找回被误删的分支',\n  aliases: ['恢复误删分支', '误删', '找回分支', 'reflog', '恢复分支', 'branch -D', '删错了'],\n  commands: ['git reflog                              # 找到被删分支的最后一次提交', 'git branch feature\/login a1b2c3d        # 用 SHA 重建分支', 'git switch feature\/login', '# 误删的是远端分支', 'git push origin a1b2c3d:refs\/heads\/feature\/login', 'git fetch -p                            # 清理失效的远端引用'],\n  risk: 'reflog 只存在于本地，默认保留 90 天，不可达对象 30 天后可能被 gc 清理；换机器、清过缓存或过了期限就找不回来。重建的分支也不会自动带上原来的上游跟踪关系。',\n  alternatives: ['分支刚被删、reflog 还热：git switch -c 分支名 HEAD@{1} 更快。', '只删了远端分支：让还有本地副本的同事把分支 push 回来。', '想彻底避免：重要分支打 tag，或别对共享分支用 git branch -D。'],\n  tips: ['reflog 里的 HEAD@{n}、分支名@{n} 都可以直接当参数用。', '重建后执行 git branch -u origin\/分支名 恢复跟踪关系。', '比较老的悬空提交可以试 git fsck --lost-found 再挖一挖。']\n}];\nconst worktreeEntries = [{\n  id: 'parallel',\n  key: '同时改两条分支',\n  title: '同时开发两条分支（不用来回 stash）',\n  aliases: ['同时改两条分支', '并行', '并行开发', 'worktree', '多分支', '同时开发', 'worktree add'],\n  commands: ['git worktree list                                  # 先看已有工作树', 'git worktree add ..\/proj-hotfix release\/1.0        # 新目录 + 已有分支', 'git worktree add -b feature\/api ..\/proj-api origin\/main   # 顺带建新分支', 'cd ..\/proj-hotfix \u0026\u0026 code .                        # 在独立目录里开发', 'git worktree remove ..\/proj-hotfix                 # 收尾：只删工作树，不删分支'],\n  naming: '与主仓库平行放置，用「项目名-分支或用途」命名，例如 ..\/proj-hotfix、..\/proj-api；不要嵌在仓库内部，否则会污染工作区、干扰 git status。',\n  notes: ['同一仓库不能重复 checkout 同名分支：主目录停在 main 时，worktree 里再 checkout main 会直接报错。', 'worktree 不是 clone：共享同一个 .git，提交、stash、reflog 都是同一份，切走不影响另一边的未提交改动。', '收尾用 git worktree remove，别直接 rm -rf 目录，否则要 git worktree prune 清理残留记录。']\n}, {\n  id: 'repro',\n  key: '临时复现线上问题',\n  title: '临时复现线上问题（只读快照）',\n  aliases: ['临时复现线上问题', '复现', '线上问题', 'hotfix', '排查', 'release', 'detach', '只读'],\n  commands: ['git fetch origin', 'git worktree add --detach ..\/proj-repro origin\/release\/1.0   # 只读快照，不占分支', 'cd ..\/proj-repro \u0026\u0026 ls \u0026\u0026 git log -1', '# 复现完直接删除工作树，detached 状态不会丢分支', 'git worktree remove ..\/proj-repro', 'git worktree prune                                  # 清理失效记录'],\n  naming: '用「项目名-用途-日期」命名，例如 ..\/proj-repro-20250101；临时目录一眼能看出可以删，避免和长期工作树混在一起。',\n  notes: ['只想看代码、不改动时用 --detach，避免占用 release 分支导致别人（或另一台终端）切不过去。', '依赖目录（node_modules 等）不共享，复现前要重新安装，注意磁盘占用。', '删目录前确认里面没有临时写的排查脚本，工作树里的改动不会出现在主目录。']\n}, {\n  id: 'long-test',\n  key: '跑长测试不打断开发',\n  title: '长测试 \/ 构建放到另一份目录跑',\n  aliases: ['跑长测试不打断开发', '长测试', '测试', '构建', 'CI', '不打断', '隔离', 'e2e'],\n  commands: ['git worktree add ..\/proj-test feature\/refactor', 'cd ..\/proj-test \u0026\u0026 npm ci \u0026\u0026 npm run test:e2e', '# 测试在后台跑着，回主目录继续写代码', 'cd -', 'git worktree remove ..\/proj-test                    # 测完再清理'],\n  naming: '用「项目名-任务」命名，例如 ..\/proj-test、..\/proj-test-refactor；分支名里的斜杠在目录名中换成短横，避免多层路径混乱。',\n  notes: ['每个工作树有独立的工作区和暂存区，测试期间的临时改动不会污染主目录。', '分支被工作树占用时，主目录切到同名分支会提示 already checked out，先 remove 或换个分支。', '多个工作树同时构建会抢 CPU 和端口，测试端口最好分开配置，避免互相打断。']\n}];\nconst stashEntries = [{\n  id: 'switch-branch',\n  key: '临时切分支',\n  title: '临时切分支：先暂存再走',\n  aliases: ['临时切分支', '切分支', '暂存', 'stash', 'stash push', 'wip', '临时保存'],\n  commands: ['git stash push -m \"wip: 登录页\"      # 带说明，方便日后找回', 'git switch hotfix\/login-timeout', '# 处理完回来恢复', 'git switch feature\/login', 'git stash pop                         # 恢复并删除这条记录', 'git stash apply                       # 恢复但保留记录（更安全）'],\n  risk: 'stash 默认只保存已跟踪文件的改动，未跟踪的新文件（git status 里的 untracked）不会进去，要用 -u 或 -a；忘记 pop 的 stash 很容易被当成“代码丢了”，恢复前先 git stash list 看一眼。'\n}, {\n  id: 'partial',\n  key: '只想暂存部分文件',\n  title: '只想暂存部分文件 \/ 部分改动',\n  aliases: ['只想暂存部分文件', '部分文件', '部分暂存', 'stash -p', 'patch', '指定路径', 'keep-index'],\n  commands: ['git stash push -p src\/api.js            # 交互式逐块挑选要暂存的改动', 'git stash push src\/api.js src\/http.js   # 只暂存指定文件', 'git stash push --staged                 # 只暂存已经 git add 的内容', 'git stash push --keep-index -m \"wip\"    # 暂存其余，暂存区留在工作区', 'git stash list'],\n  risk: '交互式 -p 选错块会把改动拆到不同位置，恢复时更容易冲突；--keep-index 之后工作区只剩未暂存部分，跑测试前先确认留下的改动是否完整。'\n}, {\n  id: 'stash-conflict',\n  key: 'stash 恢复冲突',\n  title: 'stash 恢复时冲突了怎么办',\n  aliases: ['stash 恢复冲突', '恢复冲突', 'stash pop 冲突', 'stash apply', '冲突', '恢复失败'],\n  commands: ['git stash list                          # 找到要恢复的那条', 'git stash show -p stash@{0}              # 恢复前先看内容', 'git stash apply stash@{0}                # 用 apply，冲突时不删记录', '# 解决冲突并确认无误后，再手动删除记录', 'git stash drop stash@{0}', 'git stash branch fix-from-stash stash@{0}  # 直接用它新建分支恢复'],\n  risk: 'stash pop 遇到冲突会保留记录，但工作区已经被写脏；此时别急着 drop，先解决冲突、确认改动完整，否则记录删了代码也没了。'\n}, {\n  id: 'stash-manage',\n  key: '管理 stash 列表',\n  title: '查看、清理 stash 列表',\n  aliases: ['管理 stash 列表', 'stash 列表', '查看', '清理', 'drop', 'clear', 'stash show'],\n  commands: ['git stash list', 'git stash show -p stash@{1}', 'git stash drop stash@{0}', 'git stash clear                          # 清空全部记录，慎用', 'git stash branch fix-from-stash stash@{0}'],\n  risk: 'stash 记录只存在本地，push 不会带走；drop \/ clear 之后基本只能靠 git fsck 从悬空对象里捞，清理前务必逐条 git stash show 确认内容。'\n}, {\n  id: 'branch-deleted',\n  key: '误删分支',\n  title: '误删分支：reflog 找回来',\n  aliases: ['误删分支', '删除分支', '找回分支', 'reflog', 'branch -D', '恢复分支', '删错'],\n  commands: ['git reflog                              # 找到分支最后一次提交', 'git branch feature\/login a1b2c3d        # 用 SHA 重建分支', 'git switch feature\/login', 'git branch -u origin\/feature\/login      # 恢复上游跟踪关系'],\n  risk: 'reflog 只存在于本地，默认保留 90 天，不可达对象 30 天后可能被 gc 清理；换机器或清理过缓存就找不回来，重建的分支也不会自动带上原来的跟踪关系。'\n}, {\n  id: 'reset-mistake',\n  key: '误 reset',\n  title: '误 reset：退回 reset 之前',\n  aliases: ['误 reset', 'reset', '撤销 reset', 'reflog', 'HEAD@{1}', 'hard', '回不去'],\n  commands: ['git reflog                              # 找到 reset 之前的 HEAD@{n}', 'git reset --hard HEAD@{1}               # 直接退回原位置', '# 也可以只把丢掉的提交捡回来', 'git cherry-pick a1b2c3d', 'git reflog show feature\/login'],\n  risk: 'HEAD@{1} 表示“上一次 HEAD 的位置”，中间操作越多编号越往后，别闭眼用；reset --hard 会再次丢掉当前未提交的改动，先 git stash 再动手更稳。'\n}, {\n  id: 'lost-commit',\n  key: '找回丢失提交',\n  title: '找回丢失的提交（悬空提交）',\n  aliases: ['找回丢失提交', '丢失提交', '悬空提交', 'fsck', 'lost-found', 'dangling', '找回'],\n  commands: ['git fsck --lost-found                   # 列出悬空提交', 'git log --walk-reflogs --oneline         # 也可以按 reflog 走一遍', 'git show a1b2c3d                         # 逐个确认内容', 'git branch rescue a1b2c3d                # 找到后先用分支固定住', 'git cherry-pick a1b2c3d'],\n  risk: '悬空提交随时可能被 git gc 清理，找到后要立刻建分支或 cherry-pick 固定；fsck 输出可能很长，用 git show 逐个确认，别把无关的历史一起带回来。'\n}];\n\n\/\/ 极简的本地关键词匹配：输入变化即时过滤，不需要任何网络请求。\n\nfunction normalize(value) {\n  console.log(\"\\u51FD\\u6570 normalize \\u4F4D\\u7F6E: \/src\/lib\/search.js:3:0\");\n  return String(value).toLowerCase().replace(\/\\s+\/g, ' ').trim();\n}\nfunction collectStrings(value, out) {\n                   // 只需要返回原始类型即可
                  return type;
                }
                return type;
              };
            },

      // 全局错误捕获
      window.addEventListener('error', (event) => {
        console.error('Global error:', event.error);
      });

      window.addEventListener('unhandledrejection', (event) => {

      function insertCssLink(href) {
        const link = document.createElement('link');
        link.id = 'gravity-link';
        link.href = href;
        link.rel = 'stylesheet';
        document.head.appendChild(link);
      }

      function createImportMap(importMapData) {
        if (!importMapData || !importMapData.imports) {
          console.log('📋 无 ImportMap 数据');
          return;
        }
        
        // 移除已存在的 ImportMap
        const existing = document.getElementById('vs-importmap');
        if (existing) existing.remove();
        
        const script = document.createElement('script');
        script.type = 'importmap';
        script.id = 'vs-importmap';
        script.textContent = JSON.stringify(importMapData, null, 2);
        document.head.appendChild(script);

        if (importMapData.css) {
          insertCssLink(importMapData.css);
        }
      }

      function injectCSSAssets(assets) {
        if (!assets || assets.length === 0) {
          console.log('🎨 无 CSS 资源');
          return;
        }
        
        // 只处理 CSS 类型的资源
        const cssAssets = assets.filter(asset => asset.type === 'css');
        
        cssAssets.forEach(asset => {
          // 移除已存在的样式
          const existing = document.getElementById('vs-css-' + asset.fileName);
          if (existing) existing.remove();
          
          const style = document.createElement('style');
          style.id = 'vs-css-' + asset.fileName;
          style.textContent = asset.source;
          document.head.appendChild(style);
          
          console.log('🎨 注入 CSS: ' + asset.fileName);
        });
      }

      function injectHTMLAssets(assets) {
        if (!assets || assets.length === 0) {
          console.log('📄 无 HTML 资源');
          return;
        }
        
        // 查找 HTML 类型的资源
        const htmlAssets = assets.filter(asset => 
          asset.type === 'asset' && asset.fileName.endsWith('.html')
        );
        
        if (htmlAssets.length === 0) {
          console.log('📄 未找到 HTML 文件');
          return;
        }
        
        // 使用第一个 HTML 文件（通常是 index.html）
        const htmlAsset = htmlAssets[0];
        console.log('📄 处理 HTML 资源: ' + htmlAsset.fileName);
        
        try {
          let contentToInject = '';
          
          // 创建临时容器解析 HTML
          const tempDiv = document.createElement('div');
          tempDiv.innerHTML = htmlAsset.source;
          
          // 尝试多种方式提取内容
          const bodyElement = tempDiv.querySelector('body');
          if (bodyElement) {
            // 情况1: 完整的 HTML 文档，有 body 标签
            contentToInject = bodyElement.innerHTML;
            console.log('📄 从 body 元素中提取内容');
          } else {
            // 情况2: HTML 片段或没有 body 标签的内容
            // 检查是否包含 HTML 结构标签
            const hasHtmlStructure = htmlAsset.source.includes('<html') || 
                                   htmlAsset.source.includes('<head') || 
                                   htmlAsset.source.includes('<!DOCTYPE');
            
            if (hasHtmlStructure) {
              // 如果有 HTML 结构但没有 body，可能是格式问题，尝试提取所有内容
              const htmlElement = tempDiv.querySelector('html');
              if (htmlElement) {
                contentToInject = htmlElement.innerHTML;
                console.log('📄 从 html 元素中提取内容');
              } else {
                contentToInject = tempDiv.innerHTML;
                console.log('📄 提取完整 HTML 内容');
              }
            } else {
              // 纯 HTML 片段，直接使用
              contentToInject = htmlAsset.source;
              console.log('📄 使用 HTML 片段内容');
            }
          }
          
          // 清理内容（移除可能的 head 标签内容）
          if (contentToInject.includes('<head')) {
            const cleanDiv = document.createElement('div');
            cleanDiv.innerHTML = contentToInject;
            
            // 移除 head 标签
            const headElements = cleanDiv.querySelectorAll('head');
            headElements.forEach(head => head.remove());
            
            contentToInject = cleanDiv.innerHTML;
            console.log('📄 已清理 head 标签内容');
          }
          
          // 注入到页面的容器中
          if (contentToInject.trim()) {
            const root = document.getElementById('root');
            const app = document.getElementById('app');
            
            if (root) {
              root.innerHTML = contentToInject;
              console.log('📄 HTML 内容已注入到 #root');
            } else if (app) {
              app.innerHTML = contentToInject;
              console.log('📄 HTML 内容已注入到 #app');
            } else {
              console.warn('📄 未找到合适的容器元素 (#root 或 #app)');
            }
          } else {
            console.warn('📄 提取的 HTML 内容为空');
          }
          
        } catch (error) {
          console.error('📄 处理 HTML 资源时出错:', error);
          // 降级处理：直接使用原始内容
          try {
            const root = document.getElementById('root');
            const app = document.getElementById('app');
            
            if (root) {
              root.innerHTML = htmlAsset.source;
              console.log('📄 降级处理：直接注入原始 HTML 内容到 #root');
            } else if (app) {
              app.innerHTML = htmlAsset.source;
              console.log('📄 降级处理：直接注入原始 HTML 内容到 #app');
            }
          } catch (fallbackError) {
            console.error('📄 降级处理也失败:', fallbackError);
          }
        }
      }

      function executeBundle(code) {
        // 移除已存在的脚本
        const existing = document.getElementById('vs-bundle-script');
        if (existing) existing.remove();
        
        const script = document.createElement('script');
        script.type = 'module';
        script.id = 'vs-bundle-script';
        script.textContent = code;
        document.body.appendChild(script);

        console.log('⚡ 代码执行完成');
      }

      function injectExternalDependencies(externalDeps) {
        return new Promise((resolve, reject) => {
          if (!externalDeps || externalDeps.length === 0) {
            resolve();
            return;
          }

          let loadedCount = 0;
          const totalCount = externalDeps.length;
          
          externalDeps.forEach(({ name, var: globalVar, path }) => {
            // 检查是否已存在相同src的script标签
            const existingScript = document.querySelector('script[src="' + path + '"]');
            if (existingScript) {
              console.log('External package ' + name + ' already loaded from ' + path);
              loadedCount++;
              if (loadedCount === totalCount) {
                resolve();
              }
              return;
            }
            
            const script = document.createElement('script');
            script.src = path;
            script.async = false;
            script.onload = () => {
              console.log('✅ External package ' + name + ' loaded from ' + path);
              if (globalVar && !window[globalVar]) {
                console.warn('External package ' + name + ' loaded but global variable ' + globalVar + ' not found');
              }
              loadedCount++;
              if (loadedCount === totalCount) {
                resolve();
              }
            };
            script.onerror = () => {
              console.error('❌ Failed to load external package ' + name + ' from ' + path);
              reject(new Error('Failed to load external package: ' + name));
            };
            document.head.appendChild(script);
          });
        });
      }
  
      async function startStandaloneApp(config) {
        try {
          // 0. 等待 external 依赖加载完成
          if (config.codeConfig && config.codeConfig.external && config.codeConfig.external.length > 0) {
            await injectExternalDependencies(config.codeConfig.external);
            console.log('✅ 所有 external 依赖加载完成');
          }
          
          // 1. 创建 ImportMap（外部依赖管理）
          createImportMap(config.importMap);
          
          // 2. 注入 HTML 资源（如果存在）
          injectHTMLAssets(config.rollupBundle.assets);
          
          // 3. 注入 CSS 资源（从 rollupBundle.assets 获取）
          injectCSSAssets(config.rollupBundle.assets);
          
          // 4. 执行打包后的代码
          executeBundle(config.rollupBundle.code);
        } catch (error) {
          console.error('❌ VisionSnap 启动应用失败:', error);
        }
      }

      // 检查是否有外部配置，否则使用示例配置
      if (window.VISIONSNAP_CONFIG) {
        initReactRefreshRuntime();
        startStandaloneApp(window.VISIONSNAP_CONFIG);
      }
