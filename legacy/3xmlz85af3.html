      function insertCssLink(href) {
        const link = document.createElement('link');
        link.id = 'gravity-link';
        link.href = href;
        link.rel = 'stylesheet';
        document.head.appendChild(link);
      }

      function createImportMap(importMapData) {
        if (!importMapData || !importMapData.imports) {
          console.log('📋 无 ImportMap 数据');
          return;
        }
        
        // 移除已存在的 ImportMap
        const existing = document.getElementById('vs-importmap');
        if (existing) existing.remove();
        
        const script = document.createElement('script');
        script.type = 'importmap';
        script.id = 'vs-importmap';
        script.textContent = JSON.stringify(importMapData, null, 2);
        document.head.appendChild(script);

        if (importMapData.css) {
          insertCssLink(importMapData.css);
        }
      }

      function injectCSSAssets(assets) {
        if (!assets || assets.length === 0) {
          console.log('🎨 无 CSS 资源');
          return;
        }
        
        // 只处理 CSS 类型的资源
        const cssAssets = assets.filter(asset => asset.type === 'css');
        
        cssAssets.forEach(asset => {
          // 移除已存在的样式
          const existing = document.getElementById('vs-css-' + asset.fileName);
          if (existing) existing.remove();
          
          const style = document.createElement('style');
          style.id = 'vs-css-' + asset.fileName;
          style.textContent = asset.source;
          document.head.appendChild(style);
          
          console.log('🎨 注入 CSS: ' + asset.fileName);
        });
      }

          asset.type === 'asset' && asset.fileName.endsWith('.html')
        );
        
        if (htmlAssets.length === 0) {
          console.log('📄 未找到 HTML 文件');
          return;
        }
        
        // 使用第一个 HTML 文件（通常是 index.html）
        const htmlAsset = htmlAssets[0];
        console.log('📄 处理 HTML 资源: ' + htmlAsset.fileName);
        
        try {
          let contentToInject = '';
          
          // 创建临时容器解析 HTML
          const tempDiv = document.createElement('div');
          tempDiv.innerHTML = htmlAsset.source;
          
          // 尝试多种方式提取内容
          const bodyElement = tempDiv.querySelector('body');
          if (bodyElement) {
            // 情况1: 完整的 HTML 文档，有 body 标签
            contentToInject = bodyElement.innerHTML;
            console.log('📄 从 body 元素中提取内容');
          } else {
            // 情况2: HTML 片段或没有 body 标签的内容
            // 检查是否包含 HTML 结构标签
            const hasHtmlStructure = htmlAsset.source.includes('<html') || 
                                   htmlAsset.source.includes('<head') || 
                                   htmlAsset.source.includes('<!DOCTYPE');
            
            if (hasHtmlStructure) {
              // 如果有 HTML 结构但没有 body，可能是格式问题，尝试提取所有内容
              const htmlElement = tempDiv.querySelector('html');
              if (htmlElement) {
                contentToInject = htmlElement.innerHTML;
                console.log('📄 从 html 元素中提取内容');
              } else {
                contentToInject = tempDiv.innerHTML;
                console.log('📄 提取完整 HTML 内容');
              }
            } else {
              // 纯 HTML 片段，直接使用
              contentToInject = htmlAsset.source;
              console.log('📄 使用 HTML 片段内容');
            }
          }
          
          // 清理内容（移除可能的 head 标签内容）
          if (contentToInject.includes('<head')) {
            const cleanDiv = document.createElement('div');
            cleanDiv.innerHTML = contentToInject;
            
            // 移除 head 标签
            const headElements = cleanDiv.querySelectorAll('head');
            headElements.forEach(head => head.remove());
            
            contentToInject = cleanDiv.innerHTML;
            console.log('📄 已清理 head 标签内容');
          }
          
          // 注入到页面的容器中
          if (contentToInject.trim()) {
            const root = document.getElementById('root');
            const app = document.getElementById('app');
            
            if (root) {
              root.innerHTML = contentToInject;
              console.log('📄 HTML 内容已注入到 #root');
            } else if (app) {
              app.innerHTML = contentToInject;
              console.log('📄 HTML 内容已注入到 #app');
            } else {
              console.warn('📄 未找到合适的容器元素 (#root 或 #app)');
            }
          } else {
            console.warn('📄 提取的 HTML 内容为空');
          }
          
        } catch (error) {
          console.error('📄 处理 HTML 资源时出错:', error);
          // 降级处理：直接使用原始内容
          try {
            const root = document.getElementById('root');
            const app = document.getElementById('app');
            
            if (root) {
              root.innerHTML = htmlAsset.source;
              console.log('📄 降级处理：直接注入原始 HTML 内容到 #root');
            } else if (app) {
              app.innerHTML = htmlAsset.source;
              console.log('📄 降级处理：直接注入原始 HTML 内容到 #app');
            }
          } catch (fallbackError) {
            console.error('📄 降级处理也失败:', fallbackError);
          }
        }
      }

      function executeBundle(code) {
        // 移除已存在的脚本
        const existing = document.getElementById('vs-bundle-script');
        if (existing) existing.remove();
        
        const script = document.createElement('script');
        script.type = 'module';
        script.id = 'vs-bundle-script';
        script.textContent = code;
        document.body.appendChild(script);

        console.log('⚡ 代码执行完成');
      }

      function injectExternalDependencies(externalDeps) {
        return new Promise((resolve, reject) => {
          if (!externalDeps || externalDeps.length === 0) {
            resolve();
            return;
          }

          let loadedCount = 0;
          const totalCount = externalDeps.length;
          
          externalDeps.forEach(({ name, var: globalVar, path }) => {
            // 检查是否已存在相同src的script标签
            const existingScript = document.querySelector('script[src="' + path + '"]');
            if (existingScript) {
              console.log('External package ' + name + ' already loaded from ' + path);
              loadedCount++;
              if (loadedCount === totalCount) {
                resolve();
              }
              return;
            }
            
            const script = document.createElement('script');
            script.src = path;
            script.async = false;
            script.onload = () => {
              console.log('✅ External package ' + name + ' loaded from ' + path);
              if (globalVar && !window[globalVar]) {
                console.warn('External package ' + name + ' loaded but global variable ' + globalVar + ' not found');
              }
              loadedCount++;
              if (loadedCount === totalCount) {
                resolve();
              }
            };
            script.onerror = () => {
              console.error('❌ Failed to load external package ' + name + ' from ' + path);
              reject(new Error('Failed to load external package: ' + name));
            };
            document.head.appendChild(script);
          });
        });
      }
  
      async function startStandaloneApp(config) {
        try {
          // 0. 等待 external 依赖加载完成
          if (config.codeConfig && config.codeConfig.external && config.codeConfig.external.length > 0) {
            await injectExternalDependencies(config.codeConfig.external);
            console.log('✅ 所有 external 依赖加载完成');
          }
          
          // 1. 创建 ImportMap（外部依赖管理）
          createImportMap(config.importMap);
          
          // 2. 注入 HTML 资源（如果存在）
          injectHTMLAssets(config.rollupBundle.assets);
          
          // 3. 注入 CSS 资源（从 rollupBundle.assets 获取）
          injectCSSAssets(config.rollupBundle.assets);
          
          // 4. 执行打包后的代码
          executeBundle(config.rollupBundle.code);
        } catch (error) {
          console.error('❌ VisionSnap 启动应用失败:', error);
        }
      }

      // 检查是否有外部配置，否则使用示例配置
      if (window.VISIONSNAP_CONFIG) {
        initReactRefreshRuntime();
        startStandaloneApp(window.VISIONSNAP_CONFIG);
      }
    </script><!-- END vision_snap_config -->
  </body>
</html>
