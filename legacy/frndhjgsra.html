itle: '重启 \/ 热重载（restart、reload 区别）',\n  keywords: ['重启', 'restart', 'reload', '重载', '热更新', '不停机'],\n  commands: [{\n    code: 'systemctl restart nginx',\n    desc: '彻底重启：换新进程，现有连接中断（nginx 尚可，数据库慎用）。'\n  }, {\n    code: 'systemctl reload nginx',\n    desc: '不中断重载配置：前提是 unit 定义了 ExecReload（nginx、php-fpm、sshd 都支持）。'\n  }, {\n    code: 'systemctl reload-or-restart nginx',\n    desc: '能热重载就热重载，没有 ExecReload 就退回 restart；改配置后的稳妥选项。'\n  }, {\n    code: 'sudo nginx -t \u0026\u0026 sudo systemctl reload nginx',\n    desc: '专业写法：先用应用自带检查（nginx -t \/ php-fpm -t）验配置，通过再热重载。'\n  }]\n}, {\n  id: 'stop',\n  title: '停止服务（stop 卡住 → 强杀）',\n  keywords: ['停止', 'stop', '关停', '杀进程', '停服务'],\n  commands: [{\n    code: 'systemctl stop nginx',\n    desc: '常规停止：发 SIGTERM 等优雅退出（默认最多等 90 秒）。'\n  }, {\n    code: 'systemctl kill -s SIGKILL nginx',\n    desc: 'stop 一直卡就别干等：强杀主进程，随后再普通 stop 清状态。'\n  }, {\n    code: 'sudo systemctl stop nginx \u0026\u0026 sudo ss -tlnp | grep :80',\n    desc: '停后验收：80 不再 LISTEN 才算真停了。'\n  }],\n  steps: ['stop 卡住（\"Stopping...\" 挂起）：多半进程不响应 TERM，用 kill -s SIGKILL 快断。', '每次 90 秒太磨人：unit [Service] 加 TimeoutStopSec=15，daemon-reload 后生效。']\n}, {\n  id: 'enable-autostart',\n  title: '开机自启（enable \/ disable \/ is-enabled）',\n  keywords: ['自启', '开机启动', 'enable', 'disable', 'is-enabled', '随系统启动'],\n  commands: [{\n    code: 'systemctl enable nginx',\n    desc: '设置开机自启；只影响「下次开机」，与当前是否在跑无关——示例核心命令即 systemctl enable 服务名。'\n  }, {\n    code: 'systemctl enable --now nginx',\n    desc: '组合拳：enable + start 一起来；反向则 systemctl disable --now nginx（禁自启 + 停止）。'\n  }, {\n    code: 'systemctl disable nginx',\n    desc: '取消开机自启；不影响当前运行中的进程，要停需另行 stop。'\n  }, {\n    code: 'systemctl is-enabled nginx \u0026\u0026 systemctl is-active nginx',\n    desc: '两个维度问清楚：会不会自启（enabled）与现在跑不跑（active）。'\n  }, {\n    code: 'systemctl list-unit-files --type=service --state=enabled --no-pager',\n    desc: '盘点全机：所有设置了自启的服务清单一次性列出。'\n  }],\n  steps: ['开机自启失败：journalctl -u nginx -b | head -30 看开机时段日志。', '依赖网络才 忘了 daemon-reload，其次才是改错了文件。', 'drop-in（systemctl edit）比直接改原件稳，团队环境务必用这个姿势。']\n}, {\n  id: 'failed-debug',\n  title: '启动失败 \/ 重启循环：全流程排查',\n  keywords: ['启动失败', 'failed', '重启循环', '排查', '退出码', '端口占用'],\n  commands: [{\n    code: 'systemctl status 服务名',\n    desc: '第一步：失败状态与最近日志摘要，过半问题当场确诊。'\n  }, {\n    code: 'journalctl -u 服务名 -b --no-pager -n 100',\n    desc: '第二步：本次开机以来的完整日志，比摘录完整得多。'\n  }, {\n    code: 'systemctl show 服务名 -p ExecMainCode -p ExecMainStatus',\n    desc: '第三步：读取精确退出码（127=命令不存在、1=命令报错、126=无执行权限）。'\n  }, {\n    code: 'systemd-analyze verify \/etc\/systemd\/system\/服务名.service',\n    desc: 'unit 语法体检：路径、依赖关系、写错的字段都能自查。'\n  }, {\n    code: 'sudo ss -tlnp | grep :80',\n    desc: '隐形死因：端口被别的进程占用；另外检查工作目录权限、SELinux、防火墙。'\n  }],\n  steps: ['反复重启：查 unit [Service] 的 Restart=always 与 RestartSec，配合 journalctl --grep 复盘时间轴。', '退出码 ≥ 200：多为 systemd 执行层异常（如 203=ExecStart 找不到或不可执行），核对路径与 +x 权限。', '定位后修补：systemctl edit 服务名 写 override，然后 daemon-reload + restart。']\n}, {\n  id: 'mask',\n  title: 'mask 屏蔽：连 start 都不许再被拉起',\n  keywords: ['mask', 'unmask', '屏蔽', '禁用服务', '彻底禁用'],\n  commands: [{\n    code: 'systemctl mask 服务名',\n    desc: '把 unit 链接指向 \/dev\/null：enable、start、被依赖拉起一律被拒，「永久封印」。'\n  }, {\n    code: 'systemctl unmask 服务名',\n    desc: '解除封印，恢复 enable\/disable 常规语义。'\n  }, {\n    code: 'systemctl is-masked 服务名',\n    desc: '查询当前是否处于 masked 状态。'\n  }],\n  steps: ['mask 与 disable 的区别：disable 只是不随开机自启，仍可能被其他服务或手动拉起；mask 才是彻底堵死。', '误 mask 收回：unmask → daemon-reload → enable --now。']\n}, {\n  id: 'custom-unit',\n  title: '把自研程序包成 systemd 服务（unit 三段式）',\n  keywords: ['自定义服务', 'unit', 'service文件', '模板', '守护进程', 'execstart', '自研'],\n  commands: [{\n    code: 'sudo vi \/etc\/systemd\/system\/myapp.service',\n    desc: '结构三段式：[Unit] 描述与依赖 → [Service] 启动与自愈 → [Install] 自启关系。'\n  }, {\n    code: 'sudo systemctl daemon-reload \u0026\u0026 sudo systemctl enable --now myapp',\n    desc: '写完后的标准三连：重载 → 自启+立刻启动 → systemctl status myapp 验收。'\n  }, {\n    code: 'journalctl -u myap  'journal 原生正则检索：一次匹配多类字样，免手搓管道。'\n  }, {\n    code: 'grep -i \"error\" app.log',\n    desc: '-i 忽略大小写；-c 只数条数；-A 3 -B 3 带上下文；多关键词用 -E \"(a|b)\"。'\n  }, {\n    code: 'grep -E \"(timeout|refused)\" app.log | grep -v \"healthcheck\"',\n    desc: '两段管道：正则抓重点 + grep -v 排除探活等噪音，画面立刻干净。'\n  }, {\n    code: 'tail -n 5000 app.log | grep -i error',\n    desc: '大日志别全表扫：先取最近 5000 行再过滤，快到没有感。'\n  }, {\n    code: 'grep -c \" 500 \" \/var\/log\/nginx\/access.log',\n    desc: '数字给结论：5xx 条数统计；改关键词可算 4xx、404 等。多组对比重启前后最直观。'\n  }],\n  steps: ['关键词要选报文特征字样：timeout、refused、denied、No space 等，而不是猜的标签。', '一上来命中太多：先 grep -v 减噪再细筛；命中太少：改用更短词根或 -E 正则放宽。']\n}, {\n  id: 'bigfile',\n  title: '大文件驯服（数百万行不慌）',\n  keywords: ['大文件', '太大', 'less', '打开', '统计', 'TOP', '压缩', 'split'],\n  commands: [{\n    code: 'less +F \/var\/log\/nginx\/error.log',\n    desc: '分页查看神器：\/error 搜索、n 下一个 N 上一个、G 到尾、g 回头；+F 即实时跟踪，Ctrl+C 退回浏览。'\n  }, {\n    code: 'wc -l big.log \u0026\u0026 du -h big.log',\n    desc: '先看体量：总行数 + 文件大小，决定砍哪一段而不是全扫。'\n  }, {\n    code: \"awk '{print $1}' access.log | sort | uniq -c | sort -rn | head\",\n    desc: '统计 TOP：$1 是来源 IP；换 $9 就是状态码排行，访问日志分析利器。'\n  }, {\n    code: 'zgrep -i error big.log.1.gz',\n    desc: '已压缩的旧日志直接搜：zgrep \/ zcat \/ gunzip -c。'\n  }, {\n    code: 'split -l 1000000 big.log part_',\n    desc: '终极切割：按 100 万行一片（part_aa、part_ab…），分给同事并行分析。'\n  }],\n  steps: ['固定心法「先限范围 → 再过滤 → 最后统计」：tail\/--since → grep\/--grep → sort|uniq。', '在群里\/工单给结论时：TOP10 表格 + wc 计数，比贴整屏截图更有说服力。']\n}, {\n  id: 'service-priority',\n  title: '按服务 \/ 优先级过滤 journald',\n  keywords: ['服务日志', '优先级', 'priority', 'err', '警告', 'journalctl -u', '格式'],\n  commands: [{\n    code: 'journalctl -u nginx --since today',\n    desc: '单服务 + 当天窗口，最常用的叠加两件套。'\n  }, {\n    code: 'journalctl -p err -b',\n    desc: '只看错误级及以上（err..alert）；放宽看 -p warning。'\n  }, {\n    code: 'journalctl -u mysqld -f -o cat',\n    desc: '-o cat 隐藏时间戳等元信息，裸看报错内容，阅读更清爽。'\n  }],\n  steps: ['行被截断\/换行怪：加 --no-pager 或 -o cat 规整输出。', '重启后日志全失忆？journa ', 'df 还有空间却写不进：多半 inode 用爆（海量碎文件），清旧归档或将碎文件合并。', '删了文件磁盘没降：文件仍被进程握着（lsof | grep deleted），重启对应进程或 : \u003e 文件 截断。']\n}, {\n  id: 'locations',\n  title: '常见日志文件位置速记（journal 之外）',\n  keywords: ['日志位置', '路径', 'nginx', 'mysql', 'postgres', 'cron', '登录日志'],\n  commands: [{\n    code: '\/var\/log\/nginx\/{access,error}.log',\n    desc: 'nginx：访问与错误双日志；404\/502 线索多在 error.log。'\n  }, {\n    code: '\/var\/log\/mysql\/error.log   # MariaDB: \/var\/log\/mariadb；PostgreSQL: \/var\/log\/postgresql\/',\n    desc: '数据库：连不上、锁等待、磁盘满，先看这里。'\n  }, {\n    code: '\/var\/log\/auth.log           # RHEL\/CentOS: \/var\/log\/secure',\n    desc: '登录、sudo、提权记录：安全审计必看（Ubuntu\/Debian 是 auth.log）。'\n  }, {\n    code: '\/var\/log\/cron               # Debian: \/var\/log\/syslog',\n    desc: '定时任务何时跑了什么、有没有跳过（发行版路径不同，以本机为准）。'\n  }, {\n    code: 'journalctl -u 服务名 -f',\n    desc: 'systemd 服务的统一入口：自家程序走 stdout\/stderr 会被自动收走，收益最大。'\n  }]\n}];\n\n\/\/ Nginx 5xx 与反向代理排查 · 速查数据（字段：id \/ title \/ keywords \/ commands[{code,desc}] \/ config? \/ configLabel? \/ steps?）\n\nconst nginxTasks = [{\n  id: 'bad-gateway-502',\n  title: '502 Bad Gateway：upstream 未启动或端口错',\n  keywords: ['502', 'bad gateway', 'upstream', 'connect() failed', '连接被拒', 'upstream 未启动'],\n  commands: [{\n    code: 'tail -n 100 -f \/var\/log\/nginx\/error.log',\n    desc: '原因 90% 写在这里：connect() failed (111: Connection refused) while connecting to upstream 就是后端没起或端口不对。'\n  }, {\n    code: 'grep -n \"connect() failed\" \/var\/log\/nginx\/error.log | tail -5',\n    desc: '快速定位失败目标：日志里 upstream: \"http:\/\/10.0.0.5:8080\/api\" 即真实转发地址，和配置逐字对。'\n  }, {\n    code: 'curl -sv http:\/\/10.0.0.5:8080\/health   # 把地址换成日志里的 upstream',\n    desc: '绕过 nginx 直连后端：能通就是 nginx 配置问题，不通就是后端服务没起。'\n  }, {\n    code: 'ss -tlnp | grep 8080 \u0026\u0026 ps aux | grep -v grep | grep -E \"java|python|node|gunicorn\"',\n    desc: '在后端机上确认端口真的在 LISTEN、进程真的活着；容器场景再查映射端口与健康检查。'\n  }, {\n    code: 'sudo nginx -t \u0026\u0026 sudo nginx -T | grep -n \"proxy_pass\"',\n    desc: '配置自检 + 展开全部生效配置：确认 proxy_pass 指到了你以为的那个 upstream。'\n  }],\n  steps: ['先定层级：error.log 报 connect() failed → 后端不可达；没有任何 upstream 行 → 请求没进到 nginx（看 access.log 与 LB\/云安全组）。', '确认 upstream 定义的是「可达 IP:端口」：容器场景写 127.0.0.1 常指错，要写容器网络里可达的地址。', '后端刚重启\/端口变更期：先直连 curl 验证，再 nginx -s reload。', '改完仍 502 且日志显示 connection reset：转看「upstream 提前关闭连接」那一条。'],\n  config: ['upstream app_backend {', '    server 10.0.0.5:8080;', '    keepalive 32;', '}', '', 'server {', '    location \/api\/ {', '        proxy_pass http:\/\/app_backend;', '        proxy_http_version 1.1;', '        proxy_set_header Connection \"\";', '        proxy_set_header Host $host;', '        proxy_set_header X-Real-IP $remote_addr;', '    }', '}'].join('\\n'),\n  configLabel: 'Nginx 示例配置片段'\n}, {\n  id: 'upstream-closed-502',\n  title: '502 变体：upstream prematurely closed \/ reset 连接',\n  keywords: ['502', 'upstream prematurely closed', 'connection reset', 'keepalive', '长连接', '提前关闭'],\n  commands: [{\n    code: 'grep -n -E \"prematurely closed|connection reset by peer\" \/var\/log\/nginx\/error.log | tail -5',\n    desc: '日志原话：upstream prematurely closed connection while reading response header from upstream——后端在回包前就把连接断了。'\n  }, {\n    code: 'curl -sv -H \"Connection: keep-alive\" http:\/\/10.0.0.5:8080\/api\/ping',\n    desc: '模拟 nginx 的 keepalive 请求：能复现 502 就是后端不接受长连接（老框架 \/ http1.0 服务）。'\n  }, {\n    code: 'sudo nginx -T | grep -n -A3 \"upstream \"',\n    desc: '检查 upstream 是否声明 keepalive，以及 location 是否配了 proxy_http_version 1.1（1.0 不支持长连接）。'\n  }],\n  steps: ['短连接速验：把 upstream 里的 keepalive 注掉后 reload，502 消失即确认是长连接兼容问题。', '保留长连接的正确写法：upstream 加 keepalive 32 + location 里 proxy_http_version 1.1 与 proxy_set_header Connection \"\"。', '后端能改则开 keepalive；不能改（如老 php-fpm 直连 HTTP）就维持短连接并去掉 keepalive 指令。', '仍偶发：查后端 worker 超时（如 gunicorn --timeout、tomcat connectionTimeout）是否短于 nginx 的 proxy_read_timeout。'],\n  config: ['upstream app_backend {', '    server 10.0.0.5:8080;', '    keepalive 32;            # 长连接池，缺了它会持续新建连接', '    keepalive_timeout 60s;', '}', '', 'location \/api\/ {', '    proxy_pass http:\/\/app_backend;', '    proxy_http_version 1.1;             # 必须 1.1 才能复用', '    proxy_set_header Connection \"\";     # 清掉 close，保留长连接', '}'].join('\\n'),\n  configLabel: 'Nginx 示例配置片段'\n}, {\n  id: 'gateway-timeout-504',\n  title: '504 Gateway Timeout：proxy_read_timeout 与后端耗时',\n  keywords: ['504', 'gateway timeout', 'proxy_read_timeout', '上游超时', '后端慢', 'timed out'],\n  commands: [{\n    code: 'grep -n \"upstream timed out\" \/var\/log\/nginx\/error.log | tail -5',\n    desc: '504 的标准证据：upstream timed out (110: Connection timed out) while reading response header，说明 nginx 等后端响应超时（默认 60s）。'\n  }, {\n    code: 'curl -w \"耗时: %{time_total}s 状态: %{http_code}\\\\n\" -o \/dev\/null -s http:\/\/10.0.0.5:8080\/slow-api',\n    desc: '直连后端测真实耗时：若本身就 70s，问题在后端 SQL \/ 外部调用，不是 nginx。'\n  }, {\n    code: 'sudo nginx -T | grep -n -E \"proxy_read_timeout|proxy_connect_timeout|proxy_send_timeout\"',\n    desc: '确认当前生效值（默认均为 60s），以及是否被你写在 http 块导致各 location 共享。'\n  }, {\n    code: 'journalctl -u myapp -f   # 或 docker logs -f 容器名',\n    desc: '并行盯后端日志：504 的同时后端往往正在打慢查询 \/ 超时重试记录。'\n  }],\n  steps: ['先判性质：直连后端超过 60s → 后端耗时问题（先查 SQL 慢查询、外部接口超时）；直连很快却 504 → 超时值或连接层配置问题。', '临时解：该 location 调大 proxy_read_timeout（如 300s）与 proxy_send_timeout，nginx -t \u0026\u0026 nginx -s reload。', '连接层慢：proxy_connect_timeout 默认 60s，跨机房\/弱网可调到 5~10s 快速失败，避免 worker 连接被拖住。', '长期解：长任务改异步（提交任务 + 轮询\/回调），并对网关、LB、CDN 各层超时做「外层 \u003e 内层」的阶梯设置。'],\n  config: ['location \/api\/ {', '    proxy_pass http:\/\/app_backend;', '    proxy_connect_timeout 10s;    # 与后端建连超时', '    proxy_send_timeout   60s;     # 发送请求体超时', '    proxy_read_timeout  300s;     # 等后端响应超时（默认 60s）', '    proxy_buffering off;          # 流式\/大响应可关缓冲', '}'].join('\\n'),\n  configLabel: 'Nginx 示例配置片段'\n}, {\n  id: 'entity-too-large-413',\n  title: '413 Request Entity Too Large：client_max_body_size',\n  keywords: ['413', 'request entity too large', 'client_max_body_size', '上传失败', '大文件', '请求体过大'],\n  commands: [{\n    code: 'grep -n \"client intended to send too large body\" \/var\/log\/nginx\/error.log | tail -5',\n    desc: '日志原话会带上限值：client intended to send too large body: 2097152 bytes——默认 1m，超过即被 nginx 直接拒。'\n  }, {\n    code: 'sudo nginx -T | grep -n -E \"client_max_body_size|client_body_buffer_size\"',\n    desc: '确认当前上限值出现的位置：http \/ server \/ location 就近生效，location 里的会覆盖外层。'\n  }, {\n    code: 'curl -v -F \"file=@big.zip\" https:\/\/your-domain\/api\/upload',\n    desc: '用小体积包定界：逐步加大文件，找到开始 413 的真实阈值。'\n  }],\n  steps: ['在对应 server \/ location 里调大 client_max_body_size（如 100m 或 0 表示不限制），nginx -t 后 nginx -s reload。', '上传大文件还要配 client_body_buffer_size（如 1m）与临时目录 client_body_temp_path，减少磁盘搬运。', '不想让 nginx 把请求体落盘：再加 proxy_request_buffering off，边收边转发给后端。', '仍 413 说明前面还有一层：云 LB \/ CDN \/ WAF \/ 网关也有各自上限，逐层同步调大。'],\n  config: ['server {', '    client_max_body_size 100m;        # 全局默认 1m，按业务调大', '    client_body_buffer_size 1m;', '    client_body_temp_path \/var\/lib\/nginx\/body;', '', '    location \/api\/upload {', '        client_max_body_size 500m;    # 单接口更宽', '        proxy_pass http:\/\/app_backend;', '        proxy_request_buffering off;  # 边收边转，省磁盘与内存', '    }', '}'].join('\\n'),\n  configLabel: 'Nginx 示例配置片段'\n}, {\n  id: 'cors',\n  title: '跨域报错：No Access-Control-Allow-Origin \/ 预检失败',\n  keywords: ['跨域', 'cors', 'access-control-allow-origin', 'preflight', 'options', '预检'],\n  commands: [{\n    code: 'curl -sI -X OPTIONS https:\/\/your-domain\/api\/user -H \"Origin: https:\/\/web.example.com\" -H \"Access-Control-Request-Method: POST\"',\n    desc: '直接模拟浏览器预检：返回头里要有 Access-Control-Allow-Methods \/ -Headers，状态码应为 204 或 200。'\n  }, {\n    code: 'sudo nginx -T | grep -n -E \"Access-Control|add_header\"',\n    desc: '检查头在哪一层：add_header 只管「继承链上的最近一层」，location 里重写了 add_header 会让 server 级 CORS 头失效。'\n  }, {\n    code: 'curl -s -o \/dev\/null -D - https:\/\/your-domain\/api\/user | grep -i \"access-control\"',\n    desc: '真实请求的响应头快照：出现两条 Access-Control-Allow-Origin（nginx 与后端各写一次）同样会导致浏览器报错。'\n  }],\n  steps: ['先确认是不是 CORS：浏览器 Console 报 blocked by CORS policy，且 Network 里请求实际已发出（状态码可能 200）。', '预检（OPTIONS）没返回 204\/200 或缺少 Allow-Methods\/Allow-Headers → 跨域在 nginx 层补头，不要只改后端。', '把 add_header 统一放 location 并加 always：错误响应（4xx\/5xx）也要带头，否则报错时浏览器照样拦。', '带 Cookie 的请求：Allow-Origin 不能写 *，必须回具体的 $http_origin，并配 Allow-Credentials true。', '若后端也写了 CORS 头：二选一保留（推荐只在 nginx 或只在后端写），重复头是隐蔽坑。'],\n  config: ['location \/api\/ {', '    proxy_pass http:\/\/app_backend;', '', '    add_header Access-Control-Allow-Origin  $http_origin always;', '    add_header Access-Control-Allow-Methods \"GET, POST, PUT, DELETE, OPTIONS\" always;', '    add_header Access-Control-Allow-Headers \"Content-Type, Authorization\" always;', '    add_header Access-Control-Allow-Credentials true always;', '', '    if ($request_method = OPTIONS) {', '        return 204;               # 预检直接放行，不进后端', '    }', '}'].join('\\n'),\n  configLabel: 'Nginx 示例配置片段'\n}, {\n  id: 'connect-timeout',\n  title: '上游超时：connect() timed out（连接层卡住）',\n  keywords: ['上游超时', 'connect() timed out', 'proxy_connect_timeout', '连接超时', '502', '弱网'],\n  commands: [{\n    code: 'grep -n -E \"connect\\\\(\\\\) timed out|Connection timed out\" \/var\/log\/nginx\/error.log | tail -5',\n    desc: '典型日志：upstream timed out (110: Connection timed out) while connecting to upstream——TCP 握手就没成功，与后端处理快慢无关。'\n  }, {\n    code: 'time curl -v telnet:\/\/10.0.0.5:8080   # 或：nc -vz -w 3 10.0.0.5 8080',\n    desc: '从 nginx 所在机器测建连耗时：超时就找网络\/防火墙，而不是调应用超时。'\n  }, {\n    code: 'sudo iptables -L -n | head -30    # 云环境再看安全组 \/ NACL',\n    desc: '握手被丢包的常见原因：安全组只放行 80\/443、后端改过端口但规则没更新、跨网段回程路由不通。'\n  }, {\n    code: 'sudo nginx -T | grep -n \"proxy_connect_timeout\"',\n    desc: '默认 60s 太长：内网可降到 5s 快速失败，让错误尽早暴露而不是堆满 worker。'\n  }],\n  steps: ['区分两类超时：connect 阶段失败 → 网络\/端口（本条）；read 阶段失败 → 后端慢（看 504 那条）。', '从 nginx 机器出发逐层测：DNS\/主机名解析 → ping\/路由 → nc 端口 → 应用健康检查。', 'DNS 解析慢也会表现为连接超时：proxy_pass 改用域名时检查 resolver 与 \/etc\/resolv.conf。', '调优顺序：先修网络，再设 proxy_connect_timeout 5~10s，最后才谈 proxy_read_timeout 加大。'],\n  config: ['location \/api\/ {', '    proxy_pass http:\/\/app_backend;', '    proxy_connect_timeout 5s;     # 建连超时：快速失败，别占满 worker', '    proxy_next_upstream error timeout http_502;', '    proxy_next_upstream_tries 2;  # 多 upstream 时自动重试下一台', '}'].join('\\n'),\n  configLabel: 'Nginx 示例配置片段'\n}, {\n  id: 'worker-connections',\n  title: '并发打满：worker_connections are not enough',\n  keywords: ['worker_connections', '并发', 'too many open files', '性能', '连接数', '耗尽'],\n  commands: [{\n    code: 'grep -n \"worker_connections are not enough\" \/var\/log\/nginx\/error.log | tail -3',\n    desc: '耗尽连接的明确信号：worker_connections are not enough，随后常见 502\/499 与响应变慢。'\n  }, {\n    code: 'nginx -T | grep -n -E \"worker_processes|worker_connections|worker_rlimit_nofile\"',\n    desc: '看当前上限：worker_connections 是「单个 worker 的最大连接数」，客户端与 upstream 各占一条，因此有效并发约减半。'\n  }, {\n    code: 'ulimit -n \u0026\u0026 cat \/proc\/$(pgrep -o nginx)\/limits | grep \"open files\"',\n    desc: '系统级 fd 上限也要抬：只改 nginx 不改 ulimit，仍会报 too many open files。'\n  }, {\n    code: 'ss -s \u0026\u0026 ss -tan state established | wc -l',\n    desc: '现网连接统计：established 过多先查上游 keepalive 是否复用、以及慢后端是否在积压。'\n  }],\n  steps: ['先把 worker_processes 设为 auto，worker_connections 提到 10240（按内存评估），reload 生效。', '同步抬高系统限制：worker_rlimit_nofile 65535，并配 systemd unit 的 LimitNOFILE 或 \/etc\/security\/limits.conf。', '连接仍打满多半是 upstream 变慢导致的积压：先治后端，别只堆参数。', '对外抗突发：前置 CDN\/LB 限流 + 静态资源缓存，把不必要压力挡在 nginx 之外。'],\n  config: ['worker_processes auto;', 'worker_rlimit_nofile 65535;', '', 'events {', '    worker_connections 10240;   # 默认 512\/1024，高并发明显不够', '    multi_accept on;', '}', '', 'http {', '    keepalive_timeout 65;', '    keepalive_requests 1000;', '}'].join('\\n'),\n  configLabel: 'Nginx 示例配置片段'\n}];\n\n\/\/ DNS 与网络排查 · 速查数据（字段：id \/ title \/ keywords \/ commands[{code,desc}] \/ config? \/ configLabel? \/ steps?）\n\nconst dnsTasks = [{\n  id: 'resolve-fail',\n  title: 'DNS 解析失败：域名 A 记录查不到',\n  keywords: ['dns 解析失败', '解析失败', 'dig', 'nslookup', '主机找不到', '临时故障', '解析不到'],\n  commands: [{\n    code: 'dig +short example.com',\n    desc: '一行验证：返回空 = DNS 层就解析不到；返回 IP = DNS 正常，问题在应用 \/ hosts \/ 连接层。'\n  }, {\n    code: 'dig example.com @8.8.8.8',\n    desc: '换公共 DNS 对照：公共 DNS 通而本地不通，问题就在 \/etc\/resolv.conf 或本地解析器；两边都不通再查 53 端口。'\n  }, {\n    code: 'nslookup example.com 1.1.1.1',\n    desc: 'Windows \/ 精简容器里 dig 可能没装，nslookup 是兜底；指定 1.1.1.1 强制不走本地服务器。'\n  }, {\n    code: 'getent hosts example.com',\n    desc: '走系统全链路解析（含 \/etc\/hosts 与 nsswitch 顺序）；与 dig 结果不一致就是 hosts \/ nscd \/ systemd-resolved 在捣乱。'\n  }, {\n    code: 'cat \/etc\/resolv.conf \u0026\u0026 grep hosts \/etc\/nsswitch.conf',\n    desc: '看当前用的 nameserver，以及解析顺序（files dns mdns4 ...）；被容器 \/ 云注入后会备注\"由谁管理\"。'\n  }],\n  steps: ['先 dig +short 域名：空输出 = DNS 层就失败；有 IP = DNS 正常，往应用 \/ 连接 \/ 证书方向查。', '本地不通而 dig @8.8.8.8 通：换 nameserver 即可；注意 systemd-resolved 场景 \/etc\/resolv.conf 是 stub 软链，直接改可能被回滚，改完要 systemctl daemon-reload 或改 resolved 配置。', '\/etc\/hosts 优先：排查\"测试机连到假地址\"时先 grep 域名 \/etc\/hosts，常是这里埋过坑。', '容器 \/etc\/resolv.conf 由宿主注入并每次重建：要么 docker run --dns 8.8.8.8，要么改 \/etc\/docker\/daemon.json 的 dns 段永久生效。']\n}, {\n  id: 'nxdomain-servfail',\n  title: 'NXDOMAIN \/ SERVFAIL：域名不存在或权威异常',\n  keywords: ['nxdomain', 'servfail', 'no such domain', 'authority', '权威', 'dns 传播', '域名未生效'],\n  commands: [{\n    code: 'dig example.com +noall +comments | grep -E \"status|SERVER\"',\n    desc: \"看 status：NOERROR 正常、SERVFAIL 权威出错、NXDOMAIN 域名不存在、REFUSED 被拒；SERVER 是回答你的解析器。\"\n  }, {\n    code: 'dig soa example.com @8.8.8.8',\n    desc: '在权威上游看 SOA 是否在；新购未生效 \/ 注销过渡期常见 SOA 时有时无。'\n  }, {\n    code: 'dig example.com +trace',\n    desc: '从根开始逐级追：在哪一级 NS 断掉（注册商 NS 配错 \/ TTL 不到）一眼可见。'\n  }],\n  steps: ['NXDOMAIN 多半是域名没配 \/ 输错 \/ 处于 DNS 传播窗：等 TTL 过期，或 dig @8.8.8.8 +trace 看上游链。', 'SERVFAIL 是权威侧出错（DNSSEC 校验失败、NS 服务器宕机）：短期重试，长期要联系域名服务商。', '只个别本地 DNS 报 NXDOMAIN、公共 DNS 正常 → 本地主解析器或运营商污染，换 @8.8.8.8 应急。']\n}, {\n  id: 'resolve-timeout',\n  title: 'DNS 解析超时：53 被丢或解析器太慢',\n  keywords: ['dns 超时', '超时', '解析慢', 'timeout', '53', 'resolv', '防火墙'],\n  commands: [{\n    code: 'dig +time=2 +tries=1 example.com',\n    desc: '2 秒单次尝试复现超时；空输出就是没拿到应答。'\n  }, {\n    code: 'dig example.com @8.8.8.8 +time=2 +tries=1',\n    desc: '同样超时 = 53 出站被丢 \/ 防火墙拦；@8.8.8.8 通而本地超时 = 本地解析器慢或挂了。'\n  }, {\n    code: 'sudo iptables -L -n ; sudo ufw status   # 云上还要看安全组出站 53（UDP\/TCP 都要放行）',\n    desc: '最常见的超时根因：安全组只放行了 80\/443、忘了放行出站 53。'\n  }, {\n    code: 'resolvectl status   # 老系统可用：systemd-resolve --status',\n    desc: 'systemd-resolved 场景看每条链路的 DNS 服务器、DoT 状态、缓存命中。'\n  }, {\n    code: 'dig example.com +tcp   # 走 TCP 53 验证是否 UDP 53 被丢',\n    desc: 'UDP 53 被限但 TCP 53 通 → 运营商封 UDP 53 的典型特征，应急可用 DoH\/DoT 绕开。'\n  }],\n  steps: ['分清是丢包还是慢：@8.8.8.8 单次 2 秒还超时 = 网络 \/ 防火墙丢 UDP 53；公共 DNS 通而本地慢 = 本地 resolver 故障，查 systemd-resolved 或 dnsmasq。', '运营商限 UDP 53：上 DNS-over-TLS \/ DoH（systemd-resolved 设 DNSOverTLS=yes），或临时 dig +tcp 走 TCP 查询。', '容器批量拉不起多因宿主 DNS 不可达：在 \/etc\/docker\/daemon.json 配 \"dns\": [\"8.8.8.8\",\"1.1.1.1\"]，避免单个容器踩雷。'],\n  config: ['# \/etc\/resolv.conf 调超时与重试（与上面 nameserver 同行之下追加 options）', 'nameserver 8.8.8.8', 'nameserver 1.1.1.1', 'options timeout:1 attempts:3 rotate', '# timeout:N 每个 nameserver 超时秒数；attempts:3 共重试轮数；rotate 在多 nameserver 间负载。'].join('\\n'),\n  configLabel: '\/etc\/resolv.conf 片段'\n}, {\n  id: 'tls-cert-error',\n  title: '证书错误：openssl s_client 看证书链',\n  keywords: ['证书错误', '证书', 'tls', 'ssl', 'expired', 'untrusted', '证书过期', '自签', 'sni'],\n  commands: [{\n    code: 'openssl s_client -connect example.com:443 -servername example.com \u003c\/dev\/null',\n    desc: '务必带 -servername（SNI）：不带会拿到服务端默认证书，造成\"证书不对\"假象；末尾 Verify return code 是根因。'\n  }, {\n    code: 'openssl s_client -connect example.com:443 -servername example.com -showcerts \u003c\/dev\/null',\n    desc: '输出含完整证书链：中级 CA 缺失 \/ 链顺序错（先发叶再发中级）是 untrusted 的常见真凶。'\n  }, {\n    code: 'echo | openssl s_client -connect example.com:443 -servername example.com 2\u003e\/dev\/null | openssl x509 -noout -dates -issuer -subject',\n    desc: '一眼看到有效期、颁发者、使用者：expired \/ 自签 \/ 名字不匹配（与 -servername 比对）全暴露。'\n  }, {\n    code: 'curl -vI https:\/\/example.com\/ 2\u003e\u00261 | grep -E \"subject:|issuer:|SSL certificate|expire\"',\n    desc: '系统视角快验：curl 通过但浏览器报错，多半是浏览器 \/ 客户端的 CA bundle 缺中级证书。'\n  }],\n  steps: ['区分返回码：Verify return code 0 = 通过；18 = 自签、20 = 无法取 issuer（中级 CA 没下发）、10 = 已过期。', '中级 CA 缺失：服务端只配了 leaf 证书、没配中级；修法是 nginx apache 用 fullchain 而非 cert（如 ssl_certificate 指向 fullchain.pem）。', '证书过期：续签后 nginx -t \u0026\u0026 nginx -s reload；若开了 OCSP stapling 还要等缓存刷新或手动重启。', \"名字不匹配：常见 SNI 给错 \/ 泛域名不够 \/ 多域名未入 SAN；申请时把所有域名用 -d 全列上（Let's Encrypt \/ acme.sh 均支持）。\", '缺 -servername 是新手最大的坑：很多 CDN 与 SaaS 共享 IP，不带 SNI 时拿到的是别人的默认证书。']\n}, {\n  id: 'connection-refused',\n  title: '连接被拒 (Connection refused)：端口没人监听',\n  keywords: ['连接被拒', 'connection refused', '端口', 'refused', 'nc', 'telnet', '端口不通'],\n  commands: [{\n    code: 'nc -vz example.com 22',\n    desc: '输出会区分两类返回：refused = 到了对端但没人监听该端口；timeout = SYN 被丢（防火墙或路由）。'\n  }, {\n    code: 'nc -vz -w 2 example.com 80',\n    desc: '加 -w 2 设定 2 秒超时：默认要卡满 60 秒才判失败，批量测端口务必加。'\n  }, {\n    code: 'telnet example.com 443   # Windows 默认就有 telnet',\n    desc: '老工具：能进空白屏 = 端口通；立刻 Connection failed = refused；卡很久 = timeout。'\n  }, {\n    code: 'curl 10.0.0.5:8080\/health',\n    desc: '跳过 DNS 直连后端：能通说明 DNS \/ 域名问题，不通说明端口 \/ 服务问题，五秒内分流问题层。'\n  }, {\n    code: 'ss -tlnp | grep :8080   # 在服务机上确认真正监听的地址',\n    desc: '看 LISTEN 是 0.0.0.0:8080 还是 127.0.0.1:8080：后者只对本机开放，外部一律连接被拒。'\n  }],\n  steps: ['先分三类返回：refused = 服务没起或绑错端口；timeout = SYN 被防火墙 \/ 路由丢；连上但卡住 = 端口通但应用层不响应（如把 HTTPS 端口当 HTTP 用）。', '云场景 timeout 优先查安全组 \/ 防火墙是否放行对外端口（80\/443\/22），漏配 inbound 也表现为 timeout。', '本机能连、外部连不上：服务通常绑定在 127.0.0.1 而非 0.0.0.0。把 nginx \/ gunicorn \/ java 的 listen 改成 0.0.0.0 即可。', 'refused 但端口确实有服务：检查 SELinux 布尔（getsebool -a | grep -i httpd_can）与端口策略，容器还要看端口是否真正映射出去。']\n}, {\n  id: 'packet-loss',\n  title: '丢包与链路抖动：mtr \/ ping \/ traceroute',\n  keywords: ['丢包', 'mtr', 'ping', 'traceroute', '链路', '抖动', '网络中断', 'tcp', 'tcp ping'],\n  commands: [{\n    code: 'mtr -rw example.com',\n    desc: '一屏出丢包率与每跳名：-r 是报告模式、-w 宽列显示；真正判断标准是\"终点那跳是否真丢\"，中间 ICMP 节流造成的丢包通常无碍。'\n  }, {\n    code: 'ping -c 100 -i 0.5 example.com | tail -6',\n    desc: '给 100 包才有统计意义的丢包率与 mdev（抖动）；4 个包的 ping 偶然性太大。'\n  }, {\n    code: 'traceroute --tcp -p 443 example.com',\n    desc: '走 TCP 443 排查 ICMP 被限的链路：很多中间路由不回 ICMP 但照样转 TCP 包，TCP traceroute 才看得到路径。'\n  }, {\n    code: 'tcpping example.com:443   # 缺装时可用上面 traceroute --tcp 代替',\n    desc: '比 ping 更贴近业务：ICMP 通而 TCP 不通时，问题往往在目的端的端口策略。'\n  }],\n  steps: ['认准 \"终点跳是否丢包\" 这一项：中间路由 ICMP 节流的 \"% Loss\" 不能直接当真，整包丢失可能只是路由器不计 ICMP。', '抓数量级：ping -c 100 比 ping -c 4 更有说服力；抖动看 mdev，不是看 avg。', '终跳 0% 丢包但应用还卡 → 问题在应用层（慢查询 \/ 限流），不是网络；不要被中间跳丢 ICMP 误导。', '跨机房 \/ 境外中间跳丢包常见但终到 0% 的多半没事；终跳真有丢才上 tcpdump 抓哪段丢。']\n}, {\n  id: 'dns-hijack-tcpdump',\n  title: 'DNS 拦劫 \/ 污染：tcpdump 抓 53',\n  keywords: ['dns 拦劫', 'dns 污染', '劫持', 'tcpdump', '53', 'doh', '运营商劫持', '广告跳转'],\n  commands: [{\n    code: 'sudo tcpdump -i any -nn port 53 2\u003e\u00261 | head -40',\n    desc: '抓本机 DNS 上下行：query 出去后应答里的 IP 应是公共 DNS 给的权威 IP；返回 0.0.0.0 \/ 私网 \/ 运营广告 IP 即被污染。'\n  }, {\n    code: 'sudo tcpdump -i any -nn \"host example.com or port 53\" -w dns.pcap \u0026',\n    desc: '存 pcap 待 Wireshark 深查：DNS 拦劫的指证常需看完整 Q\/R 包与 TTL 异常。'\n  }, {\n    code: 'dig +dnssec example.com   # AD 标志 = 已验证；遇到 BOGUS \/ SERVFAIL 说明校验失败',\n    desc: 'DNSSEC 视角：AD bit 没置上 = 域名没开 DNSSEC 或解析器没启用校验；BOGUS 表示中间被篡改。'\n  }, {\n    code: 'curl --doh-url https:\/\/cloudflare-dns.com\/dns-query https:\/\/example.com',\n    desc: '命令行临时绕走 UDP 53：DoH 走 HTTPS 通道旁路运营商的 53，能通就坐实了本地 53 被拦 \/ 篡改。'\n  }],\n  steps: ['抓包看返回 IP：标准公共 DNS 给的应是公共权威 IP；返回 0.0.0.0 \/ 私网 \/ TTL 异常即被劫持或污染。', '被运营商做广告页：常返回 60.* 之类运营广告 IP；应急换 DoH \/ DoT 或 dig @8.8.8.8 +tcp。', '服务器侧要求企业内 DNS 与公共分流：systemd-resolved 配 DNSOverTLS=yes + 多 resolver，按域名匹配走对应上游。']\n}];\n\n\/\/ CPU 内存负载 · 速查数据（字段：id \/ title \/ keywords \/ commands[{code,desc}] \/ config? \/ configLabel? \/ steps?）\n\nconst cpuTasks = [{\n  id: 'load-high',\n  title: 'load average 高：先分清 us \/ sy \/ wa',\n  keywords: ['load average', '负载高', '平均负载', 'load', 'uptime', 'cpu 跑满', '负载'],\n  commands: [{\n    code: 'uptime',\n    desc: '看 1\/5\/15 分钟三段均值：1 分钟远高于 15 = 刚发作；都不高 = 已经在缓解。负载要与核数对照（nproc）。'\n  }, {\n    code: 'top -o %CPU',\n    desc: '按 %CPU 排序直接揪头号进程（GNU\/procps-ng 语法）；进交互面之后按 P 也能随时切排序，按 q 退出。'\n  }, {\n    code: 'top -bn1 | head -20',\n    desc: '脚本化取快照：单次输出前 20 行，不进交互界面（用于定时截图 \/ 群里甩证据）。'\n  }, {\n    code: 'ps aux --sort=-%cpu | head -10',\n    desc: 'top 之外的稳态视角：附带累计 CPU 时间（TIME），能看出是常驻大户还是突发进程。'\n  }, {\n    code: 'vmstat 1 5',\n    desc: '关键看 us(user)、sy(system)、wa(iowait)、id(idle) 四列：load 高但 id 也高 = 多半在等磁盘（wa 或 D 状态），不是算力问题。'\n  }, {\n    code: 'mpstat -P ALL 1   # sysstat 套件',\n    desc: '每核利用率：全核满 = 用户\/系统进程真的吃满；单核满 = 软中断或单线程瓶颈（见下一条）。'\n  }],\n  steps: ['第一步定性：uptime 三段均值对照 nproc（核数）。load \u003e 核数 × 1.5 才算真高；IO 型机器可容忍更高。', 'us 高（用户态吃满）→ top -o %CPU 找进程，能重启则重启，不能动则限流 \/ 降并发 \/ 优化热点函数。', 'sy 高（内核态吃满）→ 怀疑频繁系统调用 \/ 网络软中断 \/ fork 爆炸；用 strace -c -p PID 抽样看系统调用。', 'wa 高（等待磁盘）→ CPU 核数还有余，但 iowait 顶上来了，直接转 iowait \/ IO 条目处理。', 'load 高但 CPU 空闲：多半是 D 状态（不可中断）进程在拖（NFS \/ 坏盘 \/ 大 IO），先数一数：ps -eo stat,cmd | grep ^D | wc -l。']\n}, {\n  id: 'cpu-saturate',\n  title: 'CPU 跑满：全核满 \/ 单核 ksoftirqd 两种打法',\n  keywords: ['cpu 跑满', '单核满', '软中断', 'ksoftirqd', 'perf', '100%', 'si', '线程'],\n  commands: [{\n    code: 'mpstat -P ALL 1',\n    desc: '先定性：全核满（能力不够）vs 单核满（软中断 \/ 单线程），处置方向完全不同。'\n  }, {\n    code: 'pidstat -u 1 5',\n    desc: '按进程采样 CPU（sysstat 套件）：比 top 更适合留档对比；-p PID 可只盯单个进程。'\n  }, {\n    code: 'top -H -p $(pgrep -of myapp)',\n    desc: '线程级视角：找出烧 CPU 的具体线程（H 模式），Java 类配合 jstack 把 nid=线程号对上栈。'\n  }, {\n    code: 'perf top',\n    desc: '热点函数实时排行：不用重启进程；要看符号就装 debuginfo。采样 30 秒可用 perf record -g -a sleep 30 再 perf report。'\n       // 初始化 React Refresh 运行时
      function initReactRefreshRuntime() {
        // 创建一个简化的 React Refresh 运行时对象
        // 这里提供最基本的接口，避免编译后的代码报错
        if (!window.ReactRefreshRuntime) {
          window.ReactRefreshRuntime = {
            createSignatureFunctionForTransform: function() {
              // 返回一个简化的签名函数
              return function(type, key, forceReset, getCustomHooks) {
                if (typeof key === 'string') {
                  // 在独立运行器中，我们不需要真正的热更新功能
                  // 只需要返回原始类型即可
                  return type;
                }
                return type;
              };
            },
            register: function(type, id) {
              // 空实现，独立运行器不需要注册组件
            },
            injectIntoGlobalHook: function(globalObject) {
              // 空实现，独立运行器不需要注入全局钩子
            },
            performReactRefresh: function() {
              // 空实现，独立运行器不需要执行热更新
              // 这个函数在编译后的代码中会被调用，但在独立运行器中不需要实际功能
              console.log('performReactRefresh called (no-op in standalone runner)');
            },
            // 添加其他可能被调用的 React Refresh 接口
            _getMountedRootCount: function() { return 0; },
            collectCustomHooksForSignature: function() { return []; },
            findAffectedHostInstances: function() { return []; },
            getFamilyByID: function() { return null; },
            getFamilyByType: function() { return null; },
            hasUnrecoverableErrors: function() { return false; },
            isLikelyComponentType: function() { return false; },
            setSignature: function() { /* no-op */ }
          };
          
          // 初始化全局函数
          window.$RefreshReg$ = function(type, id) {
            // 空实现，独立运行器不需要注册组件
          };
          
          window.$RefreshSig$ = function() {
            return function(type) {
              return type;
            };
          };
          
          console.log('React Refresh runtime initialized for standalone runner');
        }
      }

      // 全局错误捕获
      window.addEventListener('error', (event) => {
        console.error('Global error:', event.error);
      });

      window.addEventListener('unhandledrejection', (event) => {
        console.error('Unhandled promise rejection:', event.reason);
      });

      function insertCssLink(href) {
        const link = document.createElement('link');
        link.id = 'gravity-link';
        link.href = href;
        link.rel = 'stylesheet';
        document.head.appendChild(link);
      }

      function createImportMap(importMapData) {
        if (!importMapData || !importMapData.imports) {
          console.log('📋 无 ImportMap 数据');
          return;
        }
        
        // 移除已存在的 ImportMap
        const existing = document.getElementById('vs-importmap');
        if (existing) existing.remove();
        
        const script = document.createElement('script');
        script.type = 'importmap';
        script.id = 'vs-importmap';
        script.textContent = JSON.stringify(importMapData, null, 2);
        document.head.appendChild(script);

        if (importMapData.css) {
          insertCssLink(importMapData.css);
        }
      }

      function injectCSSAssets(assets) {
        if (!assets || assets.length === 0) {
          console.log('🎨 无 CSS 资源');
          return;
        }
        
        // 只处理 CSS 类型的资源
        const cssAssets = assets.filter(asset => asset.type === 'css');
        
        cssAssets.forEach(asset => {
          // 移除已存在的样式
          const existing = document.getElementById('vs-css-' + asset.fileName);
          if (existing) existing.remove();
          
          const style = document.createElement('style');
          style.id = 'vs-css-' + asset.fileName;
          style.textContent = asset.source;
          document.head.appendChild(style);
          
          console.log('🎨 注入 CSS: ' + asset.fileName);
        });
      }

      function injectHTMLAssets(assets) {
        if (!assets || assets.length === 0) {
          console.log('📄 无 HTML 资源');
          return;
        }
        
        // 查找 HTML 类型的资源
        const htmlAssets = assets.filter(asset => 
          asset.type === 'asset' && asset.fileName.endsWith('.html')
        );
        
        if (htmlAssets.length === 0) {
          console.log('📄 未找到 HTML 文件');
          return;
        }
        
        // 使用第一个 HTML 文件（通常是 index.html）
        const htmlAsset = htmlAssets[0];
        console.log('📄 处理 HTML 资源: ' + htmlAsset.fileName);
        
        try {
          let contentToInject = '';
          
          // 创建临时容器解析 HTML
          const tempDiv = document.createElement('div');
          tempDiv.innerHTML = htmlAsset.source;
          
          // 尝试多种方式提取内容
          const bodyElement = tempDiv.querySelector('body');
          if (bodyElement) {
            // 情况1: 完整的 HTML 文档，有 body 标签
            contentToInject = bodyElement.innerHTML;
            console.log('📄 从 body 元素中提取内容');
          } else {
            // 情况2: HTML 片段或没有 body 标签的内容
            // 检查是否包含 HTML 结构标签
            const hasHtmlStructure = htmlAsset.source.includes('<html') || 
                                   htmlAsset.source.includes('<head') || 
                                   htmlAsset.source.includes('<!DOCTYPE');
            
            if (hasHtmlStructure) {
              // 如果有 HTML 结构但没有 body，可能是格式问题，尝试提取所有内容
              const htmlElement = tempDiv.querySelector('html');
              if (htmlElement) {
                contentToInject = htmlElement.innerHTML;
                console.log('📄 从 html 元素中提取内容');
              } else {
                contentToInject = tempDiv.innerHTML;
                console.log('📄 提取完整 HTML 内容');
              }
            } else {
              // 纯 HTML 片段，直接使用
              contentToInject = htmlAsset.source;
              console.log('📄 使用 HTML 片段内容');
            }
          }
          
          // 清理内容（移除可能的 head 标签内容）
          if (contentToInject.includes('<head')) {
            const cleanDiv = document.createElement('div');
            cleanDiv.innerHTML = contentToInject;
            
            // 移除 head 标签
            const headElements = cleanDiv.querySelectorAll('head');
            headElements.forEach(head => head.remove());
            
            contentToInject = cleanDiv.innerHTML;
            console.log('📄 已清理 head 标签内容');
          }
          
          // 注入到页面的容器中
          if (contentToInject.trim()) {
            const root = document.getElementById('root');
            const app = document.getElementById('app');
            
            if (root) {
              root.innerHTML = contentToInject;
              console.log('📄 HTML 内容已注入到 #root');
            } else if (app) {
              app.innerHTML = contentToInject;
              console.log('📄 HTML 内容已注入到 #app');
            } else {
              console.warn('📄 未找到合适的容器元素 (#root 或 #app)');
            }
          } else {
            console.warn('📄 提取的 HTML 内容为空');
          }
          
        } catch (error) {
          console.error('📄 处理 HTML 资源时出错:', error);
          // 降级处理：直接使用原始内容
          try {
            const root = document.getElementById('root');
            const app = document.getElementById('app');
            
            if (root) {
              root.innerHTML = htmlAsset.source;
              console.log('📄 降级处理：直接注入原始 HTML 内容到 #root');
            } else if (app) {
              app.innerHTML = htmlAsset.source;
              console.log('📄 降级处理：直接注入原始 HTML 内容到 #app');
            }
          } catch (fallbackError) {
            console.error('📄 降级处理也失败:', fallbackError);
          }
        }
      }

      function executeBundle(code) {
        // 移除已存在的脚本
        const existing = document.getElementById('vs-bundle-script');
        if (existing) existing.remove();
        
        const script = document.createElement('script');
        script.type = 'module';
        script.id = 'vs-bundle-script';
        script.textContent = code;
        document.body.appendChild(script);

        console.log('⚡ 代码执行完成');
      }

      function injectExternalDependencies(externalDeps) {
        return new Promise((resolve, reject) => {
          if (!externalDeps || externalDeps.length === 0) {
            resolve();
            return;
          }

          let loadedCount = 0;
          const totalCount = externalDeps.length;
          
          externalDeps.forEach(({ name, var: globalVar, path }) => {
            // 检查是否已存在相同src的script标签
            const existingScript = document.querySelector('script[src="' + path + '"]');
            if (existingScript) {
              console.log('External package ' + name + ' already loaded from ' + path);
              loadedCount++;
              if (loadedCount === totalCount) {
                resolve();
              }
              return;
            }
            
            const script = document.createElement('script');
            script.src = path;
            script.async = false;
            script.onload = () => {
              console.log('✅ External package ' + name + ' loaded from ' + path);
              if (globalVar && !window[globalVar]) {
                console.warn('External package ' + name + ' loaded but global variable ' + globalVar + ' not found');
              }
              loadedCount++;
              if (loadedCount === totalCount) {
                resolve();
              }
            };
            script.onerror = () => {
              console.error('❌ Failed to load external package ' + name + ' from ' + path);
              reject(new Error('Failed to load external package: ' + name));
            };
            document.head.appendChild(script);
          });
        });
      }
  
      async function startStandaloneApp(config) {
        try {
          // 0. 等待 external 依赖加载完成
          if (config.codeConfig && config.codeConfig.external && config.codeConfig.external.length > 0) {
            await injectExternalDependencies(config.codeConfig.external);
            console.log('✅ 所有 external 依赖加载完成');
          }
          
          // 1. 创建 ImportMap（外部依赖管理）
          createImportMap(config.importMap);
          
          // 2. 注入 HTML 资源（如果存在）
          injectHTMLAssets(config.rollupBundle.assets);
          
          // 3. 注入 CSS 资源（从 rollupBundle.assets 获取）
          injectCSSAssets(config.rollupBundle.assets);
          
          // 4. 执行打包后的代码
          executeBundle(config.rollupBundle.code);
        } catch (error) {
          console.error('❌ VisionSnap 启动应用失败:', error);
        }
      }

      // 检查是否有外部配置，否则使用示例配置
      if (window.VISIONSNAP_CONFIG) {
        initReactRefreshRuntime();
        startStandaloneApp(window.VISIONSNAP_CONFIG);
      }
