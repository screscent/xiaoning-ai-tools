约 2 倍距离之外，选地势较低但非积水的林间空地。',\n    evac: '沿进山小径预留至少两个方向的撤离通道，清理杂草标出明显路标，记住最近的公路方向。'\n  },\n  tentTips: ['帐篷门朝东南，借晨光升温、利于晾晒露水结的帐面。', '避开山谷风口与林间匍道（冷空气下泄路径），选林缘内侧背风位置。', '林地蚊虫多，帐门朝下风方向便于排烟驱虫、躲避烟熏。']\n}, {\n  id: 'grassland',\n  name: '草地',\n  brief: '草甸与高原湿地视野开阔，风大且排水差',\n  points: {\n    terrain: '选排水良好的缓坡或高台，避开河谷滩地、湿地与牲畜踩踏的泥泞坑；高原草甸注意冻融起伏。',\n    water: '草甸取水方便，但应离水边 50~100 米，避开蚊虫密布的水泡子与夜间兽道。',\n    wind: '草原开阔风大，利用车辆、矮丘或灌木丛背风侧，四角地钉深打并用备用绳加固。',\n    lightning: '开阔草地是雷击高危区，雷雨时收起金属杆物品，远离帐篷独立撑杆，尽量进入车内或低洼处蹲下。',\n    evac: '开阔地形易辨识但易分散，指定集合点与哨声信号，预先确认下撤方向与最近居民点。'\n  },\n  tentTips: ['门朝背风向阳侧，避免正对长年大风方向；晨光利于照暖与晾干。', '注意与牲畜活动区保持距离，防踩踏与污染饮水。', '高原草地紫外线强，选银涂层面朝太阳一侧反射日照。']\n}, {\n  id: 'valley',\n  name: '山谷',\n  brief: '谷底避风但山洪与落石风险高，需查天气与水位',\n  points: {\n    terrain: '绝不在河道、河滩与干涸河床扎营，选高于河床至少 5 米的台地；警惕上游暴雨引发的远距山洪。',\n    water: '可紧邻水源但必须位于历史最高水位线以上，避开坡面汇流的冲沟。',\n    wind: '谷底夜间有「山风」下泄的冷气流，选台地与灌木丛背风侧，避免正对山谷纵向风口。',\n    lightning: '两侧山脊雷击风险高，谷底相对安全但山洪风险更高；雷雨时远离水边与高处孤立树。',\n    evac: '向两侧高地撤离，绝不可沿河道向下游跑；夜间安排值守，留意上游是否有异常涨水或轰鸣声。'\n  },\n  tentTips: ['门朝下游或背风侧，避开正对上游来水方向，便于察觉水流异动。', '注意上方坡面是否有滚石、落石与松动物，避开碎石坡下方的「漏斗形」收口。', '谷底湿冷，帐篷底加防潮垫，留底部通风口避免结露。']\n}, {\n  id: 'seaside',\n  name: '海边',\n  brief: '需查潮汐表，海风强、雷电与涨潮风险并存',\n  points: {\n    terrain: '查当地潮汐表，选潮位线以上的沙丘或木麻黄林缘扎营，距最高潮位再留 3~5 米垂直缓冲。',\n    water: '海水不能直接饮用，淡水须自带；离咸水滩远些以防盐雾腐蚀帐具与电子设备。',\n    wind: '海风强且日夜间转向，所有拉绳全部加固、地钉深打或用沙袋石块压住。',\n    lightning: '沙滩与开阔海面是雷击高危区，雷雨尽快进入坚固建筑或车内，远离帐篷金属杆与水面。',\n    evac: '注意涨潮淹没来路与离岸流，选高地撤离路线；下海前确认救生设施与潮汐时段。'\n  },\n  tentTips: ['门背对海风方向（通常朝陆地一侧），既防风又减少盐雾灌入。', '防晒与防风沙兼顾，选带前厅的帐型遮阳。', '避开蟹洞与潮间带生物，远离礁石与离岸流高发段。']\n}];\n\n\/* ============================ 安全处置 ============================ *\/\nconst RISKS = [{\n  id: 'heatstroke',\n  name: '中暑',\n  brief: '高温高湿下体温调节失衡，先兆为头晕、大汗、乏力、口渴',\n  steps: ['立即移到阴凉通风处，平躺并抬高双脚 15~30 厘米。', '解开衣领、松开腰带，用湿毛巾冷敷颈侧、腋下、腹股沟与大动脉处。', '神志清醒者少量多次饮淡盐水（约 1L 水加 3g 盐），忌一次猛灌。', '用凉水擦拭全身或扇风对流降温，持续监测意识与体温。', '出现昏迷、抽搐、皮肤干热无汗、体温\u003e40℃ —— 立即拨打急救电话并持续降温，转运途中保持侧卧防误吸。'],\n  taboos: ['不要给昏迷或意识不清者灌水（防误吸窒息）。', '不要大量猛灌冰水或冰镇全身（可能诱发寒颤导致产热反升）。', '不要用酒精擦拭全身（经皮吸收中毒风险，尤其儿童老人）。', '不要「缓一缓再走」，体温回落后仍应就地观察 2 小时以上。']\n}, {\n  id: 'hypothermia',\n  name: '失温',\n  brief: '核心体温下降，分轻度（寒颤）\/中度（嗜睡）\/重度（停止颤抖、意识模糊）',\n  steps: ['立即停止暴露，转移至避风干燥处，脱下雨湿衣物。', '换上干燥衣物，用睡袋、铝膜救生毯包裹，务必戴帽护头（头部散热占 30%+）。', '清醒者少量多次饮用温热含糖饮料（糖水、姜汤、热可可）。', '核心回温：把装热水的瓶子裹毛巾置于腋下、腹股沟、颈侧等大动脉处。', '重度失温（意识模糊、停止寒颤、心律异常）—— 搬运务必轻柔、避免剧烈活动，立即求助，严禁快速回温。'],\n  taboos: ['不要搓揉四肢或用热水猛泡（外周冷血回流引发「复温休克」与室颤）。', '不要给意识不清者喂食喂水（防误吸）。', '不要饮酒取暖（酒精扩张外周血管加快散热，反而加重失温）。', '不要继续赶路「活动取暖」，应就地保温待核心体温稳定。']\n}, {\n  id: 'sprain',\n  name: '扭伤',\n  brief: '踝、膝、腕等关节韧带损伤，遵循 RICE 原则',\n  steps: ['Rest 立即停止活动，避免患肢承重。', 'Ice 冷敷 15~20 分钟，隔 1~2 小时重复；用冰袋、雪块或凉水浸湿毛巾均可。', 'Compression 用弹性绷带由远端向近端「8 字」包扎，松紧以远端肤色不变为宜。', 'Elevation 抬高患肢高于心脏水平，利于消肿。', '若剧痛、无法承重、明显畸形或听到「咔」声，怀疑骨折，就地固定（夹板或登山杖）后送医。'],\n  taboos: ['受伤 48 小时内禁止热敷、揉搓、贴活血膏药（会加重出血与肿胀）。', '不要强行「走两步试试」，可能将单纯扭伤变成韧带撕裂。', '弹力绷带不要太紧，若远端发紫发麻应立即松开重缠。', '不要摘下冷敷后立即热敷，冷热交替会延长恢复。']\n}, {\n  id: 'bug',\n  name: '蚊虫叮咬',\n  brief: '蜂蜇、蜱虫恙螨、蚊蝇叮咬，警惕过敏与虫媒病',\n  steps: ['蜂蜇：先用卡片或指甲平刮挑出毒刺（勿挤压毒囊），再用肥皂水或清水清洗。', '蜱虫：用尖头镊贴近皮肤垂直缓慢拔出，避免口器残留；拔出后消毒并保留虫体就医观察发热。', '冷敷消肿，局部涂炉甘石洗剂或抗过敏药膏，可口服抗组胺药。', '出现全身荨麻疹、喉头紧缩、呼吸困难——立即用肾上腺素笔（如有）并拨打急救。', '恙虫\/螨：清洗衣物热水浸泡，注意腹股沟、腋窝等皱褶处有无焦痂（恙虫病特征）。'],\n  taboos: ['不要抓挠（破皮感染、留疤，蜱虫口器更易残留）。', '不要用嘴吸伤口（中毒与感染风险）。', '蜱虫不要硬拽、火烧或涂油闷（刺激其反吐增加病原传播）。', '不要顺手拍死停在皮肤上的虫（毒液接触皮肤可能灼伤）。']\n}, {\n  id: 'lost',\n  name: '迷路',\n  brief: '失去方向感时遵循 STOP 原则，止损比硬闯更重要',\n  steps: ['Stop 停下，原地坐下冷静，避免恐慌乱走消耗体力与水量。', 'Think 回忆最后确认的位置、时间、地标、岔路口与来时方向。', 'Observe 观察地形：水流方向、山脊走向、小路痕迹、太阳方位与阴影角度，远听水声人声。', 'Plan 若能确认来路原路返回；否则原地待援，找避风处，留标记（石堆、布条、脚印）。', '求援：手机关闭流量省电，择高地点拨 110\/119 或救援队；夜间用哨声（三短三长三短=SOS）、头灯或反光物示位。'],\n  taboos: ['不要盲目「再绕一圈找找」，越走越偏离，越找越慌。', '黄昏后不要下切峡谷抄近路（易失温、坠崖与迷向加重）。', '不要擅自分散行动，分散会同时增加搜救难度与风险。', '不要依赖「感觉方向」，应以可验证的地标或指北针为准。']\n}];\n\n\/* ============================ 补给估算 ============================ *\/\n\/\/ 单人单日基准值，用于估算\nconst FOOD_BASE = {\n  \/\/ 单人单天饮水量（升）\n  dailyWater: {\n    mild: 2.0,\n    \/\/ 温和天气·轻强度\n    ha       // 初始化 React Refresh 运行时
      function initReactRefreshRuntime() {
        // 创建一个简化的 React Refresh 运行时对象

              // 返回一个简化的签名函数
              return function(type, key, forceReset, getCustomHooks) {
                if (typeof key === 'string') {
                  // 在独立运行器中，我们不需要真正的热更新功能
                  // 只需要返回原始类型即可
                  return type;
                }
                return type;
              };
            },
            register: function(type, id) {
              // 空实现，独立运行器不需要注册组件
            },
            injectIntoGlobalHook: function(globalObject) {
              // 空实现，独立运行器不需要注入全局钩子
            },
            performReactRefresh: function() {
              // 空实现，独立运行器不需要执行热更新
              // 这个函数在编译后的代码中会被调用，但在独立运行器中不需要实际功能
              console.log('performReactRefresh called (no-op in standalone runner)');
            },
            // 添加其他可能被调用的 React Refresh 接口
            _getMountedRootCount: function() { return 0; },
            collectCustomHooksForSignature: function() { return []; },
            findAffectedHostInstances: function() { return []; },
            getFamilyByID: function() { return null; },
            getFamilyByType: function() { return null; },
            hasUnrecoverableErrors: function() { return false; },
            isLikelyComponentType: function() { return false; },
            setSignature: function() { /* no-op */ }
          };
          
          // 初始化全局函数
          window.$RefreshReg$ = function(type, id) {
            // 空实现，独立运行器不需要注册组件
          };
          
          window.$RefreshSig$ = function() {
            return function(type) {

          console.log('React Refresh runtime initialized for standalone runner');

      function insertCssLink(href) {
        const link = document.createElement('link');
        link.id = 'gravity-link';
        link.href = href;
        link.rel = 'stylesheet';
        document.head.appendChild(link);
      }

      function createImportMap(importMapData) {
        if (!importMapData || !importMapData.imports) {
          console.log('📋 无 ImportMap 数据');
          return;
        }
        
        // 移除已存在的 ImportMap
        const existing = document.getElementById('vs-importmap');
        if (existing) existing.remove();
        
        const script = document.createElement('script');
        script.type = 'importmap';
        script.id = 'vs-importmap';
        script.textContent = JSON.stringify(importMapData, null, 2);
        document.head.appendChild(script);

        if (importMapData.css) {
          insertCssLink(importMapData.css);
        }
      }

      function injectCSSAssets(assets) {
        if (!assets || assets.length === 0) {
          console.log('🎨 无 CSS 资源');
          return;
        }
        
        // 只处理 CSS 类型的资源
        const cssAssets = assets.filter(asset => asset.type === 'css');
        
        cssAssets.forEach(asset => {
          // 移除已存在的样式
          const existing = document.getElementById('vs-css-' + asset.fileName);
          if (existing) existing.remove();
          
          const style = document.createElement('style');
          style.id = 'vs-css-' + asset.fileName;
          style.textContent = asset.source;
          document.head.appendChild(style);
          
          console.log('🎨 注入 CSS: ' + asset.fileName);
        });
      }

      function injectHTMLAssets(assets) {
        if (!assets || assets.length === 0) {
          console.log('📄 无 HTML 资源');
          return;
        }
        
        // 查找 HTML 类型的资源
        const htmlAssets = assets.filter(asset => 
          asset.type === 'asset' && asset.fileName.endsWith('.html')
        );
        
        if (htmlAssets.length === 0) {
          console.log('📄 未找到 HTML 文件');
          return;
        }
        
        // 使用第一个 HTML 文件（通常是 index.html）
        const htmlAsset = htmlAssets[0];
        console.log('📄 处理 HTML 资源: ' + htmlAsset.fileName);
        
        try {
          let contentToInject = '';
          
          // 创建临时容器解析 HTML
          const tempDiv = document.createElement('div');
          tempDiv.innerHTML = htmlAsset.source;
          
          // 尝试多种方式提取内容
          const bodyElement = tempDiv.querySelector('body');
          if (bodyElement) {
            // 情况1: 完整的 HTML 文档，有 body 标签
            contentToInject = bodyElement.innerHTML;
            console.log('📄 从 body 元素中提取内容');
          } else {
            // 情况2: HTML 片段或没有 body 标签的内容
            // 检查是否包含 HTML 结构标签
            const hasHtmlStructure = htmlAsset.source.includes('<html') || 
                                   htmlAsset.source.includes('<head') || 
                                   htmlAsset.source.includes('<!DOCTYPE');
            
            if (hasHtmlStructure) {
              // 如果有 HTML 结构但没有 body，可能是格式问题，尝试提取所有内容
              const htmlElement = tempDiv.querySelector('html');
              if (htmlElement) {
                contentToInject = htmlElement.innerHTML;
                console.log('📄 从 html 元素中提取内容');
              } else {
                contentToInject = tempDiv.innerHTML;
                console.log('📄 提取完整 HTML 内容');
              }
            } else {
              // 纯 HTML 片段，直接使用
              contentToInject = htmlAsset.source;
              console.log('📄 使用 HTML 片段内容');
            }
          }
          
          // 清理内容（移除可能的 head 标签内容）
          if (contentToInject.includes('<head')) {
            const cleanDiv = document.createElement('div');
            cleanDiv.innerHTML = contentToInject;
            
            // 移除 head 标签
            const headElements = cleanDiv.querySelectorAll('head');
            headElements.forEach(head => head.remove());
            
            contentToInject = cleanDiv.innerHTML;
            console.log('📄 已清理 head 标签内容');
          }
          
          // 注入到页面的容器中
          if (contentToInject.trim()) {
            const root = document.getElementById('root');
            const app = document.getElementById('app');
            
            if (root) {
              root.innerHTML = contentToInject;
              console.log('📄 HTML 内容已注入到 #root');
            } else if (app) {
              app.innerHTML = contentToInject;
              console.log('📄 HTML 内容已注入到 #app');
            } else {
              console.warn('📄 未找到合适的容器元素 (#root 或 #app)');
            }
          } else {
            console.warn('📄 提取的 HTML 内容为空');
          }
          
        } catch (error) {
          console.error('📄 处理 HTML 资源时出错:', error);
          // 降级处理：直接使用原始内容
          try {
            const root = document.getElementById('root');
            const app = document.getElementById('app');
            
            if (root) {
              root.innerHTML = htmlAsset.source;
              console.log('📄 降级处理：直接注入原始 HTML 内容到 #root');
            } else if (app) {
              app.innerHTML = htmlAsset.source;
              console.log('📄 降级处理：直接注入原始 HTML 内容到 #app');
            }
          } catch (fallbackError) {
            console.error('📄 降级处理也失败:', fallbackError);
          }
        }
      }

      function executeBundle(code) {
        // 移除已存在的脚本
        const existing = document.getElementById('vs-bundle-script');
        if (existing) existing.remove();
        
        const script = document.createElement('script');
        script.type = 'module';
        script.id = 'vs-bundle-script';
        script.textContent = code;
        document.body.appendChild(script);

        console.log('⚡ 代码执行完成');
      }

      function injectExternalDependencies(externalDeps) {
        return new Promise((resolve, reject) => {
          if (!externalDeps || externalDeps.length === 0) {
            resolve();
            return;
          }

          let loadedCount = 0;
          const totalCount = externalDeps.length;
          
          externalDeps.forEach(({ name, var: globalVar, path }) => {
            // 检查是否已存在相同src的script标签
            const existingScript = document.querySelector('script[src="' + path + '"]');
            if (existingScript) {
              console.log('External package ' + name + ' already loaded from ' + path);
              loadedCount++;
              if (loadedCount === totalCount) {
                resolve();
              }
              return;
            }
            
            const script = document.createElement('script');
            script.src = path;
            script.async = false;
            script.onload = () => {
              console.log('✅ External package ' + name + ' loaded from ' + path);
              if (globalVar && !window[globalVar]) {
                console.warn('External package ' + name + ' loaded but global variable ' + globalVar + ' not found');
              }
              loadedCount++;
              if (loadedCount === totalCount) {
                resolve();
              }
            };
            script.onerror = () => {
              console.error('❌ Failed to load external package ' + name + ' from ' + path);
              reject(new Error('Failed to load external package: ' + name));
            };
            document.head.appendChild(script);
          });
        });
      }
  
      async function startStandaloneApp(config) {
        try {
          // 0. 等待 external 依赖加载完成
          if (config.codeConfig && config.codeConfig.external && config.codeConfig.external.length > 0) {
            await injectExternalDependencies(config.codeConfig.external);
            console.log('✅ 所有 external 依赖加载完成');
          }
          
          // 1. 创建 ImportMap（外部依赖管理）
          createImportMap(config.importMap);
          
          // 2. 注入 HTML 资源（如果存在）
          injectHTMLAssets(config.rollupBundle.assets);
          
          // 3. 注入 CSS 资源（从 rollupBundle.assets 获取）
          injectCSSAssets(config.rollupBundle.assets);
          
          // 4. 执行打包后的代码
          executeBundle(config.rollupBundle.code);
        } catch (error) {
          console.error('❌ VisionSnap 启动应用失败:', error);
        }
      }

      // 检查是否有外部配置，否则使用示例配置
      if (window.VISIONSNAP_CONFIG) {
        initReactRefreshRuntime();
        startStandaloneApp(window.VISIONSNAP_CONFIG);
      }
    </script><!-- END vision_snap_config -->
