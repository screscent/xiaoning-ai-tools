平整处，看清纸卡在哪一段', '两手捏住纸的两边顺滚筒方向抽出；推纸时顶纸的背面，别碰感光鼓表面，手印和刮痕都会印到纸上', '常见卡点有三处：进纸口、硒鼓下方的纸道、定影出口，后盖和侧盖也要翻一遍', '碎纸全部清完再装回硒鼓，合盖开机；出纸口反复卡且纸发皱，多半是纸潮或超克重', '换一沓干燥 80g 复印纸再测；定影区域反复卡纸、掉粉或纸皱，就是定影件要送修的信号']\n    },\n    codes: [['佳能 E03', '卡纸 \/ 进纸失败，屏幕会标注取纸位置', '按提示开盖取纸，按住停止键 5 秒复位续打', 'inkjet'], ['佳能 5100', '字车（喷头小车）移动受阻，最常被误认为卡纸', '查喷头导轨与两侧边缝：碎纸、发卡、墨渍，清干净重启', 'inkjet'], ['惠普 13.xx.xx', '卡纸类代码：13A 进纸区 \/ 13B 传送区 \/ 13C 出纸区', '按后两位对应的区域开盖取纸；反复出现就清洁搓纸轮', 'all'], ['爱普生「卡纸」图示', '进纸器 \/ 机器内部 \/ 出纸槽任一处卡纸', '按面板图示位置取纸，两处都找不到就开背面检修盖', 'inkjet'], ['惠普 50.x', '定影器过热或故障，常伴随出纸口卡纸、纸发皱', '断电 10 分钟冷却再开；反复出现送修，别自己拆定影器', 'laser'], ['激光 41.3', '送入纸张的尺寸与打印设置不一致', '纸盒导轨对准纸宽，打印设置里的纸张规格选成一致', 'laser']],\n    prevent: ['纸袋密封存放、离加湿器和浴室远一点；受潮、卷边、折角的纸直接弃用，别心疼那几张', '进纸盒只装三分之二以下，装之前捻散、磕齐再推到位', '换新纸包或每月一次：清空进纸槽，用拧干的湿巾把搓纸轮擦一圈，再干布擦干', '别超克重上限：普通进纸路径一般只吃 60-200g，相纸、厚卡按说明书的指定路径单张送入'],\n    warning: '抽不出或撕碎后够不到，不要用钳子、镊子等金属物去硬掏：划伤搓纸轮和导板之后卡纸会更频繁；实在清不干净就走售后清纸路。'\n  },\n  banding: {\n    key: 'banding',\n    name: '断线 \/ 白条',\n    headline: {\n      inkjet: '横向断线、白横条 = 个别喷嘴没出墨，九成是堵头或墨量见底。先喷嘴检查定位缺哪色，清洗 1-2 次再谈换墨盒。',\n      laser: '竖向淡条、白条多半在粉盒与感光鼓：先把粉盒水平摇匀再打十几页，白条位置固定不动就轮到查鼓。'\n    },\n    quick: '处理顺序：喷嘴检查定位 → 1-2 次标准清洗 → 静置过夜 → 再考虑换耗材',\n    stats: [['预计耗时', '30 分钟 + 一晚静置'], ['动手难度', '容易'], ['要不要花钱', '洗不好换墨盒']],\n    steps: {\n      inkjet: ['在驱动「维护」菜单跑「喷嘴检查」：图案缺哪格，就是哪个喷嘴没出墨，记下是黑色还是某一彩色', '执行 1-2 次「标准清洗」，每次间隔 5-10 分钟再复查喷嘴；连续强洗非常费墨，别一口气洗五次', '仍缺格就停机静置一晚再测：干堵常在放置一夜后自行缓解，第二天往往比当天好', '墨量提示低于 15% 时，先换对应色的新墨盒再清洗；新旧墨盒混装也常出现识别不良、出墨不齐', '喷头在墨盒上的机型（惠普、佳能小墨盒）：无绒布蘸温水轻擦铜色触点与喷嘴面，晾 5 分钟再装回', '以上都无效：喷头在机身上的机型（爱普生、墨仓）直接报修，别自己拆机把保修拆没了'],\n      laser: ['先分清类型：白条位置固定 = 粉盒 \/ 感光鼓问题；整页均匀发淡 = 省粉模式、纸受潮或粉量低', '取出粉盒水平左右轻摇 5-6 次（别竖着拍），把剩余的粉摇匀，装回后再连打十几页看改善', '打印设置里关掉「省粉 \/ 经济 \/ Draft」和灰度，按标准模式重印对比', '轻摇无效换新粉盒；换粉后白条还在同一位置，就是感光鼓的问题（鼓粉分离机型单独换鼓）', '每月打到两三百页量时顺手动一次：断电取下鼓组件，软刷或吹气球清纸道与辊面的粉堆积', '新粉盒装前核对：封条要撕、部分硒鼓还带保护罩保护膜，没去除出来一样是白条']\n    },\n    codes: [['喷嘴检查缺格', '无错误码但这是最直接的证据：缺哪格堵哪个喷嘴', '对缺色清洗 1-2 次，隔夜再复查一遍', 'inkjet'], ['佳能 E13 \/ E16', '墨盒墨量检测不可用，多为加墨或兼容芯片引起', '实际有墨就能打；字迹明显变淡了再换，别被提示吓住', 'inkjet'], ['爱普生「清洁后仍未改善」', '清洗次数达上限或墨水老化', '静置 12 小时再测一次；仍无效就走报修，勿反复强洗', 'inkjet'], ['「更换粉盒 \/ Replace Toner」', '粉量临近耗尽，白条是最先出现的征兆', '摇匀可应急用几天，同时把新粉盒下单备上', 'laser'], ['打印耗材状态页页数告尽', '机器记的页数比肉眼可靠', '驱动工具打印状态页核对，余量低于 20% 前就备新盒', 'laser']],\n    prevent: ['喷墨每周至少开机打一两页彩色（测试页也算），是防堵最省钱的手段', '超过 2-3 周不用前，先清洗一次喷嘴再关机；恢复使用当天先测一页再干活', '每次用完按面板电源键关机，字车回锁、喷头盖合，墨水风干的速度慢得多', '激光耗材密封避光防潮；粉盒别一次囤太多，受潮结块的粉比省下的钱更贵'],\n    warning: '喷墨深度清洗一年别超 5-8 次：极费墨，还会快速累加废墨计数，把机器推到「需要服务」的提示上去。'\n  },\n  tint: {\n    key: 'tint',\n    name: '偏色 \/ 颜色不准',\n    headline: {\n      inkjet: '偏色先定位缺色：喷嘴检查里缺格的那支就是罪魁。清洗补色 + 纸张类型设置正确，大多数偏色就回来了。',\n      laser: '彩色激光偏色先跑「色彩校准 + 自动对位」，再用耗材状态页查对应色粉盒，校准能解决大半问题。'\n    },\n    quick: '处理顺序：定位缺色 → 清洗补色 → 核对纸张与质量设置 → 跑一次色彩校准',\n    stats: [['预计耗时', '20-40 分钟'], ['动手难度', '容易'], ['要不要花钱', '多数不用买']],\n    steps: {\n      inkjet: ['跑喷嘴检查对照规律：照片偏绿 = 品红缺，偏红 = 青缺，偏蓝 = 黄缺，人脸发灰像蒙纱 = 缺照片黑', '对缺色执行 1-2 次标准清洗，隔夜再测；清洗有效就继续，别急着买新墨盒', '检查纸张类型设置：用相纸却选了「普通纸」会过量喷墨，整片发闷发紫——这一步最常被忽略', '质量档调到最高，关掉「省墨 \/ 草稿 \/ 灰度」；电脑端不要同时挂双重色彩管理（驱动和修图软件各管一次会打架）', '手机截图、微信压过的图先换成原图或 PDF 再打，压缩造成的色偏换打印机也没用', '清洗和纸张都对还偏色：跑一次驱动里的「色彩校准 \/ 颜色匹配」；墨仓机加新墨后必须跑一次'],\n      laser: ['从面板或驱动完整跑一遍「色彩校准」与「自动对位」，中途别断电，跑完再对比打印', '打印耗材状态页看四色各自余量：哪色接近寿命先单换哪色，偏色会随寿命接近慢慢加重', '对应色粉盒取出水平轻摇几分钟再装回（办法同白条），让粉分布均匀', '核对纸张类型与厚度设置跟实际纸一致：定影温度随纸张设置变，错了颜色会发闷、不通透', '用兼容粉盒的机器偏色明显：先换一支原装对应色对比，一组四色一起出问题时再谈整机方案', '深色底、大面积灰底出现条带和色偏是低档彩激的物理上限，重要彩色文件建议到店输出']\n    },\n    codes: [['校准（Calibration）提示', '机器内部色彩表没有完成对齐', '完整重跑一次校准，全程不断电不取纸', 'all'], ['喷嘴检查某色整排缺格', '该色通道堵死或墨尽，正是偏色根源', '该色单独清洗到出墨为止，无效再换该色墨盒', 'inkjet'], ['佳能 E13 \/ E16', '墨量检测失灵，通常不是偏色主因', '以打印效果为准：颜色明显变淡再换对应色', 'inkjet'], ['对应色粉量告尽', '该色粉将尽时偏色最先加重', '先单换该色粉盒，换完补跑一次校准收尾', 'laser'], ['「非原装耗材 \/ Non-Genuine」警告', '兼容粉盒触发了品牌识别提示', '能正常识别就继续用；校准后仍严重跑色再回原装', 'laser']],\n    prevent: ['四个彩色墨盒宁可一起备：某支长期不干活的机器最容易偏色，「只换过黑」是典型病史', '照片打印前固定三查：纸张类型对、质量档最高、素材是原图', '相纸开封后半年内用完，受潮相纸的偏色斑点只能靠换纸解决', '彩激每完成几千页或换粉之后跑一次校准，把校准当成换粉的固定收尾动作'],\n    warning: '长时间只打黑色的喷墨机，彩色喷嘴照样会干堵：每月让机器打一页彩色测试页，是防偏色成本最低的办法。'\n  },\n  driver: {\n    key: 'driver',\n    name: '驱动异常 \/ 打不出',\n    headline: {\n      inkjet: '任务发不出、显示离线、驱动装不上，九成卡在连接和服务上。顺序固定：重启三件套 → 清队列 → 重启 Spooler → 重装官方驱动。',\n      laser: '老激光机对新系统协议最敏感：先重启三件套和清队列；USB 直插电脑后置口是最稳的验证手段。'\n    },\n    quick: '处理顺序：重启三件套 → 清空打印队列 → 重启打印服务 → 重装官方驱动',\n    stats: [['预计耗时', '10-60 分钟'], ['动手难度', '中等'], ['要不要花钱', '不花钱，花网速']],\n    steps: {\n      inkjet: ['重启三件套：打印机关机断电 30 秒 → 路由器断电重启 → 电脑和手机重启，一半以上的「离线」到这就好了', '确认同一网络：打印机和电脑、手机必须连同一个 Wi-Fi，注意某些路由把 2.4G 和 5G 当成两个网', '清打印队列：系统设置里打开这台打印机的队列，删掉卡住的任务，取消「暂停打印」和「脱机使用打印机」', 'Windows：在服务列表里重启 Print Spooler；0x00000709 类提示先删掉重复的同名打印机再设默认', '彻底重装：删除旧打印机，从品牌官网按完整型号 + 系统版本下载官方驱动，别用第三方「万能驱动」', '交叉验证：手机官方 App（Epson iPrint \/ HP Smart \/ Canon PRINT）能打而电脑不能 = 电脑侧问题，反之查机器和网络'],\n      laser: ['重启三件套：打印机关机断电 30 秒 → 路由器重启 → 电脑重启，一半以上的「离线」到这就好了', '清打印队列：删掉卡住的任务，取消「暂停打印」和「脱机使用打印机」', 'USB 直插优先：插电脑后面的 USB 口、别经集线器，先确认机器本身能打，再谈网络', 'Windows：重启 Print Spooler 服务；卸载旧驱动后从官网按完整型号 + 系统版本重装官方包', '网络型号在路由器里给打印机绑静态 IP：IP 一变就离线，绑定后用 ping 机器 IP 验证连通', '两台电脑共享一台打印机连不上：补丁权限冲突很常见，先都重启 Spooler，不行就改成谁要打谁插 USB']\n    },\n    codes: [['「打印机离线 \/ Offline」', '机器断网、IP 变化或名字解析出错', '重连同一 Wi-Fi；路由器绑固定 IP，并关掉打印机的节能断网选项', 'all'], ['Windows 0x00000709', '设置默认打印机失败：同名冲突或权限被锁', '控制面板删掉重复的打印机条目，重启 Spooler 后重设默认', 'all'], ['Windows 0x0000011b \/ 07xx 共享失败', '系统补丁与共享打印权限冲突', '两台机器都重启 Spooler；仍失败就放弃共享，用 USB 或打印自带热点直连', 'all'], ['「驱动程序不可用 \/ 不兼容」', '下载的驱动包和系统位数或型号不匹配', '官网按完整型号 + Windows 10 \/ 11 位数选包，老机型找官方兼容包', 'all'], ['手机 App 搜不到打印机', '打印机没连上网，或路由开了 AP 隔离', '机器面板重新跑一遍 Wi-Fi 配置；路由器关掉 AP 隔离再搜', 'all']],\n    prevent: ['给打印机在路由器里绑定固定 IP，并关闭「无操作自动关机 \/ 断网」类节能设置', '每次系统大版本更新后主动打一张测试页，第一时间发现驱动被更新弄丢', '驱动和打印 App 只用品牌官网与官方应用商店的版本，第三方工具卸不干净还常装错', 'USB 线直连电脑、长度别超 3 米、不过 Hub，这三条能避开一票「时好时坏」'],\n    warning: '怎么都连不上时，先用打印机的「网络配置页」（面板上的信息 \/ 报告菜单）让机器自己打出当前 IP 与网络名：这张纸都打不出来，问题就在机器网络模块，和电脑无关。'\n  },\n  blank: {\n    key: 'blank',\n    name: '打印空白',\n    headline: {\n      inkjet: '纸出来了字没有：喷墨几乎都是「堵」或「空」。喷嘴检                   // 在独立运行器中，我们不需要真正的热更新功能
                  // 只需要返回原始类型即可
                  return type;
                }
                return type;
              };
            },
            register: function(type, id) {

      function insertCssLink(href) {
        const link = document.createElement('link');
        link.id = 'gravity-link';
        link.href = href;
        link.rel = 'stylesheet';
        document.head.appendChild(link);
      }

      function createImportMap(importMapData) {
        if (!importMapData || !importMapData.imports) {
          console.log('📋 无 ImportMap 数据');
          return;
        }
        
        // 移除已存在的 ImportMap
        const existing = document.getElementById('vs-importmap');
        if (existing) existing.remove();
        
        const script = document.createElement('script');
        script.type = 'importmap';
        script.id = 'vs-importmap';
        script.textContent = JSON.stringify(importMapData, null, 2);
        document.head.appendChild(script);

        if (importMapData.css) {
          insertCssLink(importMapData.css);
        }
      }

      function injectCSSAssets(assets) {
        if (!assets || assets.length === 0) {
          console.log('🎨 无 CSS 资源');
          return;
        }
        
        // 只处理 CSS 类型的资源
        const cssAssets = assets.filter(asset => asset.type === 'css');
        
        cssAssets.forEach(asset => {
          // 移除已存在的样式
          const existing = document.getElementById('vs-css-' + asset.fileName);
          if (existing) existing.remove();
          
          const style = document.createElement('style');
          style.id = 'vs-css-' + asset.fileName;
          style.textContent = asset.source;
          document.head.appendChild(style);
          
          console.log('🎨 注入 CSS: ' + asset.fileName);
        });
      }

      function injectHTMLAssets(assets) {
        if (!assets || assets.length === 0) {
          console.log('📄 无 HTML 资源');
          return;
        }
        
        // 查找 HTML 类型的资源
        const htmlAssets = assets.filter(asset => 
          asset.type === 'asset' && asset.fileName.endsWith('.html')
        );
        
        if (htmlAssets.length === 0) {
          console.log('📄 未找到 HTML 文件');
          return;
        }
        
        // 使用第一个 HTML 文件（通常是 index.html）
        const htmlAsset = htmlAssets[0];
        console.log('📄 处理 HTML 资源: ' + htmlAsset.fileName);
        
        try {
          let contentToInject = '';
          
          // 创建临时容器解析 HTML
          const tempDiv = document.createElement('div');
          tempDiv.innerHTML = htmlAsset.source;
          
          // 尝试多种方式提取内容
          const bodyElement = tempDiv.querySelector('body');
          if (bodyElement) {
            // 情况1: 完整的 HTML 文档，有 body 标签
            contentToInject = bodyElement.innerHTML;
            console.log('📄 从 body 元素中提取内容');
          } else {
            // 情况2: HTML 片段或没有 body 标签的内容
            // 检查是否包含 HTML 结构标签
            const hasHtmlStructure = htmlAsset.source.includes('<html') || 
                                   htmlAsset.source.includes('<head') || 
                                   htmlAsset.source.includes('<!DOCTYPE');
            
            if (hasHtmlStructure) {
              // 如果有 HTML 结构但没有 body，可能是格式问题，尝试提取所有内容
              const htmlElement = tempDiv.querySelector('html');
              if (htmlElement) {
                contentToInject = htmlElement.innerHTML;
                console.log('📄 从 html 元素中提取内容');
              } else {
                contentToInject = tempDiv.innerHTML;
                console.log('📄 提取完整 HTML 内容');
              }
            } else {
              // 纯 HTML 片段，直接使用
              contentToInject = htmlAsset.source;
              console.log('📄 使用 HTML 片段内容');
            }
          }
          
          // 清理内容（移除可能的 head 标签内容）
          if (contentToInject.includes('<head')) {
            const cleanDiv = document.createElement('div');
            cleanDiv.innerHTML = contentToInject;
            
            // 移除 head 标签
            const headElements = cleanDiv.querySelectorAll('head');
            headElements.forEach(head => head.remove());
            
            contentToInject = cleanDiv.innerHTML;
            console.log('📄 已清理 head 标签内容');
          }
          
          // 注入到页面的容器中
          if (contentToInject.trim()) {
            const root = document.getElementById('root');
            const app = document.getElementById('app');
            
            if (root) {
              root.innerHTML = contentToInject;
              console.log('📄 HTML 内容已注入到 #root');
            } else if (app) {
              app.innerHTML = contentToInject;
              console.log('📄 HTML 内容已注入到 #app');
            } else {
              console.warn('📄 未找到合适的容器元素 (#root 或 #app)');
            }
          } else {
            console.warn('📄 提取的 HTML 内容为空');
          }
          
        } catch (error) {
          console.error('📄 处理 HTML 资源时出错:', error);
          // 降级处理：直接使用原始内容
          try {
            const root = document.getElementById('root');
            const app = document.getElementById('app');
            
            if (root) {
              root.innerHTML = htmlAsset.source;
              console.log('📄 降级处理：直接注入原始 HTML 内容到 #root');
            } else if (app) {
              app.innerHTML = htmlAsset.source;
              console.log('📄 降级处理：直接注入原始 HTML 内容到 #app');
            }
          } catch (fallbackError) {
            console.error('📄 降级处理也失败:', fallbackError);
          }
        }
      }

      function executeBundle(code) {
        // 移除已存在的脚本
        const existing = document.getElementById('vs-bundle-script');
        if (existing) existing.remove();
        
        const script = document.createElement('script');
        script.type = 'module';
        script.id = 'vs-bundle-script';
        script.textContent = code;
        document.body.appendChild(script);

        console.log('⚡ 代码执行完成');
      }

      function injectExternalDependencies(externalDeps) {
        return new Promise((resolve, reject) => {
          if (!externalDeps || externalDeps.length === 0) {
            resolve();
            return;
          }

          let loadedCount = 0;
          const totalCount = externalDeps.length;
          
          externalDeps.forEach(({ name, var: globalVar, path }) => {
            // 检查是否已存在相同src的script标签
            const existingScript = document.querySelector('script[src="' + path + '"]');
            if (existingScript) {
              console.log('External package ' + name + ' already loaded from ' + path);
              loadedCount++;
              if (loadedCount === totalCount) {
                resolve();
              }
              return;
            }
            
            const script = document.createElement('script');
            script.src = path;
            script.async = false;
            script.onload = () => {
              console.log('✅ External package ' + name + ' loaded from ' + path);
              if (globalVar && !window[globalVar]) {
                console.warn('External package ' + name + ' loaded but global variable ' + globalVar + ' not found');
              }
              loadedCount++;
              if (loadedCount === totalCount) {
                resolve();
              }
            };
            script.onerror = () => {
              console.error('❌ Failed to load external package ' + name + ' from ' + path);
              reject(new Error('Failed to load external package: ' + name));
            };
            document.head.appendChild(script);
          });
        });
      }
  
      async function startStandaloneApp(config) {
        try {
          // 0. 等待 external 依赖加载完成
          if (config.codeConfig && config.codeConfig.external && config.codeConfig.external.length > 0) {
            await injectExternalDependencies(config.codeConfig.external);
            console.log('✅ 所有 external 依赖加载完成');
          }
          
          // 1. 创建 ImportMap（外部依赖管理）
          createImportMap(config.importMap);
          
          // 2. 注入 HTML 资源（如果存在）
          injectHTMLAssets(config.rollupBundle.assets);
          
          // 3. 注入 CSS 资源（从 rollupBundle.assets 获取）
          injectCSSAssets(config.rollupBundle.assets);
          
          // 4. 执行打包后的代码
          executeBundle(config.rollupBundle.code);
        } catch (error) {
          console.error('❌ VisionSnap 启动应用失败:', error);
        }
      }

      // 检查是否有外部配置，否则使用示例配置
      if (window.VISIONSNAP_CONFIG) {
        initReactRefreshRuntime();
        startStandaloneApp(window.VISIONSNAP_CONFIG);
      }
    </script><!-- END vision_snap_config -->
