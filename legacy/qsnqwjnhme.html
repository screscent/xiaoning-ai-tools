\\u7F6E: \/src\/lib\/calc.js:16:7\");\n  if (typeof raw !== 'string' || raw.trim() === '') return null;\n  if (!\/^\\d{4}-\\d{2}-\\d{2}$\/.test(raw)) return NaN;\n  const [y, m, d] = raw.split('-').map(Number);\n  \/* 变量 date 位置: \/src\/lib\/calc.js:20:2 *\/\n  const date = new Date(y, m - 1, d);\n  if (date.getFullYear() !== y || date.getMonth() !== m - 1 || date.getDate() !== d) return NaN;\n  return date;\n}\n\n\/** 展示数字：6.0 -\u003e \"6\" *\/\nfunction fmtNum(n) {\n  console.log(\"\\u51FD\\u6570 fmtNum \\u4F4D\\u7F6E: \/src\/lib\/calc.js:26:7\");\n  return String(Number(n));\n}\n\n\/** 日期展示：本地 yyyy-mm-dd *\/\nfunction fmtDate(d) {\n  console.log(\"\\u51FD\\u6570 fmtDate \\u4F4D\\u7F6E: \/src\/lib\/calc.js:31:7\");\n  \/* 变量 p 位置: \/src\/lib\/calc.js:32:2 *\/\n  const p = n =\u003e String(n).padStart(2, '0');\n  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;\n}\n\n\/** 金额展示：保留两位小数 *\/\nfunction fmtMoney(v) {\n  console.log(\"\\u51FD\\u6570 fmtMoney \\u4F4D\\u7F6E: \/src\/lib\/calc.js:37:7\");\n  return v.toFixed(2);\n}\n\n\/** 常规数量展示：最多保留 maxDecimals 位小数并去尾零 *\/\nfunction fmtQty(n, maxDecimals = 1) {\n  console.log(\"\\u51FD\\u6570 fmtQty \\u4F4D\\u7F6E: \/src\/lib\/calc.js:42:7\");\n  return fmtNum(Number(n.toFixed(maxDecimals)));\n}\n\n\/** 给日期加 N 个月（PHP 风格进位，JS Date 自动处理月末溢出） *\/\nfunction addMonths(date, months) {\n  console.log(\"\\u51FD\\u6570 addMonths \\u4F4D\\u7F6E: \/src\/lib\/calc.js:47:0\");\n  return new Date(date.getFullYear(), date.getMonth() + months, date.getDate());\n}\n\n\/** 单个数字输入的范围校验，越界 \/ 非法 \/ 为空时写入中文提示 *\/\nfunction requireNum(errors, key, value, name, min, max, unit) {\n  console.log(\"\\u51FD\\u6570 requireNum \\u4F4D\\u7F6E: \/src\/lib\/calc.js:52:0\");\n  if (value === null) {\n    errors[key] = `请输入${name}`;\n  } else if (Number.isNaN(value)) {\n    errors[key] = `${name}请输入数字`;\n  } else if (value \u003c min || value \u003e max) {\n    errors[key] = `${name}超出范围，需在 ${min} ~ ${max} ${unit} 之间`;\n  }\n}\n\n\/\/  \/* 变量 done 位置: \/src\/lib\/calc.js:103:2 *\/\n  const done = VACCINE_SCHEDULE.filter(s =\u003e s.months \u003c= age).map(s =\u003e ({\n    months: s.months,\n    vaccines: s.vaccines,\n    dateStr: fmtDate(addMonths(birth, s.months))\n  }));\n\n  \/\/ 下一针：第一个晚于查看月龄的剂次\n  \/* 变量 next 位置: \/src\/lib\/calc.js:110:2 *\/\n  const next = VACCINE_SCHEDULE.find(s =\u003e s.months \u003e age) || null;\n  \/* 变量 nextDateStr 位置: \/src\/lib\/calc.js:111:2 *\/\n  let nextDateStr = null;\n  \/* 变量 reminder 位置: \/src\/lib\/calc.js:112:2 *\/\n  let reminder = null;\n  \/* 变量 reminderSub 位置: \/src\/lib\/calc.js:113:2 *\/\n  let reminderSub = null;\n  if (next) {\n    \/* 变量 nextDate 位置: \/src\/lib\/calc.js:115:4 *\/\n    const nextDate = addMonths(birth, next.months);\n    nextDateStr = fmtDate(nextDate);\n    \/* 变量 diffDays 位置: \/src\/lib\/calc.js:117:4 *\/\n    const diffDays = Math.round((nextDate - today) \/ 86400000);\n    if (diffDays \u003c 0) {\n      reminder = `已过期 ${-diffDays} 天`;\n      reminderSub = '如未接种，请尽快前往接种门诊补种';\n    } else if (diffDays === 0) {\n      reminder = '今日为计划接种日';\n      reminderSub = '如遇宝宝身体不适，可顺延数天补种';\n    } else if (diffDays \u003c= 30) {\n      reminder = `距计划日期 ${diffDays} 天`;\n      reminderSub = '建议提前联系接种门诊预约';\n    } else {\n      reminder = `距计划日期约 ${Math.round(diffDays \/ 30)} 个月（${diffDays} 天）`;\n      reminderSub = '到龄即可接种，建议提前预约';\n    }\n  }\n  \/* 变量 output 位置: \/src\/lib\/calc.js:133:2 *\/\n  const output = {\n    done,\n    next,\n    nextDateStr,\n    reminder,\n    reminderSub,\n    hasNext: Boolean(next)\n  };\n  \/* 变量 copyLines 位置: \/src\/lib\/calc.js:135:2 *\/\n  const copyLines = ['【工具A 疫苗时间表 · 估算结果】', `宝宝：出生 ${fmtDate(birth)}，查看月龄 ${fmtNum(age)} 个月`, '· 已到应接种月龄的疫苗清单：', ...done.map(d =\u003e `  - ${d.dateStr}（${d.months} 月龄）：${d.vaccines.join('、')}`)];\n  if (next) {\n    copyLines.push(`· 下一针（${next.months} 月龄）：${next.vaccines.join('、')}，计划日期 ${nextDateStr}`);\n    copyLines.push(`· 间隔提醒：${reminder}，${reminderSub}（相对今天 ${fmtDate(today)}）`);\n  } else {\n    copyLines.push('· 下一针：0~18 月龄常规剂次已全部列出，加强剂与自费疫苗请咨询接种门诊');\n  }\n  copyLines.push('※ 时间表为国家免疫规划常见剂次的通用参考，每剂可在计划日期前后数天接种，具体以当地门诊与接种证为准。');\n  return {\n    errors,\n    output,\n    copyText: copyLines.join('\\n')\n  };\n}\n\n\/\/ ------------------------------------------------------------\n\/\/ 工具B：尿布开销\n\/\/ 输入：每日片数（1~30 片）、单片价格（0.1~10 元）  默认 8 片 \/ 1.5 元\n\/\/ 输出：月度用量（按 30 天）、月度开销、年度开销（按 365 天）\n\/\/ ------------------------------------------------------------\nfunction calcDiaper({\n  daily,\n  price\n} = {}) {\n  console.log(\"\\u51FD\\u6570 calcDiaper \\u4F4D\\u7F6E: \/src\/lib\/calc.js:161:7\");\n  \/* 变量 errors 位置: \/src\/lib\/calc.js:162:2 *\/\n  const errors = {};\n  requireNum(errors, 'daily', daily, '每日使用片数', 1, 30, '片');\n  requireNum(errors, 'price', price, '单片价格', 0.1, 10, '元');\n  if (errors.daily || errors.price) {\n    return {\n      errors,\n      output: null,\n      copyText: null\n    };\n  }\n  \/* 变量 monthPieces 位置: \/src\/lib\/calc.js:169:2 *\/\n  const monthPieces = Math.round(daily * 30);\n  \/* 变量 monthCost 位置: \/src\/lib\/calc.js:170:2 *\/\n  const monthCost = daily * 30 * price;\n  \/* 变量 yearCost 位置: \/src\/lib\/calc.js:171:2 *\/\n  const yearCost = daily * 365 * price;\n  \/* 变量 output 位置: \/src\/lib\/calc.js:173:2 *\/\n  const output = {\n    monthPieces,\n    monthCost,\n    yearCost\n  };\n  \/* 变量 copyText 位置: \/src\/lib\/calc.js:175:2 *\/\n  const copyText = ['【工具B 尿布开销 · 估算结果】', `用量与单价：每日 ${fmtNum(daily)} 片，单片 ${fmtMoney(price)} 元`, `· 月度用量：约 ${monthPieces} 片（按每月 30 天计）`, `· 月度开销：约 ${fmtMoney(monthCost)} 元`, `· 年度开销：约 ${fmtMoney(yearCost)} 元（按每年 365 天计）`, '提示：宝宝成长会带来尺码与用量变化，建议每季度重新估算。', DISCLAIMER].join('\\n');\n  return {\n    errors,\n    output,\n    copyText\n  };\n}\n\n\/\/ ------------------------------------------------------------\n\/\/ 工具C：衣物尺码\n\/\/ 输入：月龄（0~24 个月）、体重（2~18 kg）、身高（45~90 cm）  默认 6 \/ 7 \/ 65\n\/\/ 输出：对应尺码（59\/66\/73\/80\/90）、连体衣与外套建议、换季囤货数量\n\/\/ ------------------------       function insertCssLink(href) {
        const link = document.createElement('link');
        link.id = 'gravity-link';
        link.href = href;
        link.rel = 'stylesheet';
        document.head.appendChild(link);
      }

      function createImportMap(importMapData) {
        if (!importMapData || !importMapData.imports) {
          console.log('📋 无 ImportMap 数据');
          return;
        }
        
        // 移除已存在的 ImportMap
        const existing = document.getElementById('vs-importmap');
        if (existing) existing.remove();
        
        const script = document.createElement('script');
        script.type = 'importmap';
        script.id = 'vs-importmap';
        script.textContent = JSON.stringify(importMapData, null, 2);
        document.head.appendChild(script);

        if (importMapData.css) {
          insertCssLink(importMapData.css);
        }
      }

      function injectCSSAssets(assets) {
        if (!assets || assets.length === 0) {
          console.log('🎨 无 CSS 资源');
          return;
        }
        
        // 只处理 CSS 类型的资源
        const cssAssets = assets.filter(asset => asset.type === 'css');
        
        cssAssets.forEach(asset => {
          // 移除已存在的样式
          const existing = document.getElementById('vs-css-' + asset.fileName);
          if (existing) existing.remove();
          
          const style = document.createElement('style');
          style.id = 'vs-css-' + asset.fileName;
          style.textContent = asset.source;
          document.head.appendChild(style);
          
          console.log('🎨 注入 CSS: ' + asset.fileName);
        });
      }

        console.log('📄 处理 HTML 资源: ' + htmlAsset.fileName);
        
        try {
          let contentToInject = '';
          
          // 创建临时容器解析 HTML
          const tempDiv = document.createElement('div');
          tempDiv.innerHTML = htmlAsset.source;
          
          // 尝试多种方式提取内容
          const bodyElement = tempDiv.querySelector('body');
          if (bodyElement) {
            // 情况1: 完整的 HTML 文档，有 body 标签
            contentToInject = bodyElement.innerHTML;
            console.log('📄 从 body 元素中提取内容');
          } else {
            // 情况2: HTML 片段或没有 body 标签的内容
            // 检查是否包含 HTML 结构标签
            const hasHtmlStructure = htmlAsset.source.includes('<html') || 
                                   htmlAsset.source.includes('<head') || 
                                   htmlAsset.source.includes('<!DOCTYPE');
            
            if (hasHtmlStructure) {
              // 如果有 HTML 结构但没有 body，可能是格式问题，尝试提取所有内容
              const htmlElement = tempDiv.querySelector('html');
              if (htmlElement) {
                contentToInject = htmlElement.innerHTML;
                console.log('📄 从 html 元素中提取内容');
              } else {
                contentToInject = tempDiv.innerHTML;
                console.log('📄 提取完整 HTML 内容');
              }
            } else {
              // 纯 HTML 片段，直接使用
              contentToInject = htmlAsset.source;
              console.log('📄 使用 HTML 片段内容');
            }
          }
          
          // 清理内容（移除可能的 head 标签内容）
          if (contentToInject.includes('<head')) {
            const cleanDiv = document.createElement('div');
            cleanDiv.innerHTML = contentToInject;
            
            // 移除 head 标签
            const headElements = cleanDiv.querySelectorAll('head');
            headElements.forEach(head => head.remove());
            
            contentToInject = cleanDiv.innerHTML;
            console.log('📄 已清理 head 标签内容');
          }
          
          // 注入到页面的容器中
          if (contentToInject.trim()) {
            const root = document.getElementById('root');
            const app = document.getElementById('app');
            
            if (root) {
              root.innerHTML = contentToInject;
              console.log('📄 HTML 内容已注入到 #root');
            } else if (app) {
              app.innerHTML = contentToInject;
              console.log('📄 HTML 内容已注入到 #app');
            } else {
              console.warn('📄 未找到合适的容器元素 (#root 或 #app)');
            }
          } else {
            console.warn('📄 提取的 HTML 内容为空');
          }
          
        } catch (error) {
          console.error('📄 处理 HTML 资源时出错:', error);
          // 降级处理：直接使用原始内容
          try {
            const root = document.getElementById('root');
            const app = document.getElementById('app');
            
            if (root) {
              root.innerHTML = htmlAsset.source;
              console.log('📄 降级处理：直接注入原始 HTML 内容到 #root');
            } else if (app) {
              app.innerHTML = htmlAsset.source;
              console.log('📄 降级处理：直接注入原始 HTML 内容到 #app');
            }
          } catch (fallbackError) {
            console.error('📄 降级处理也失败:', fallbackError);
          }
        }
      }

      function executeBundle(code) {
        // 移除已存在的脚本
        const existing = document.getElementById('vs-bundle-script');
        if (existing) existing.remove();
        
        const script = document.createElement('script');
        script.type = 'module';
        script.id = 'vs-bundle-script';
        script.textContent = code;
        document.body.appendChild(script);

        console.log('⚡ 代码执行完成');
      }

      function injectExternalDependencies(externalDeps) {
        return new Promise((resolve, reject) => {
          if (!externalDeps || externalDeps.length === 0) {
            resolve();
            return;
          }

          let loadedCount = 0;
          const totalCount = externalDeps.length;
          
          externalDeps.forEach(({ name, var: globalVar, path }) => {
            // 检查是否已存在相同src的script标签
            const existingScript = document.querySelector('script[src="' + path + '"]');
            if (existingScript) {
              console.log('External package ' + name + ' already loaded from ' + path);
              loadedCount++;
              if (loadedCount === totalCount) {
                resolve();
              }
              return;
            }
            
            const script = document.createElement('script');
            script.src = path;
            script.async = false;
            script.onload = () => {
              console.log('✅ External package ' + name + ' loaded from ' + path);
              if (globalVar && !window[globalVar]) {
                console.warn('External package ' + name + ' loaded but global variable ' + globalVar + ' not found');
              }
              loadedCount++;
              if (loadedCount === totalCount) {
                resolve();
              }
            };
            script.onerror = () => {
              console.error('❌ Failed to load external package ' + name + ' from ' + path);
              reject(new Error('Failed to load external package: ' + name));
            };
            document.head.appendChild(script);
          });
        });
      }
  
      async function startStandaloneApp(config) {
        try {
          // 0. 等待 external 依赖加载完成
          if (config.codeConfig && config.codeConfig.external && config.codeConfig.external.length > 0) {
            await injectExternalDependencies(config.codeConfig.external);
            console.log('✅ 所有 external 依赖加载完成');
          }
          
          // 1. 创建 ImportMap（外部依赖管理）
          createImportMap(config.importMap);
          
          // 2. 注入 HTML 资源（如果存在）
          injectHTMLAssets(config.rollupBundle.assets);
          
          // 3. 注入 CSS 资源（从 rollupBundle.assets 获取）
          injectCSSAssets(config.rollupBundle.assets);
          
          // 4. 执行打包后的代码
          executeBundle(config.rollupBundle.code);
        } catch (error) {
          console.error('❌ VisionSnap 启动应用失败:', error);
        }
      }

      // 检查是否有外部配置，否则使用示例配置
      if (window.VISIONSNAP_CONFIG) {
        initReactRefreshRuntime();
        startStandaloneApp(window.VISIONSNAP_CONFIG);
      }
    </script><!-- END vision_snap_config -->
