 [{\n      name: '泥炭或椰糠',\n      ratio: '50%'\n    }, {\n      name: '珍珠岩',\n      ratio: '20%'\n    }, {\n      name: '松树皮 \/ 松鳞',\n      ratio: '20%'\n    }, {\n      name: '腐叶土',\n      ratio: '10%'\n    }],\n    extra: '喜酸的植物（栀子、茶花）可加少量硫磺粉或酸性泥炭。',\n    when: '春季 4–5 月换盆，1–2 年一次；根从底孔钻出、浇水后水秒流干、或土面结板发白时换。',\n    pot: '盆径比原盆大 2–3cm，选带排水孔的深盆，盆底铺陶粒做排水层。',\n    warn: '新盆别一步大两号，容易积水闷根。'\n  },\n  flower: {\n    mix: [{\n      name: '园土或泥炭',\n      ratio: '40%'\n    }, {\n      name: '腐叶土',\n      ratio: '30%'\n    }, {\n      name: '珍珠岩',\n      ratio: '20%'\n    }, {\n      name: '腐熟有机肥 \/ 骨粉',\n      ratio: '10%'\n    }],\n    extra: '月季可用 5 份园土 + 3 份腐叶土 + 2 份粗砂；底肥埋在盆底不接触根。',\n    when: '早春花前或花后换盆，1 年一次；花期不动根，换盆同时修剪老根与枯枝。',\n    pot: '盆径比原盆大 2cm 左右，深盆更稳；忌讳一步换到大盆导致积水烂根。',\n    warn: '开花期只补肥不换盆，换盆后遮阴 3 天。'\n  },\n  fern: {\n    mix: [{\n      name: '泥炭 \/ 椰糠',\n      ratio: '60%'\n    }, {\n      name: '珍珠岩或蛭石',\n      ratio: '20%'\n    }, {\n      name: '腐叶土',\n      ratio: '15%'\n    }, {\n      name: '木炭粒',\n      ratio: '5%'\n    }],\n    extra: '以保水为主，忌用粗颗粒过多的干爽配方。',\n    when: '春季换盆，每年一次；根系密集缠成一团、土面被根顶起时换。',\n    pot: '盆径比原盆大 1–2cm，浅盆或矮胖盆，塑料盆比陶盆更保水。',\n    warn: '换盆后放阴凉处缓苗一周，全程保持土壤微湿。'\n  },\n  orchid: {\n    mix: [{\n      name: '松树皮',\n      ratio: '70%'\n    }, {\n      name: '水苔',\n      ratio: '20%'\n    }, {\n      name: '木炭 \/ 火山石',\n      ratio: '10%'\n    }],\n    extra: '水苔也可单用，但一年左右会酸化板结，必须换新。',\n    when: '花后或根系发黑腐烂时换，1–2 年一次；水苔每年换一次，避开开花期。',\n    pot: '用透明塑料营养钵，只比原盆大 1cm，宁小勿大；气生根露在外面不要埋。',\n    warn: '换盆后 1 周不浇水，只喷雾保湿，等新根尖冒出再正常浇。'\n  },\n  herb: {\n    mix: [{\n      name: '泥炭 \/ 椰糠',\n      ratio: '40%'\n    }, {\n      name: '园土',\n      ratio: '30%'\n    }, {\n      name: '珍珠岩',\n      ratio: '20%'\n    }, {\n      name: '蚯蚓粪 \/ 堆肥',\n      ratio: '10%'\n    }],\n    extra: '香草耐贫瘠，肥多了反而香味变淡、容易徒长。',\n    when: '春季或苗高 15cm 时上盆，每年换一次；根系从底孔冒出、浇水后很快干时换。',\n    pot: '盆径比原盆大 2–3cm，盆深 20cm 以上更利于扎根，必须有排水孔。',\n    warn: '薄荷建议单独种，根系侵略性强会挤占其他植物。'\n  }\n};\nconst PESTS = [{\n  id: 'yellow',\n  label: '黄叶'\n}, {\n  id: 'rot',\n  label: '烂根'\n}, {\n  id: 'aphid',\n  label: '蚜虫'\n}, {\n  id: 'scale',\n  label: '介壳虫'\n}, {\n  id: 'leggy',\n  label: '徒长'\n}];\nconst PEST_MAP = {\n  yellow: {\n    sign: '叶片整体或局部发黄、发软、脱落，新老叶表现不同。',\n    steps: ['看位置：下部老叶黄多为自然代谢或缺氮；新叶黄多为缺铁、浇水过多。', '摸土：湿黏发臭 = 水多闷根；干硬起壳 = 缺水或板结。', '看光照与通风：长期阴暗、闷不通风也会整片发黄。', '翻叶背：检查有无虫体、黏蜜露、蛛网，先排除虫害。'],\n    fixes: ['水多闷根：停水通风，必要时脱盆晾根、换透气土并换小一号盆。', '缺水板结：整盆浸水 20 分钟浸透，或用筷子在土里打孔再浇。', '缺铁新叶黄：用螯合铁兑水灌根，2 周一次，连用 2 次。', '自然代谢的黄叶直接剪掉，别长期留在盆土上。']\n  },\n  rot: {\n    sign: '茎基部发软发黑、叶片化水、盆土有酸臭味。',\n    steps: ['闻土：正常是土腥味，明显酸臭基本就是烂根。', '按茎基：按下去发软、渗水，说明已经烂到茎。', '脱盆看根：白色硬实为健康根，褐软空心一拉就断是烂根。', '复盘浇水频率与盆径：大盆小苗、托盘积水是两大主因。'],\n    fixes: ['剪除所有烂根与腐烂茎段，只留白色健康组织。', '多菌灵或高锰酸钾稀释液浸泡 10 分钟，阴凉处晾 1–2 天。', '换新透气土 + 小一号盆，旧土不要再用。', '上盆后 5–7 天不浇水，缓苗后少量给水，逐步恢复正常。']\n  },\n  aphid: {\n    sign: '新梢、花苞、叶背密集小绿虫或黑虫，叶面有黏液，蚂蚁频繁爬动。',\n    steps: ['重点看新梢、花苞与嫩叶背面，蚜虫喜欢在嫩尖扎堆。', '摸叶面是否黏手，黏蜜露常伴随煤污或蚂蚁。', '翻看附近其他盆，蚜虫扩散快，要一起检查。', '确认虫体为软体、手一捏即破（硬壳则是介壳虫）。'],\n    fixes: ['先用较急水流冲掉大部分虫体，冲时斜放花盆避免灌土。', '肥皂水（1L 水 + 5ml 洗洁精）喷叶背与嫩尖，隔天一次连用 3 次。', '虫量大用吡虫啉等按说明书兑水喷施，重点喷叶背。', '立刻隔离该盆，虫害控制后再放回原位。']\n  },\n  scale: {\n    sign: '叶背、茎节出现褐色小凸起，手抠有硬壳，周围有黏蜜露和黑色煤污。',\n    steps: ['沿叶背主脉和茎节找凸起点，白色棉絮状为粉蚧，褐色硬壳为盾蚧。', '用指甲抠：抠得动、有硬壳感即可判定介壳虫。', '看叶片是否发亮黏手、有黑色霉层，这是蜜露引发的煤污。', '检查所有隐蔽角落与新买植株，介壳虫极易传播。'],\n    fixes: ['75% 酒精棉签逐个擦拭，或牙刷蘸肥皂水刷掉虫体与虫卵。', '数量多用蚧必治、噻虫嗪按说明喷施，间隔 7 天连用 3 次。', '剪掉虫口密集的枝条，剪下的枝叶密封丢掉，不要丢回盆里。', '处理完放通风散光处，2 周内每周复查一次。']\n  },\n  leggy: {\n    sign: '节间明显变长、叶片变小变薄、植株朝光倾斜，多肉掉色拉长。',\n    steps: ['测光照：每天直射光不足 4 小时基本都会徒长。', '回看施肥：氮肥偏多、频繁薄肥的水浇，叶片大而薄、茎细长。', '看温差与夜温：夜间温度高、昼夜温差小也会拉长。', '看浇水频率：长期偏湿会加速徒长速度。'],\n    fixes: ['移到光照更足的位置，分批增加直射光，避免一次暴晒灼伤。', '控水控氮，暂停施肥 2–4 周，等新叶紧凑后再恢复薄肥。', '徒长枝剪下扦插，重新培育紧凑植株；多肉可砍头重发。', '每隔几天转盆 90°，减少单向倾斜。']\n  }\n};\nconst SEASONS = [{\n  id: 'spring',\n  label: '春季',\n  sub: '15–25℃ · 生长启动'\n}, {\n  id: 'summer',\n  label: '夏季',\n  sub: '高温 · 半休眠'\n}, {\n  id: 'autumn',\n  label: '秋季',\n  sub: '秋凉 · 二次生长'\n}, {\n  id: 'winter',\n  label: '冬季',\n  sub: '低温 · 停长'\n}];\nconst FERT = {\n  spring: {\n    freq: '生长期每 10–15 天一次薄肥；刚换盆或刚买回的植株缓苗 3–4 周后再开始。',\n    conc: '液肥在说明浓度基础上再稀释一半（如 1:1000 → 1:2000）；缓释肥 15cm 盆沿盆边撒 10–20 粒。',\n    fits: '观叶用氮为主的均衡肥；开花植物用高磷钾开花肥；多肉选低氮多肉专用肥。',\n    note: '换盆后 1 个月内不施肥，等新根冒出（新叶展开）再给第一餐。'\n  },\n  summer: {\n    freq: '持续高温（≥32℃）大半植物半休眠：停肥或拉长到 20–30 天一次；仍在疯长的品种照常给。',\n    conc: '浓度比春季再减半，宁淡勿浓；不往叶面喷肥，只灌根，避免高温烧叶。',\n    fits: '开花植物（月季 \/ 茉莉）花后补一次磷钾肥；观叶类给少量均衡肥维持。',\n    note: '施肥选傍晚或清晨，第二天补一次透水冲淡肥液，防止残留闷根。'\n  },\n  autumn: {\n    freq: '秋凉后恢复 10–15 天一次；多年生木本（月季 \/ 三角梅）在 9–10 月补 1–2 次磷钾肥促枝条成熟。',\n    conc: '浓度从夏季减半逐步回到正常（1:1000 左右），缓释肥可按正常量用。',\n    fits: '多肉秋型种恢复上肥；兰花停大肥，只给很稀的花芽肥。',\n    note: '入冬前 1 个月停氮肥，改磷钾为主（如磷酸二氢钾 1:1500），提高抗寒性。'\n  },\n  winter: {\n    freq: '室温低、植株停长的直接停肥；暖气房仍在生长的，20–30 天一次薄肥即可。',\n    conc: '浓度减半以上，或改用少量缓释肥；液肥要放至室温再灌，忌冰冷肥液浇温水根。',\n    fits: '冬季开花植物（长寿花 \/ 蟹爪兰 \/ 仙客来）花苞期每周一次极稀磷钾肥。',\n    note: '低于 10℃ 停肥是铁律——低温施肥十有九伤根，宁可让它饿着过冬。'\n  }\n};\nconst FERT_DAMAGE = {\n  sign: '施肥后几天内叶尖叶缘焦枯发褐、新叶畸形卷曲、土面出现白色盐霜，或有氨味，甚至集中落叶。',\n  steps: ['回忆最近一次施肥：浓度是否加倍、是否干土施肥（干土施肥最易烧根）、有无叶面喷肥。', '看盆土表面：白色结晶盐霜、板结返碱，多为肥液浓度过高或长期累积。', '摸根摸茎：轻则叶尖焦枯，重则根尖发褐发软，轻轻一拉就断。', '确认后立刻行动：肥害拖一天，根损一分。'],\n  fixes: ['立即停肥，用大量清水反复浇灌盆土冲淋盐分：浇透 3–5 遍并倒空托盘', '严重时换土抢救：脱盆冲根、剪掉发黑根须，换新土上盆，遮阴缓苗 2 周。', '叶面肥害用清水喷洗叶片两三遍，焦枯严重的叶子直接摘除。', '恢复期只浇水不施肥，2–4 周后从正常浓度的 1\/4 重新开始，逐步加回。']\n};\nconst LIGHT_PLANTS = [{\n  id: 'succulent',\n  label: '多肉',\n  sub: '徒长敏感 · 强光型'\n}, {\n  id: 'foliage',\n  label: '观叶',\n  sub: '耐阴为主 · 柔光型'\n}, {\n  id: 'flower',\n  label: '开花',\n  sub: '阳性为主 · 爆花型'\n}];\nconst LIGHT_ADVICE = {\n  succulent: {\n    label: '多肉',\n    range: '6–10 小时',\n    min: 6,\n    max: 10,\n    short: '徒长摊叶、褪色拉长，先把时长提到 6 小时起，灯距拉近到 20–30cm（注意通风别烤伤）。',\n    ok: '保持现状即可；连续阴雨天可再加 1–2 小时，配合 20–30cm 灯距。',\n    long: '超过 10 小时会打乱光周期、推迟休眠，上色反而变差，建议缩回 8–10 小时。',\n    hint: '多肉吃「光强」不吃时长，优先选 30W 以上的全光谱灯并拉近距离，时长 6–10 小时就够。'\n  },\n  foliage: {\n    label: '观叶',\n    range: '4–8 小时',\n    min: 4,\n    max: 8,\n    short: '叶色变淡、新叶变小、节间拉长，提到每天 6 小时左右，或将灯距缩至 30–40cm。',\n    ok: '长势与叶色稳定有光泽；竹芋、绿萝等耐阴品种还可再降亮度或减 1–2 小时。',\n    long: '敏感品种（竹芋 \/ 彩叶芋）容易卷叶焦边、甚至止长，缩到 6–8 小时或调低亮度。',\n    hint: '观叶要「柔光长时长」，灯距 30–40cm，避免灯贴着叶面近距离直照。'\n  },\n  flower: {\n    label: '开花',\n    range: '8–12 小时',\n    min: 8,\n    max: 12,\n    short: '花芽分化不足、开花变少，阳性花卉（月季 \/ 茉莉）每天至少补 8 小时起。',\n    ok: '利于持续花芽分化；花苞期稳定在该区间，配合磷钾肥效果更好。',\n    long: '长寿花、蟹爪兰等短日照花卉超过 12 小时反倒难开花，控制到 10–12 小时，并保证夜晚全黑。',\n    hint: '开花植物要「时长 + 强度」双达标，灯距 30–40cm；短日照花卉冬季要遮黑限时。'\n  }\n};\nconst LAMP_NOTE = 'LED 补光灯一般距植株 20–40cm，灯太近烤叶、太远补光无效；植物每天还需要 6–8 小时黑暗休眠，别全天空开灯。';\nconst VACATION_PLANTS = [{\n  id: 'drought',\n  label: '耐旱',\n  sub: '发财树 \/ 橡皮树 \/ 龟背竹'\n}, {\n  id: 'moist',\n  label: '喜湿',\n  sub: '绿萝 \/ 蕨类 \/ 竹芋'\n}, {\n  id: 'succulent',\n  label: '多肉',\n  sub: '多肉 \/ 仙人掌 \/ 十二卷'\n}];\nconst VACATION = {\n  drought: {\n    label: '耐旱',\n    before: ['出门 1–2 天前浇一次透水，到底孔出水为止，随后倒空托盘。', '把花盆挪离西晒窗台和空调出风口，改放明亮散射光处，减慢失水。', '表土铺 2cm 铺面（陶粒 \/ 椰壳块）保湿，顺手松一松板结的盆土。', '停肥并剪掉黄叶残花，降低出行期间的水分与养分消耗。'],\n    during: '短期出门不用额外补水；超过 7 天建议盆底垫浅水托盘（水位 1–2cm，不泡到排水孔）或接自吸水棉绳，维持微潮即可。',\n    back: ['回家先掂盆看湿度，土明显干透了才补第一次透水，别一进门就大浇。', '剪掉枯黄叶片，用清水喷雾洗叶去尘，放到通风散光处缓 2–3 天。', '确认缓过来以后恢复常规浇水，满 1 周再恢复正常施肥。'],\n    tip: '耐旱植物自我储备充足，宁可出门前一次浇透，也不要安排人天天浇水，越勤快越容易涝。',\n    tiers: {\n      short: '什么都不用装，出门前浇透一次即可扛住。',\n      mid: '接好自吸水棉绳或垫浅水托盘，并把盆挪到散射光处，双保险。',\n      long: '托盘蓄水只能撑一时，出门两周以上请务必安排人巡检补水一次。'\n    }\n  },\n  moist: {\n    label: '喜湿',\n    before: ['出门前一天浇透，并整盆浸水 10 分钟，让土芯彻底吸饱。', '挪到阴凉的明亮散射光处，避开风口与晒点，把蒸发降到最低。', '大盆套浅水托盘加水 1–2cm，或提前接好自吸水绳（水桶水位高于盆土 5cm 以上）。', '适当疏剪过密的大叶，再给叶面喷雾一次，减少蒸腾面积。'],\n    during: '喜湿植物最怕断水：托盘蓄水可维持 5–7 天；超过 7 天必须换大水桶自吸，或安排人工补水，托盘不能见底。',\n    back: ['回家先撤掉托盘蓄水与自吸水绳，通风晾土 1 天，再判断是否恢复见干见湿。', '把干枯焦尖直接剪掉，翻看盆底与茎基，确认没有长期泡水导致的闷根。', '恢复常规浇水节奏，缓 1 周后再考虑恢复施肥。'],\n    tip: '喜湿植物的枯叶可以再长，干死救不回来，出门前把「蓄水」当成头等大事来准备。',\n    tiers: {\n      short: '浇透 + 浅托盘蓄水即可，不需要复杂装备。',\n      mid: '务必接自吸水绳并放大水桶，同时挪到阴凉处降低蒸发。',\n      long: '自吸装备可能中途见底，强烈建议请人隔周上门补水一次。'\n    }\n  },\n  succulent: {\n    label: '多肉',\n    before: ['出门 3 天前开始减水，出门当天让盆土保持干燥——多肉越干越安全。', '挪离正午直晒的位置，放到通风、明亮散射光的地方。', '撤掉一切托盘蓄水，检查底孔通畅，防止回南天积水闷根。', '顺手清理枯叶与残株，保证盆面干净通风。'],\n    during: '多肉靠自身储水，室内散射光环境下 15 天内基本不用管；夏冬休眠期整月不管都行，尽量不要安排代浇。',\n    back: ['回家先捏叶片：饱满挺实就不用动；皱软明显才沿盆边少量给水。', '光照逐步恢复，先放散射光 2–3 天，再回到全日照，防止突然晒伤。', '发现化水、黑腐叶片及时摘除，保留健康部分重新控水缓苗。'],\n    tip: '多肉出门最大的敌人不是渴，而是好心邻居的天天浇水；交代清楚「不用管」比什么都重要。',\n    tiers: {\n      short: '无需任何补水安排，保持盆土干燥即可。',\n      mid: '15 天内保持盆土干燥更安全，千万不要托盘蓄水。',\n      long: '超过三周可沿盆边给平时一半量的水，其余时间照旧不管。'\n    }\n  }\n};\nconst USAGE_TIPS = ['顶部六个标签可切换工具，也可直接在地址栏输入 #\/water、#\/soil、#\/pest、#\/fert、#\/light、#\/vacation 定位到对应区块，刷新后仍停留在当前工具。', '所有频率与配比都是通用经验值，请结合所在城市气候、盆器材质与植株状态微调；拿不准时按「少浇、少肥、透气」的原则处理。', '纯前端离线运行，不联网、不上传任何数据，完全免费；结果可一键复制，随意分享给朋友。'];\n\nvar prevRefreshReg$9 = window.$RefreshReg$;\n          var prevRefreshSig$9 = window.$RefreshSig$;\n          var RefreshRuntime$9 = window.ReactRefreshRuntime;\n          window.$RefreshReg$ = (type, id) =\u003e {\n            const fullId = '\/src\/sections\/WaterTool.jsx' + ' ' + id;\n            RefreshRuntime$9.register(type, fullId);\n          };\n          window.$RefreshSig$ = RefreshRuntime$9.createSignatureFunctionForTransform;\n          var _s$7 = $RefreshSig$();\nconst React$a = ______gravityEsm_temp_dhN6tAtK__default.__esModule ? ______gravityEsm_temp_dhN6tAtK__default.default : ______gravityEsm_temp_dhN6tAtK__default;\nconst {\n  useState: useState$5\n} = Object.keys(______gravityEsm_temp_dhN6tAtK).length === 1 \u0026\u0026 ______gravityEsm_temp_dhN6tAtK.default ? ______gravityEsm_temp_dhN6tAtK.default : ______gravityEsm_temp_dhN6tAtK;\nconst {\n  Droplets: Droplets\n} = Object.keys(_____________gravityEsm_temp_NX3eersQ).length === 1 \u0026\u0026 _____________gravityEsm_temp_NX3eersQ.default ? _____________gravityEsm_temp_NX3eersQ.default : _____________gravityEsm_temp_NX3eersQ;\nfunction WaterTool() {\n  _s$7();\n  var _PLANT_TYPES$find, _ENVIRONMENTS$find;\n             collectCustomHooksForSignature: function() { return []; },
            findAffectedHostInstances: function() { return []; },
            getFamilyByID: function() { return null; },
            getFamilyByType: function() { return null; },
            hasUnrecoverableErrors: function() { return false; },
            isLikelyComponentType: function() { return false; },
            setSignature: function() { /* no-op */ }
          };
          
          // 初始化全局函数
          window.$RefreshReg$ = function(type, id) {
            // 空实现，独立运行器不需要注册组件
          };
          
          window.$RefreshSig$ = function() {
            return function(type) {
              return type;
            };
          };
          
          console.log('React Refresh runtime initialized for standalone runner');
        }
      }

      // 全局错误捕获
      window.addEventListener('error', (event) => {
        console.error('Global error:', event.error);
      });

      window.addEventListener('unhandledrejection', (event) => {
        console.error('Unhandled promise rejection:', event.reason);
      });

      function insertCssLink(href) {
        const link = document.createElement('link');
        link.id = 'gravity-link';
        link.href = href;
        link.rel = 'stylesheet';
        document.head.appendChild(link);
      }

      function createImportMap(importMapData) {
        if (!importMapData || !importMapData.imports) {
          console.log('📋 无 ImportMap 数据');
          return;
        }
        
        // 移除已存在的 ImportMap
        const existing = document.getElementById('vs-importmap');
        if (existing) existing.remove();
        
        const script = document.createElement('script');
        script.type = 'importmap';
        script.id = 'vs-importmap';
        script.textContent = JSON.stringify(importMapData, null, 2);
        document.head.appendChild(script);

        if (importMapData.css) {
          insertCssLink(importMapData.css);
        }
      }

      function injectCSSAssets(assets) {
        if (!assets || assets.length === 0) {
          console.log('🎨 无 CSS 资源');
          return;
        }
        
        // 只处理 CSS 类型的资源
        const cssAssets = assets.filter(asset => asset.type === 'css');
        
        cssAssets.forEach(asset => {
          // 移除已存在的样式
          const existing = document.getElementById('vs-css-' + asset.fileName);
          if (existing) existing.remove();
          
          const style = document.createElement('style');
          style.id = 'vs-css-' + asset.fileName;
          style.textContent = asset.source;
          document.head.appendChild(style);
          
          console.log('🎨 注入 CSS: ' + asset.fileName);
        });
      }

      function injectHTMLAssets(assets) {
        if (!assets || assets.length === 0) {
          console.log('📄 无 HTML 资源');
          return;
        }
        
        // 查找 HTML 类型的资源
        const htmlAssets = assets.filter(asset => 
          asset.type === 'asset' && asset.fileName.endsWith('.html')
        );
        
        if (htmlAssets.length === 0) {
          console.log('📄 未找到 HTML 文件');
          return;
        }
        
        // 使用第一个 HTML 文件（通常是 index.html）
        const htmlAsset = htmlAssets[0];
        console.log('📄 处理 HTML 资源: ' + htmlAsset.fileName);
        
        try {
          let contentToInject = '';
          
          // 创建临时容器解析 HTML
          const tempDiv = document.createElement('div');
          tempDiv.innerHTML = htmlAsset.source;
          
          // 尝试多种方式提取内容
          const bodyElement = tempDiv.querySelector('body');
          if (bodyElement) {
            // 情况1: 完整的 HTML 文档，有 body 标签
            contentToInject = bodyElement.innerHTML;
            console.log('📄 从 body 元素中提取内容');
          } else {
            // 情况2: HTML 片段或没有 body 标签的内容
            // 检查是否包含 HTML 结构标签
            const hasHtmlStructure = htmlAsset.source.includes('<html') || 
                                   htmlAsset.source.includes('<head') || 
                                   htmlAsset.source.includes('<!DOCTYPE');
            
            if (hasHtmlStructure) {
              // 如果有 HTML 结构但没有 body，可能是格式问题，尝试提取所有内容
              const htmlElement = tempDiv.querySelector('html');
              if (htmlElement) {
                contentToInject = htmlElement.innerHTML;
                console.log('📄 从 html 元素中提取内容');
              } else {
                contentToInject = tempDiv.innerHTML;
                console.log('📄 提取完整 HTML 内容');
              }
            } else {
              // 纯 HTML 片段，直接使用
              contentToInject = htmlAsset.source;
              console.log('📄 使用 HTML 片段内容');
            }
          }
          
          // 清理内容（移除可能的 head 标签内容）
          if (contentToInject.includes('<head')) {
            const cleanDiv = document.createElement('div');
            cleanDiv.innerHTML = contentToInject;
            
            // 移除 head 标签
            const headElements = cleanDiv.querySelectorAll('head');
            headElements.forEach(head => head.remove());
            
            contentToInject = cleanDiv.innerHTML;
            console.log('📄 已清理 head 标签内容');
          }
          
          // 注入到页面的容器中
          if (contentToInject.trim()) {
            const root = document.getElementById('root');
            const app = document.getElementById('app');
            
            if (root) {
              root.innerHTML = contentToInject;
              console.log('📄 HTML 内容已注入到 #root');
            } else if (app) {
              app.innerHTML = contentToInject;
              console.log('📄 HTML 内容已注入到 #app');
            } else {
              console.warn('📄 未找到合适的容器元素 (#root 或 #app)');
            }
          } else {
            console.warn('📄 提取的 HTML 内容为空');
          }
          
        } catch (error) {
          console.error('📄 处理 HTML 资源时出错:', error);
          // 降级处理：直接使用原始内容
          try {
            const root = document.getElementById('root');
            const app = document.getElementById('app');
            
            if (root) {
              root.innerHTML = htmlAsset.source;
              console.log('📄 降级处理：直接注入原始 HTML 内容到 #root');
            } else if (app) {
              app.innerHTML = htmlAsset.source;
              console.log('📄 降级处理：直接注入原始 HTML 内容到 #app');
            }
          } catch (fallbackError) {
            console.error('📄 降级处理也失败:', fallbackError);
          }
        }
      }

      function executeBundle(code) {
        // 移除已存在的脚本
        const existing = document.getElementById('vs-bundle-script');
        if (existing) existing.remove();
        
        const script = document.createElement('script');
        script.type = 'module';
        script.id = 'vs-bundle-script';
        script.textContent = code;
        document.body.appendChild(script);

        console.log('⚡ 代码执行完成');
      }

      function injectExternalDependencies(externalDeps) {
        return new Promise((resolve, reject) => {
          if (!externalDeps || externalDeps.length === 0) {
            resolve();
            return;
          }

          let loadedCount = 0;
          const totalCount = externalDeps.length;
          
          externalDeps.forEach(({ name, var: globalVar, path }) => {
            // 检查是否已存在相同src的script标签
            const existingScript = document.querySelector('script[src="' + path + '"]');
            if (existingScript) {
              console.log('External package ' + name + ' already loaded from ' + path);
              loadedCount++;
              if (loadedCount === totalCount) {
                resolve();
              }
              return;
            }
            
            const script = document.createElement('script');
            script.src = path;
            script.async = false;
            script.onload = () => {
              console.log('✅ External package ' + name + ' loaded from ' + path);
              if (globalVar && !window[globalVar]) {
                console.warn('External package ' + name + ' loaded but global variable ' + globalVar + ' not found');
              }
              loadedCount++;
              if (loadedCount === totalCount) {
                resolve();
              }
            };
            script.onerror = () => {
              console.error('❌ Failed to load external package ' + name + ' from ' + path);
              reject(new Error('Failed to load external package: ' + name));
            };
            document.head.appendChild(script);
          });
        });
      }
  
      async function startStandaloneApp(config) {
        try {
          // 0. 等待 external 依赖加载完成
          if (config.codeConfig && config.codeConfig.external && config.codeConfig.external.length > 0) {
            await injectExternalDependencies(config.codeConfig.external);
            console.log('✅ 所有 external 依赖加载完成');
          }
          
          // 1. 创建 ImportMap（外部依赖管理）
          createImportMap(config.importMap);
          
          // 2. 注入 HTML 资源（如果存在）
          injectHTMLAssets(config.rollupBundle.assets);
          
          // 3. 注入 CSS 资源（从 rollupBundle.assets 获取）
          injectCSSAssets(config.rollupBundle.assets);
          
          // 4. 执行打包后的代码
          executeBundle(config.rollupBundle.code);
        } catch (error) {
          console.error('❌ VisionSnap 启动应用失败:', error);
        }
      }

      // 检查是否有外部配置，否则使用示例配置
      if (window.VISIONSNAP_CONFIG) {
        initReactRefreshRuntime();
        startStandaloneApp(window.VISIONSNAP_CONFIG);
      }
    </script><!-- END vision_snap_config -->
